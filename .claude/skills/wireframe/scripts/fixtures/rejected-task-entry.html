<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Rejected mobile task entry prototype (trimmed)</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
html,body{background:#0e0f11;color:#ececec;font-family:Inter,ui-sans-serif,system-ui,sans-serif}
.sheet{width:390px;height:844px;background:#1e2126;border-radius:6px;border:1px solid #25272c;display:flex;flex-direction:column}
.row{display:flex;align-items:center;gap:8px;padding:10px 12px;border-bottom:1px solid #2a2d33}
.writer{min-height:44px;border-radius:6px;background:#25272c;color:#9a9ba1;font-size:17px}
.mic{width:44px;height:44px;border-radius:22px;background:#c668ff;color:#ffffff}
.flag{color:#e08a4b;font-size:13px;font-weight:600}
.title{font-size:15px;font-weight:600;color:#cfd0d4}
</style>
</head>
<body>
<div class="sheet">
  <div class="row"><span class="title">New task</span><span class="flag">AI</span></div>
  <div class="row writer"><span>What is this task about?</span></div>
  <div class="row"><button class="mic">Mic</button></div>
</div>
</body>
</html>
