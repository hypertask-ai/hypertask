name: Feature map live daily

on:
  schedule:
    - cron: '17 4 * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: feature-map-live-daily
  cancel-in-progress: true

jobs:
  live-pass:
    name: live-pass
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: ^24.22.1
          check-latest: true
          cache: npm
      - name: Install dependencies, Prisma client and Chromium
        timeout-minutes: 20
        run: |
          npm ci --no-audit --no-fund
          npx prisma generate
          bash .github/scripts/install-chromium.sh
      - name: Drive every mapped feature live
        env:
          QA_LOGIN_EMAIL: ${{ secrets.QA_LOGIN_EMAIL }}
          QA_LOGIN_PASSWORD: ${{ secrets.QA_LOGIN_PASSWORD }}
          HYPERTASK_MCP_TOKEN: ${{ secrets.HYPERTASK_MCP_TOKEN }}
          FEATURE_MAP_LIVE: '1'
        run: node .github/scripts/feature-map-live-daily.mjs
      - name: Upload the pass summary and drive logs
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: feature-map-live-${{ github.run_id }}
          path: feature-map-live/
          retention-days: 14
