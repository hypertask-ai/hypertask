name: TestSprite production QA

# Nightly regression pass over a fixed list of 12 web tests (see
# testsprite/nightly-tests.txt) instead of the full TestSprite suite. One run
# is capped at once a day; a failure files a Hypertask ticket so it does not
# go unnoticed (HTPR-6536).
on:
  schedule:
    - cron: '0 2 * * 1-5' # 02:00 UTC, Mon-Fri
  workflow_dispatch: {}

permissions:
  actions: read
  contents: read

jobs:
  testsprite:
    runs-on: ubuntu-latest
    # 12 tests run one after another (not TestSprite's waved --all concurrency),
    # up to --timeout 600s (10m) each = 120m worst case, plus setup/login/cache.
    timeout-minutes: 150
    steps:
      - name: Check out production
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Create today's run marker
        id: day
        env:
          RUN_ATTEMPT: ${{ github.run_attempt }}
          RUN_ID: ${{ github.run_id }}
        run: |
          date=$(date -u +%F)
          prefix="testsprite-production-quota-$date-"
          printf '%s-%s\n' "$RUN_ID" "$RUN_ATTEMPT" > "$RUNNER_TEMP/testsprite-quota-marker"
          {
            echo "date=$date"
            echo "cache-prefix=$prefix"
            echo "cache-key=$prefix$RUN_ID-$RUN_ATTEMPT"
          } >> "$GITHUB_OUTPUT"

      - name: Reserve today's run
        continue-on-error: true
        uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: ${{ runner.temp }}/testsprite-quota-marker
          key: ${{ steps.day.outputs.cache-key }}

      - name: Apply daily run cap
        id: quota
        if: always()
        env:
          CACHE_KEY: ${{ steps.day.outputs.cache-key }}
          CACHE_PREFIX: ${{ steps.day.outputs.cache-prefix }}
          DATE: ${{ steps.day.outputs.date }}
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
        run: |
          # The save action atomically finalizes this run's unique marker before
          # admission. Later markers cannot displace its creation-time rank.
          # Cap is 1 run/day; there is no bypass (workflow_dispatch counts too).
          keys=$(gh api "repos/$REPOSITORY/actions/caches?key=$CACHE_PREFIX&per_page=100" \
            --jq '[.actions_caches[] | {created_at, id, key}] | sort_by(.created_at, .id) | .[].key')
          rank=$(printf '%s\n' "$keys" | awk -v key="$CACHE_KEY" '$0 == key { print NR; exit }')
          if [ -z "$rank" ]; then
            echo "run=false" >> "$GITHUB_OUTPUT"
            echo "::warning::Skipping TestSprite because the daily quota marker could not be reserved."
          elif [ "$rank" -gt 1 ]; then
            echo "run=false" >> "$GITHUB_OUTPUT"
            echo "::notice::Skipping TestSprite because a production QA run already started on $DATE UTC."
          else
            echo "run=true" >> "$GITHUB_OUTPUT"
            echo "::notice::Using today's production QA run for $DATE UTC."
          fi

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        if: steps.quota.outputs.run == 'true'
        with:
          node-version: 22

      - name: Install TestSprite CLI
        if: steps.quota.outputs.run == 'true'
        run: npm install --global @testsprite/testsprite-cli@0.11.0

      - name: Configure the frontend QA login
        id: configure
        if: steps.quota.outputs.run == 'true'
        env:
          QA_LOGIN_EMAIL: ${{ secrets.QA_LOGIN_EMAIL }}
          QA_LOGIN_PASSWORD: ${{ secrets.QA_LOGIN_PASSWORD }}
          TESTSPRITE_API_KEY: ${{ secrets.TESTSPRITE_API_KEY }}
        run: |
          umask 077
          password_file="$RUNNER_TEMP/qa-login-password"
          trap 'rm -f "$password_file"' EXIT
          printf '%s' "$QA_LOGIN_PASSWORD" > "$password_file"
          testsprite project update 411d64f3-c9ec-4032-a4e5-ad0e3f6f57d9 \
            --url https://app.hypertask.ai/qa/login \
            --username "$QA_LOGIN_EMAIL" \
            --password-file "$password_file" >/dev/null

      - name: Run the nightly web test list
        id: tests
        if: steps.quota.outputs.run == 'true' && steps.configure.outcome == 'success'
        env:
          TESTSPRITE_API_KEY: ${{ secrets.TESTSPRITE_API_KEY }}
        run: |
          mkdir -p testsprite-reports
          : > testsprite-reports/failures.txt
          any_run=false
          overall_failed=false
          trim() { sed -e 's/^[[:space:]]*//' -e 's/[[:space:]]*$//'; }
          while IFS= read -r raw_line; do
            line="${raw_line%%#*}"
            comment="${raw_line#*#}"
            id=$(printf '%s' "$line" | trim)
            [ -z "$id" ] && continue
            name=$(printf '%s' "$comment" | trim)
            [ "$comment" = "$raw_line" ] && name="$id"
            any_run=true
            echo "::group::Running $id ($name)"
            if testsprite --output json test run "$id" --wait --timeout 600 --gh-output \
              --summary-file "testsprite-reports/$id.json" > "testsprite-reports/$id-result.json"; then
              echo "passed: $name"
            else
              echo "failed: $name"
              overall_failed=true
              printf '%s (%s)\n' "$id" "$name" >> testsprite-reports/failures.txt
            fi
            echo "::endgroup::"
          done < testsprite/nightly-tests.txt

          if [ "$any_run" != "true" ]; then
            echo "::error::testsprite/nightly-tests.txt produced no test ids to run."
            exit 5
          fi
          if [ "$overall_failed" = "true" ]; then
            echo "::error::TestSprite nightly QA failed; see testsprite-reports/failures.txt."
            exit 1
          fi

      - name: Upload TestSprite reports
        if: always() && steps.quota.outputs.run == 'true'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: testsprite-production-reports
          path: testsprite-reports/
          retention-days: 14

      - name: File a Hypertask ticket for failed tests
        if: always() && steps.quota.outputs.run == 'true' && (steps.configure.outcome != 'success' || steps.tests.outcome != 'success')
        env:
          MCP_TOKEN: ${{ secrets.HYPERTASK_MCP_TOKEN }}
          MCP_BASE_URL: https://app.hypertask.ai
          REPOSITORY: ${{ github.repository }}
          RUN_ID: ${{ github.run_id }}
          CONFIGURE: ${{ steps.configure.outcome }}
        run: |
          set -uo pipefail
          RUN_URL="https://github.com/$REPOSITORY/actions/runs/$RUN_ID"
          if [ "$CONFIGURE" != "success" ]; then
            FAILURES="<p>The QA login configuration step failed, so no tests ran.</p>"
          elif [ -s testsprite-reports/failures.txt ]; then
            FAILURES=$(sed 's/&/\&amp;/g; s/</\&lt;/g; s/>/\&gt;/g' testsprite-reports/failures.txt \
              | awk '{print "<li>"$0"</li>"}')
            FAILURES="<ul>$FAILURES</ul>"
          else
            FAILURES="<p>The test run step did not finish cleanly (crash, cancel, or timeout) and no per-test failures were recorded.</p>"
          fi
          DATE=$(date -u +%F)
          # One stable token so every nightly failure lands on the SAME open
          # ticket instead of a fresh one every weekday.
          DEDTOKEN="testsprite-nightly"
          TITLE="TestSprite nightly QA failed [$DEDTOKEN]"
          DESC="<p><strong>The nightly TestSprite web test run failed on $DATE UTC.</strong></p>$FAILURES<p>Run: <a href=\"$RUN_URL\">$RUN_URL</a></p>"

          if [ -z "${MCP_TOKEN:-}" ]; then
            echo "::error::HYPERTASK_MCP_TOKEN is empty; cannot file a ticket. Failures: $(cat testsprite-reports/failures.txt 2>/dev/null)"
            exit 1
          fi

          # Skip creating a duplicate when an open ticket from a previous
          # nightly failure already exists. The search defaults to status
          # Normal (excludes Archive/Deleted), so only its "Done" section is
          # ours to filter out here. A failed/unreadable search is not
          # treated as "no ticket exists" (that would risk missing an alert
          # entirely) -- fall through to filing.
          if SEARCH=$(curl -sS --fail-with-body \
               "$MCP_BASE_URL/api/mcp/tasks/search?q=$DEDTOKEN&project_id=15&limit=10" \
               -H "Authorization: Bearer $MCP_TOKEN") \
             && [ "$(jq -r '.tasks | type' <<<"$SEARCH" 2>/dev/null)" = "array" ]; then
            EXISTING_TICKET=$(jq -r --arg t "[$DEDTOKEN]" \
              '[.tasks[] | select((.title // "") | contains($t)) | select((.section // "") != "Done")] | .[0].ticketNumber // ""' <<<"$SEARCH")
            if [ -n "$EXISTING_TICKET" ]; then
              echo "An open ticket for nightly TestSprite failures already exists ($EXISTING_TICKET); not filing another."
              exit 0
            fi
          else
            echo "::warning::Could not check for an existing nightly-failure ticket; filing one anyway to avoid a silent miss."
          fi

          BODY=$(jq -n \
            --argjson project_id 15 \
            --argjson section_id 4389 \
            --arg title "$TITLE" \
            --arg description "$DESC" \
            '{project_id: $project_id, section_id: $section_id, title: $title, description: $description}')

          if ! curl -sS --fail-with-body -X POST "$MCP_BASE_URL/api/mcp/tasks/create" \
            -H "Authorization: Bearer $MCP_TOKEN" \
            -H "Content-Type: application/json" \
            -d "$BODY"; then
            echo "::error::Could not file the Hypertask ticket for this failure. File it by hand: $TITLE ($RUN_URL)"
            exit 1
          fi
