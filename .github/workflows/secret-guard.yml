name: secret-guard
on:
  pull_request:
  push:
    branches: [production, main]
permissions:
  contents: read
jobs:
  next-public-secrets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Fail on NEXT_PUBLIC_ secret-named vars
        run: |
          if grep -rnE 'NEXT_PUBLIC_[A-Z0-9_]*(SECRET|PASSWORD|PRIVATE|_PW\b|UPLOAD_KEY)' src --include='*.ts' --include='*.tsx' --include='*.js'; then
            echo "::error::A NEXT_PUBLIC_ env var with a secret-looking name is referenced in source. NEXT_PUBLIC_ vars are inlined into the public browser bundle. Move the check server-side and drop the NEXT_PUBLIC_ prefix."
            exit 1
          fi
          echo "OK: no NEXT_PUBLIC_ secrets referenced in source"
