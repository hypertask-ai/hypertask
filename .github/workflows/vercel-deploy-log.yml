name: Vercel deploy log

# HTPR-6163: nobody on the server holds a Vercel token, so a stuck or failed
# production build cannot be diagnosed from the VPS. This job fetches the
# deployment's build events with the CI token and posts the tail in the agent
# lane of a Hypertask ticket. The repo is public: the log never goes to the Actions
# output, only a line count does.
on:
  workflow_dispatch:
    inputs:
      deployment:
        description: Deployment id (dpl_...). Empty = latest production deployment.
        required: false
        default: ""
      ticket:
        description: Hypertask ticket number (unique index on board 15) that receives the log
        required: true
        default: "6163"

permissions:
  contents: read

env:
  PROJECT_ID: prj_oEok2iMNFPzj6AWe1KQBaIAcPaAf
  TEAM_ID: team_yureFlJZ6ibwebaOOkKc5whs

jobs:
  log:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Fetch build events and post them to the ticket
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          MCP_TOKEN: ${{ secrets.HYPERTASK_MCP_TOKEN }}
          DEPLOYMENT: ${{ inputs.deployment }}
          TICKET: ${{ inputs.ticket }}
        run: |
          set -euo pipefail
          units() { local LC_ALL=C; printf '%s' "${#1}"; }
          api() { curl -sS --fail-with-body -H "Authorization: Bearer $VERCEL_TOKEN" "https://api.vercel.com$1"; }
          # Manual inputs are untrusted: pin both to their expected shapes before use.
          [[ "$TICKET" =~ ^[0-9]{1,7}$ ]] || { echo "ticket must be a board-15 unique index"; exit 1; }
          [[ -z "$DEPLOYMENT" || "$DEPLOYMENT" =~ ^dpl_[A-Za-z0-9]{1,64}$ ]] || { echo "deployment must look like dpl_..."; exit 1; }

          context=$(curl -sS -o /tmp/me.json -w "%{http_code}" "https://app.hypertask.ai/api/mcp/user/context" \
            -H "Authorization: Bearer $MCP_TOKEN")
          [ "$context" = 200 ] || { echo "token check: HTTP $context"; head -c 300 /tmp/me.json; echo; exit 1; }
          [ -n "$(jq -r '.connected_agent.id // empty' /tmp/me.json)" ] || { echo "HYPERTASK_MCP_TOKEN is not an agent token; only an agent token can open a run and write the agent lane"; exit 1; }

          if [ -z "$DEPLOYMENT" ]; then
            DEPLOYMENT=$(api "/v6/deployments?projectId=$PROJECT_ID&teamId=$TEAM_ID&target=production&limit=1" \
              | jq -r '.deployments[0].uid // empty')
          fi
          [ -n "$DEPLOYMENT" ] || { echo "no deployment found"; exit 1; }

          META=$(api "/v13/deployments/$DEPLOYMENT?teamId=$TEAM_ID" \
            | jq -c '{state: (.readyState // .state), errorCode, errorMessage, createdAt, sha: .meta.githubCommitSha}')
          echo "deployment $DEPLOYMENT state: $(echo "$META" | jq -r '.state')"

          # Build events; keep only log-like entries, tail them, redact DB URLs.
          EVENTS=$(api "/v3/deployments/$DEPLOYMENT/events?teamId=$TEAM_ID&builds=1&limit=-1" \
            | jq -r '.[]? | select(.type=="stdout" or .type=="stderr" or .type=="error" or .type=="command" or .type=="fatal")
                     | "\((.created // .date // 0) | tostring) \(.payload.text // .text // "")"' \
            | tail -80 \
            | sed -E -e 's#[a-z]+://[^[:space:]]*@[^[:space:]]+#<url-with-credentials>#g' \
                     -e 's#(token|secret|password|api[_-]?key|authorization)([=: ]+)[^[:space:]]+#\1\2<redacted>#Ig')
          echo "fetched $(printf '%s\n' "$EVENTS" | wc -l) event lines"

          TEXT="Vercel build log for $DEPLOYMENT (vercel-deploy-log workflow, newest first)."$'\n'"Read at $(date -u +%Y-%m-%dT%H:%M:%SZ). $META"
          KEPT=0
          TOTAL=$(printf '%s\n' "$EVENTS" | grep -c '[^[:space:]]' || true)
          while IFS= read -r line; do
            if [ -z "${line//[[:space:]]/}" ]; then continue; fi
            line=${line:0:400}
            if [ $(( $(units "$TEXT") + $(units "$line") + 1 )) -gt 7900 ]; then break; fi
            TEXT+=$'\n'"$line"
            KEPT=$((KEPT + 1))
          done < <(printf '%s\n' "$EVENTS" | tac)
          if [ "$KEPT" -lt "$TOTAL" ]; then
            TEXT+=$'\n'"Earlier lines were dropped to fit the agent log limit."
          fi

          run=$(curl -sS -o /tmp/run.json -w "%{http_code}" -X POST "https://app.hypertask.ai/api/mcp/agents/runs" \
            -H "Authorization: Bearer $MCP_TOKEN" -H "Content-Type: application/json" \
            -d "$(jq -n --arg t "$TICKET" '{taskId: ($t | tonumber), projectId: 15, source: "runtime", title: "Vercel deploy log"}')")
          if [ "$run" != 201 ]; then
            echo "run open: HTTP $run"
            head -c 300 /tmp/run.json; echo; exit 1
          fi
          RUN_ID=$(jq -er '.run.id' /tmp/run.json)
          code=$(curl -s -o /tmp/post.out -w "%{http_code}" -X POST \
            "https://app.hypertask.ai/api/mcp/agents/runs/$RUN_ID/activities" \
            -H "Authorization: Bearer $MCP_TOKEN" -H "Content-Type: application/json" \
            -d "$(jq -n --arg text "$TEXT" '{type: "thought", text: $text}')")
          echo "activity post: HTTP $code"
          curl -s -o /dev/null -X POST "https://app.hypertask.ai/api/mcp/agents/runs/$RUN_ID/stop" \
            -H "Authorization: Bearer $MCP_TOKEN" || true
          case "$code" in
            200|201|202) echo "posted $KEPT lines to the agent lane of 15/$TICKET" ;;
            *) head -c 300 /tmp/post.out; echo; exit 1 ;;
          esac
