name: YPER4-837 release hold read
on:
  push:
    branches: [runner8/yper4-837-width-flag-control]
permissions: {}
jobs:
  release-hold:
    runs-on: ubuntu-latest
    timeout-minutes: 1
    steps:
      - name: Read the repository release hold without changing it
        env:
          MERGE_FREEZE: ${{ vars.MERGE_FREEZE }}
        run: |
          set -euo pipefail
          if [ -n "$MERGE_FREEZE" ]; then
            echo '::error::MERGE_FREEZE is set; release blocked'
            exit 1
          fi
          echo 'MERGE_FREEZE is empty; read-only release hold check passed'
