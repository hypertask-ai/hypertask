name: skills-evals
on:
  pull_request:
    paths:
      - '.claude/skills/**'
      - '.github/workflows/skills-evals.yml'
permissions:
  contents: read
jobs:
  run-evals:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Run skill pack evals
        run: bash .claude/skills/evals/run-evals.sh
