name: Repro first

on:
  pull_request:
    types: [opened, synchronize, reopened, edited, ready_for_review]
    branches: [production]

permissions:
  contents: read

concurrency:
  group: repro-first-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  repro-first:
    name: repro-first
    if: github.event.pull_request.draft == false && contains(github.event.pull_request.title, '[BUGFIX]')
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 1
          persist-credentials: false

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: ^24.22.1
          check-latest: true

      - name: Fetch the base branch
        run: |
          set -euo pipefail
          git fetch --no-tags --unshallow origin
          git fetch --no-tags origin "${{ github.event.pull_request.base.ref }}"

      - name: Skip when no source file changed
        id: scope
        env:
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PR_TITLE: ${{ github.event.pull_request.title }}
        run: node .github/scripts/repro-first.mjs --scope

      - name: Install dependencies
        if: steps.scope.outputs.run == 'true'
        run: npm ci --prefer-offline --no-audit --no-fund && npx prisma generate

      - name: Require a changed test to fail on the old code
        if: steps.scope.outputs.run == 'true'
        env:
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PR_TITLE: ${{ github.event.pull_request.title }}
        run: node .github/scripts/repro-first.mjs
