name: Gitleaks

on: [push, pull_request]

permissions:
  contents: read

jobs:
  secret-scan:
    name: secret-scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
      - name: Run gitleaks
        env:
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          curl -sSfL https://github.com/gitleaks/gitleaks/releases/download/v8.24.3/gitleaks_8.24.3_linux_x64.tar.gz | tar -xz gitleaks
          if [ -n "$PR_BASE_SHA" ]; then
            # A pull request scans only the commits it adds. Everything already on the base branch is
            # covered by the push scan, so one old finding cannot turn every open PR red.
            ./gitleaks detect --no-banner --source . --redact --log-opts "$PR_BASE_SHA..$PR_HEAD_SHA"
          else
            ./gitleaks detect --no-banner --source . --redact
          fi
