name: Break-it review

on:
  pull_request:
    types: [opened, synchronize, reopened, edited, ready_for_review]
    branches: [production]

permissions: {}

concurrency:
  group: break-it-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  break-it:
    name: break-it
    if: github.event.pull_request.draft == false && contains(github.event.pull_request.title, '[BUGFIX]')
    runs-on: ubuntu-latest
    timeout-minutes: 25
    continue-on-error: true
    permissions:
      contents: read
      pull-requests: write
      statuses: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          persist-credentials: false

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: ^24.22.1
          check-latest: true

      - name: Install dependencies
        run: npm ci --prefer-offline --no-audit --no-fund || echo "break-it review could not install dependencies, so the break attempts are skipped"

      - name: Ask another model family to break the fix
        env:
          GH_TOKEN: ${{ github.token }}
          OPENROUTER_EVAL_KEY: ${{ secrets.OPENROUTER_EVAL_KEY }}
          PSTACK_VERIFIER_ALT_MODEL: ${{ vars.PSTACK_VERIFIER_ALT_MODEL }}
          PR: ${{ github.event.pull_request.number }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: node .github/scripts/break-it-review.mjs
