name: Break-it review

on:
  workflow_dispatch:
    inputs:
      pr:
        description: Pull request number to break
        required: true
        type: string

permissions: {}

concurrency:
  group: break-it-${{ inputs.pr }}
  cancel-in-progress: true

jobs:
  break-it:
    name: break-it
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      contents: read
      pull-requests: write
      statuses: write
    steps:
      - name: Resolve the pull request and its two commits
        id: target
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ inputs.pr }}
        run: |
          set -euo pipefail
          row=$(gh api "repos/{owner}/{repo}/pulls/$PR" --jq '[.head.sha, .base.sha, (.head.repo.full_name == .base.repo.full_name), .draft, .state] | @tsv')
          read -r head base same_repo draft state <<<"$row"
          test "$same_repo" = "true" || { echo "::error::PR $PR comes from a fork; nothing to break here."; exit 1; }
          test "$draft" = "false" || { echo "::error::PR $PR is a draft."; exit 1; }
          test "$state" = "open" || { echo "::error::PR $PR is $state."; exit 1; }
          echo "head=$head" >> "$GITHUB_OUTPUT"
          echo "base=$base" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ steps.target.outputs.base }}
          persist-credentials: false
          path: trusted
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ steps.target.outputs.head }}
          persist-credentials: false
          fetch-depth: 0
          path: candidate
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: ^24.22.1
          check-latest: true
      - name: Install the candidate and the sandbox
        id: deps
        working-directory: candidate
        run: |
          command -v bwrap >/dev/null || { sudo apt-get update -qq && sudo apt-get install -y bubblewrap; }
          npm ci --ignore-scripts --prefer-offline --no-audit --no-fund
      - name: Ask another model family to break the fix
        if: ${{ !cancelled() }}
        working-directory: trusted
        env:
          GH_TOKEN: ${{ github.token }}
          OPENROUTER_EVAL_KEY: ${{ secrets.OPENROUTER_EVAL_KEY }}
          PSTACK_VERIFIER_ALT_MODEL: ${{ vars.PSTACK_VERIFIER_ALT_MODEL }}
          PR: ${{ inputs.pr }}
          HEAD_SHA: ${{ steps.target.outputs.head }}
          CANDIDATE: ${{ github.workspace }}/candidate
          BREAK_IT_DEPS: ${{ steps.deps.outcome }}
        run: node .github/scripts/break-it-review.mjs
