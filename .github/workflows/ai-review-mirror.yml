name: AI review verdict to ticket

# YPER4-675: the verdict lived only on the pull request, because the private
# reviewer repository mirrored it with its own board token and that login is
# rejected ("Unauthorized"), hidden behind `continue-on-error`. This workflow
# does the copy from here instead: the application repository already holds the
# board token that binds titles and files tickets today, and the ticket lives on
# this board. No new secret, no new permission, no candidate code is checked
# out or run - the PR number and the review comment text arrive as data.
#
# YPER4-925: the mirror died on a GitHub App installation rate limit
# (403, x-ratelimit-remaining: 0) 82 seconds before the window reset, and the
# verdict was lost. Both GitHub reads now use the shared reset-aware retry that
# the other trusted workflows already import, bounded to this job's timeout, so
# a full installation window fails with the rate limit named instead of a
# missing verdict.
#
# YPER4-978: the board stopped accepting the mirror's people comment. The voice
# guard (YPER4-910) refuses technical text in the thread people read, and the
# findings carry paths, code and long sentences, so five real mirrors failed
# with HTTP 400 while the skip runs stayed green. The thread now gets one short
# plain verdict line that points at the pull request; the agent log answers this
# token with HTTP 503, so the findings stay where they already are.
on:
  issue_comment:
    types: [created, edited]
  workflow_dispatch:
    inputs:
      pr:
        description: Pull request number whose latest AI review verdict goes to its ticket
        required: true
        type: string

permissions:
  contents: read
  pull-requests: read

# The author is part of the group so an ordinary comment on the same pull
# request cannot cancel the delivery the reviewer just woke, and cancelling is
# off so a queued round re-reads the newest verdict instead of racing it.
concurrency:
  group: ai-review-mirror-${{ github.event.issue.number || inputs.pr }}-${{ github.event.comment.user.login || 'dispatch' }}
  cancel-in-progress: false

jobs:
  mirror:
    name: Copy the verdict to the ticket
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      # Only the shared retry helper from the production default branch, never
      # candidate code: no credentials are persisted for it.
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: production
          fetch-depth: 1
          sparse-checkout: .github/scripts
          persist-credentials: false
      - uses: actions/github-script@60a0d83039c74a4aee543508d2ffcb1c3799cdea # v7
        env:
          HYPERTASK_MCP_TOKEN: ${{ secrets.HYPERTASK_MCP_TOKEN }}
          # Machine account that writes the review comment, with or without the
          # [bot] suffix the same account carries in each API. Only its comment
          # is mirrored, so a comment by anyone else never reaches a ticket.
          REVIEW_COMMENT_AUTHOR: hypertask-ai-review
        with:
          script: |
            const REVIEW_AUTHOR = process.env.REVIEW_COMMENT_AUTHOR;
            // The event payload and the REST API name the same GitHub App
            // account differently: hypertask-ai-review[bot] arrives on a comment
            // event, hypertask-ai-review comes back from the API. Comparing the
            // raw logins skipped every real comment and mirrored nothing.
            const isReviewer = login =>
              String(login ?? '').replace(/\[bot\]$/, '') === REVIEW_AUTHOR;
            const APP = 'https://app.hypertask.ai';
            const repository = `${context.repo.owner}/${context.repo.repo}`;
            const token = process.env.HYPERTASK_MCP_TOKEN;

            if (!token) {
              core.setFailed('HYPERTASK_MCP_TOKEN is missing; the verdict cannot reach the ticket.');
              return;
            }

            // A comment on an issue is not a review; leave it alone without an
            // API call, so the workflow costs nothing on ordinary discussion.
            let prNumber;
            if (context.eventName === 'issue_comment') {
              if (!context.payload.issue?.pull_request) {
                core.info('Comment is not on a pull request; nothing to mirror.');
                return;
              }
              const author = context.payload.comment?.user?.login;
              if (!isReviewer(author)) {
                core.info(`Comment author ${author} is not ${REVIEW_AUTHOR}; nothing to mirror.`);
                return;
              }
              prNumber = context.payload.issue.number;
            } else {
              prNumber = Number(context.payload.inputs?.pr);
              if (!Number.isSafeInteger(prNumber) || prNumber <= 0) {
                core.setFailed('workflow_dispatch needs a numeric pr input.');
                return;
              }
            }

            // The installation shares one hourly GitHub budget with the whole
            // fleet, so a 403 here usually means "later", not "failed". The
            // waits stay inside this job's 10-minute timeout, and a wait past
            // the budget fails with the rate limit named instead of silently
            // dropping the verdict.
            const { retryGithubRequest, createRateLimitBudget } =
              await import(`${process.env.GITHUB_WORKSPACE}/.github/scripts/github-rate-limit.mjs`);
            const budget = createRateLimitBudget({ maxWaitMs: 240_000, timeBudgetMs: 420_000 });
            const readGithub = async (read) => {
              try {
                return await retryGithubRequest(read, { budget, log: core.warning });
              } catch (error) {
                if (!error.rateLimited) throw error;
                core.setFailed(error.message);
                return null;
              }
            };

            const prResponse = await readGithub(() => github.rest.pulls.get({
              ...context.repo,
              pull_number: prNumber,
            }));
            if (!prResponse) return;
            const pr = prResponse.data;

            if (pr.base.ref !== 'production') {
              core.info(`PR #${prNumber} targets ${pr.base.ref}, not production; nothing to mirror.`);
              return;
            }
            // The branch name is only trustworthy inside this repository, and
            // the same-repository rule is what the title guard already binds.
            if (pr.base.repo?.full_name !== repository || pr.head.repo?.full_name !== repository) {
              core.info(`PR #${prNumber} is not a same-repository PR; nothing to mirror.`);
              return;
            }

            const ticket = /(htpr|yper4|hyfa)-\d+/i.exec(pr.head.ref)?.[0]?.toUpperCase();
            if (!ticket) {
              core.info(`Branch ${pr.head.ref} names no ticket; nothing to mirror.`);
              return;
            }

            // The reviewer upserts one comment per pull request, so several
            // verdicts can sit on it. Only the one that reviewed the current
            // head describes what will merge; an older verdict must never reach
            // the ticket as if it were the current one.
            const prComments = await readGithub(() => github.paginate(github.rest.issues.listComments, {
              ...context.repo,
              issue_number: prNumber,
              per_page: 100,
            }));
            if (!prComments) return;
            const verdicts = prComments.filter(comment =>
              isReviewer(comment.user?.login) &&
              /^(APPROVE|CONCERNS)\b/.test(comment.body ?? ''));
            const headSha = pr.head?.sha;
            const review = verdicts.findLast(comment =>
              /reviewed-commit:\s*([0-9a-f]{40})/.exec(comment.body ?? '')?.[1] === headSha);
            if (!review) {
              core.info(
                `PR #${prNumber} has no verdict for head ${String(headSha).slice(0, 12)} yet ` +
                `(${verdicts.length} older verdict comment(s)); nothing to mirror.`);
              return;
            }

            const body = review.body ?? '';
            const verdict = body.split('\n')[0].trim().slice(0, 300);
            const sha = /reviewed-commit:\s*([0-9a-f]{40})/.exec(body)?.[1];

            const escapeHtml = value => value
              .replace(/&/g, '&amp;')
              .replace(/</g, '&lt;')
              .replace(/>/g, '&gt;')
              .replace(/"/g, '&quot;');
            // The board refuses technical text in a people comment: no paths, no
            // code, no sentence over twelve words (YPER4-910). Findings are all
            // of that, and the agent log answers this token with HTTP 503, so the
            // ticket gets one short plain line that points at the pull request.
            const verdictWord = /^(APPROVE|CONCERNS)\b/.exec(verdict)?.[1] ?? 'APPROVE';
            const text = [
              `<p><strong>AI review (PR <a href="${escapeHtml(pr.html_url)}">#${pr.number}</a>):</strong> ${verdictWord}.</p>`,
              `<p>Findings are in the pull request.</p>`,
            ].join('\n');

            const appRequest = (path, init = {}) => fetch(`${APP}${path}`, {
              ...init,
              redirect: 'error',
              signal: AbortSignal.timeout(30_000),
              headers: {
                Authorization: `Bearer ${token}`,
                'Content-Type': 'application/json',
                ...(init.headers ?? {}),
              },
            });

            // `kind: qa` keeps the line in the ticket thread people read: an
            // agent comment without a kind is filed in the hidden agent log. The
            // per-commit key makes a re-run or an edited verdict a no-op (YPER4-925).
            const response = await appRequest('/api/mcp/comments', {
              method: 'POST',
              headers: { 'Idempotency-Key': `ai-review-mirror-${prNumber}-${sha}` },
              body: JSON.stringify({ ticket_number: ticket, kind: 'qa', text }),
            });
            const result = await response.json().catch(() => ({}));
            if (!response.ok || result.success !== true) {
              core.setFailed(
                `Posting the verdict to ${ticket} failed: HTTP ${response.status} ` +
                `${result.error ?? result.message ?? 'no error text'}.`,
              );
              return;
            }
            core.info(`Mirrored ${verdictWord} for ${sha.slice(0, 12)} to ${ticket}: ${result.url ?? 'saved'}`);
