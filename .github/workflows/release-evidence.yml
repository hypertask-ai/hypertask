name: Release evidence
on:
  push:
    branches: [production]
concurrency:
  group: release-evidence-${{ github.sha }}
  cancel-in-progress: false
jobs:
  release-evidence:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      actions: read
      pull-requests: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '^24.22.1'
          check-latest: true
      - name: Require a recording for each changed feature area
        env:
          GH_TOKEN: ${{ github.token }}
        run: node .github/scripts/release-evidence-gate.mjs --sha "${{ github.sha }}"
