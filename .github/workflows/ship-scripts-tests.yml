name: Ship scripts tests

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    branches: [production]
    paths:
      - '.claude/skills/ship/scripts/**'
      - '.claude/skills/vcc/bin/**'
      - '.claude/skills/scriptify/scripts/**'
      - '.claude/skills/maintain-verification-skill/scripts/**'
      - '.claude/systemd/**'
      - 'scripts/daily-stats*'
      - 'scripts/proc-watchdog*'
      - 'scripts/premerge-local.sh'
      - 'scripts/premerge-local-*.mjs'
      - '.claude/skills/verify-qa/scripts/**'
      - '.github/workflows/ship-scripts-tests.yml'
      - 'docs/ci-policy.yml'
      - '.github/scripts/ci-runner-policy.cjs'
      - '.github/workflows/pr-guards-trusted.yml'
      - 'tests/ci-runner-policy.test.cjs'
      - 'tests/ship-ledger-home.test.cjs'

permissions:
  contents: read

concurrency:
  group: ship-scripts-tests-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  ship-scripts-tests:
    name: ship-scripts-tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: ^24.22.1
          check-latest: true

      - name: Install the workflow parser
        run: npm ci --prefix .github/scripts/node-version-guard --ignore-scripts --no-audit --no-fund

      - name: CI runner policy fixtures
        env:
          NODE_PATH: ${{ github.workspace }}/.github/scripts/node-version-guard/node_modules
        run: node --test tests/ci-runner-policy.test.cjs tests/pr-guards-workflow.test.cjs tests/pr-title-workflow.test.cjs tests/pr-ticket-binding.test.cjs

      - name: Install offline test dependencies
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y python3 jq git
          mkdir -p "$RUNNER_TEMP/ship-scripts-home" "$RUNNER_TEMP/ship-scripts-bin"
          cat > "$RUNNER_TEMP/ship-scripts-bin/gh" <<'SH'
          #!/usr/bin/env bash
          echo 'Unexpected gh call outside offline test fixtures' >&2
          exit 1
          SH
          chmod +x "$RUNNER_TEMP/ship-scripts-bin/gh"
          echo "$RUNNER_TEMP/ship-scripts-bin" >> "$GITHUB_PATH"

      - name: Run offline ship script tests
        env:
          HOME: ${{ runner.temp }}/ship-scripts-home
        shell: bash
        run: |
          set -euo pipefail
          bash .claude/skills/vcc/bin/vcc.test.sh
          bash .claude/skills/ship/scripts/ship-check.test.sh --premerge-only
          python3 .claude/skills/ship/scripts/ship-check-finish.test.py
          python3 .claude/skills/ship/scripts/premerge-evidence.test.py
          python3 .claude/skills/ship/scripts/ci-why.test.py
          node --test .claude/skills/ship/scripts/production-red-alert.test.mjs
          bash .claude/skills/ship/scripts/board-check.test.sh
          bash .claude/skills/ship/scripts/user-unit-check.test.sh
          python3 .claude/skills/ship/scripts/ht-hax-runner.test.py
          python3 .claude/skills/ship/scripts/pr-drain-pick.test.py
          python3 .claude/skills/ship/scripts/runner-pickup.recovery.test.py
          python3 .claude/skills/ship/scripts/runner-domain-admit.test.py
          python3 .claude/skills/ship/scripts/runner-pickup.domain.test.py
          bash .claude/skills/ship/scripts/runner-pickup.test.sh
          python3 .claude/skills/verify-qa/scripts/evidence-prune.test.py
          node --test .claude/skills/verify-qa/scripts/qa-identity.test.mjs .claude/skills/verify-qa/scripts/qa-login.test.mjs
          node --test .claude/skills/verify-qa/scripts/qa-teams.test.mjs

      - name: Replay incident grouping and claim collision checks
        env:
          HOME: ${{ runner.temp }}/ship-scripts-home
        run: |
          bash .claude/skills/ship/scripts/error-collector.test.sh
          node --test .claude/skills/ship/scripts/error-collector/incident-grouping.test.mjs
          bash .claude/skills/ship/scripts/ship-claim.test.sh

  ship-scripts-tests-siblings:
    name: ship-scripts-tests-siblings
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: ^24.22.1
          check-latest: true

      - name: Check out the ledger checker the ship-gates fixture runs
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          repository: Leonxlnx/unlazy
          ref: 16671491f6679ad9378f52604d3bc2415b4120c7
          path: .ship-scripts-unlazy
          persist-credentials: false

      - name: Install offline test dependencies
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y python3 jq git
          mkdir -p "$RUNNER_TEMP/ship-scripts-home/.agents/skills" "$RUNNER_TEMP/ship-scripts-bin"
          ln -s "$GITHUB_WORKSPACE/.ship-scripts-unlazy" "$RUNNER_TEMP/ship-scripts-home/.agents/skills/unlazy"
          cat > "$RUNNER_TEMP/ship-scripts-bin/gh" <<'SH'
          #!/usr/bin/env bash
          echo 'Unexpected gh call outside offline test fixtures' >&2
          exit 1
          SH
          chmod +x "$RUNNER_TEMP/ship-scripts-bin/gh"
          echo "$RUNNER_TEMP/ship-scripts-bin" >> "$GITHUB_PATH"

      - name: Run the sibling offline ship script tests
        env:
          HOME: ${{ runner.temp }}/ship-scripts-home
        shell: bash
        run: |
          set -euo pipefail
          python3 .claude/skills/ship/scripts/disk-guard.test.py
          node --test .claude/skills/ship/scripts/error-collector/collector.test.mjs
          node --test .claude/skills/ship/scripts/error-collector/sources.test.mjs
          node --test .claude/skills/ship/scripts/error-collector/vercel-logs.test.mjs
          bash .claude/skills/ship/scripts/mcp-contract-watch.test.sh
          bash .claude/skills/ship/scripts/ship-gates.test.sh
          node --test tests/ship-ledger-home.test.cjs
          python3 scripts/daily-stats.test.py
          python3 scripts/proc-watchdog.test.py
          node --test scripts/premerge-local-flags.test.mjs
          node --test scripts/premerge-local-search.test.mjs
