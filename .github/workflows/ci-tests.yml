name: CI Tests

# Correctness gate that runs on free GitHub-hosted runners without using a Vercel
# build slot. Purpose: let PRs be verified for merge without competing for the
# Vercel build slot. This is the intended required check; the preview is not.
#
# It also runs on every push to `production`. A PR can be green against the base it
# branched from and still break once squash-merged onto a production that has moved
# (HTPR-4632: PR #1959 merged with ci-build SUCCESS, then failed the production
# build). Nothing typechecked the merge result, so the first signal was a failed
# Vercel prod deploy blocking every later release. This makes the merge commit
# itself a checked artifact.
on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review, edited, labeled]
  push:
    branches: [production]

concurrency:
  group: ci-tests-${{ github.event.pull_request.number || github.ref }}
  # Superseded PR runs are waste, but every production run must finish its full
  # test report and warning path.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  ci-tests:
    name: ci-tests
    # Skip drafts and bot-authored PRs (the Vercel bot); pushes always run.
    # Dependabot is the one bot exception (Valentin, 2026-09-08): its patch/minor
    # PRs auto-merge, and "merged when tests are green" needs a test result to
    # exist. `dependabot-stack.yml` applies the `full-ci` label that arms this.
    # Review-first gate (owner, 2026-08-26): a PR run also needs the full-ci
    # label, which the pr-feedback timer applies once GitHub AI Review is green.
    # This makes the typecheck+test gate run once per ready PR (plus once per
    # fix-up push after that) instead of on open and on every label event.
    # ci-build stays a required automerge check, so an unlabeled PR simply
    # waits: review first, then the gate, then the merge.
    if: github.event_name == 'push' || (github.event.pull_request.draft == false && (!endsWith(github.event.pull_request.user.login, '[bot]') || github.event.pull_request.user.login == 'dependabot[bot]') && contains(github.event.pull_request.labels.*.name, 'full-ci'))
    runs-on: ubuntu-latest
    timeout-minutes: 25
    # This job checks out and executes pull request code, so it never holds a
    # write token. The production warning is a separate push-only job.
    permissions:
      contents: read
      # The fail-fast step reads the PR's labels live (see revert-guard.yml).
      # Without this the gh call 403s, PR_LABELS falls back to [], and an
      # intentional-revert label is silently ignored.
      pull-requests: read
      issues: read
      checks: read
      # "Skip the build when the review is already red" reads commit statuses
      # for GitHub AI Review; without this the gh call 403s and aborts the job.
      statuses: read
    outputs:
      test_failed: ${{ steps.test-outcome.outputs.failed }}
      failed_tests: ${{ steps.test-outcome.outputs.failed_tests }}
    steps:
      # An administrator applied HTPR-6237 on 2026-09-08. Run 34278240903
      # proved this read-only token can verify both live settings.
      - name: Verify live required-check settings
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        shell: bash
        run: |
          set -euo pipefail
          default_branch=$(gh api "repos/$REPO" --jq .default_branch)
          [ "$default_branch" = production ] || {
            echo "::error::Repository default branch is $default_branch, expected production."
            exit 1
          }

          ruleset_id=$(gh api "repos/$REPO/rulesets?per_page=100" --jq '
            [.[] | select(.name == "production-required-checks" and .enforcement == "active")] |
            if length == 1 then .[0].id else empty end
          ')
          [ -n "$ruleset_id" ] || {
            echo "::error::Expected one active production-required-checks ruleset."
            exit 1
          }

          ruleset_json=$(gh api "repos/$REPO/rulesets/$ruleset_id")
          jq -e '
            .target == "branch" and
            (.conditions.ref_name.include | index("refs/heads/production") != null) and
            (.conditions.ref_name.exclude | index("refs/heads/production") == null)
          ' <<<"$ruleset_json" >/dev/null || {
            echo "::error::The required-check ruleset does not protect production."
            exit 1
          }

          expected=$(printf '%s\n' app-smoke browser-smoke ci-tests ai-review feature-flag-gate next-public-secrets pr-title revert-guard secret-scan | sort)
          actual=$(jq -r '
            [.rules[] | select(.type == "required_status_checks") |
              .parameters.required_status_checks[].context | if . == "claude-review" then "ai-review" else . end] | unique | sort | .[]
          ' <<<"$ruleset_json")
          [ "$actual" = "$expected" ] || {
            echo "::error::Live required checks do not match docs/ci-policy.yml."
            diff -u <(printf '%s\n' "$expected") <(printf '%s\n' "$actual") || true
            exit 1
          }

      # Never build a commit whose review already failed (owner, 2026-08-26).
      # This does NOT wait: a pending or absent verdict builds in parallel as
      # normal; only an existing red verdict stops the build before it starts.
      - name: Skip the build when the review is already red
        if: github.event_name == 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          STATE=$(gh api "repos/${{ github.repository }}/commits/$HEAD_SHA/status?per_page=100" --jq '
            [.statuses[] | select(.context == "ai-review" or .context == "claude-review") | {context, state}]
            | group_by(.context) | map(.[0])
            | if any(.[]; .state == "success") then "success"
              elif any(.[]; .state == "failure") then "failure" else "none" end')
          [ "$STATE" != "failure" ] || { echo "::error::GitHub AI Review already failed for $HEAD_SHA; fix the findings and push - the new commit builds normally."; exit 1; }
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 1

      # ci-build is a required status check, so path-filtered PRs must still
      # report success (paths-ignore at the trigger level would leave it
      # pending forever). Instead: diff against the PR base here and skip the
      # Next.js build/test steps when every changed file is doc/worker-only.
      # Pushes to production always run the full build.
      - name: Determine change scope
        id: scope
        if: github.event_name == 'pull_request'
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          git fetch --depth=1 origin "$BASE_SHA" "$HEAD_SHA"
          CHANGED=$(git diff --name-only "$BASE_SHA" "$HEAD_SHA")
          printf '%s\n' "$CHANGED" > "$RUNNER_TEMP/changed-files.txt"
          echo "$CHANGED"
          # A change to this gate itself (or the CI scripts) always runs the
          # full pipeline once, so the edited workflow is exercised end to end.
          if echo "$CHANGED" | grep -qvE '^(scripts/self_hosted_agent/|openwiki/|docs/|\.claude/|\.github/)' \
            || echo "$CHANGED" | grep -qE '^\.github/(workflows/ci-tests\.yml|scripts/)'; then
            echo "build_needed=true" >> "$GITHUB_OUTPUT"
          else
            echo "build_needed=false" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        if: github.event_name == 'push' || steps.scope.outputs.build_needed == 'true'
        with:
          node-version: 20

      # revert-guard.yml is the authoritative check. This duplicates its
      # invocation so a doomed PR fails in seconds instead
      # of occupying a hosted runner for a full 20-minute build.
      # Runs the head sha through a temporary checkout, then restores the
      # original ref so the build steps below still build the merge commit.
      - name: Fail fast if revert-guard would fail
        if: github.event_name == 'pull_request' && steps.scope.outputs.build_needed == 'true'
        env:
          GITHUB_BASE_REF: ${{ github.base_ref }}
          # Live fetch, not the event payload: the payload freezes labels at
          # trigger time, so intentional-revert added after the run fires (or
          # before a rerun) was invisible and cost a retrigger commit every time.
          GH_TOKEN: ${{ github.token }}
          HUMAN_APPROVERS: ${{ vars.HUMAN_APPROVERS || 'valentinyeo' }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          PR_HEAD_IS_FORK: ${{ github.event.pull_request.head.repo.full_name != github.repository }}
          PR_EVENT_ACTION: ${{ github.event.action }}
          PR_BASE_EDITED: ${{ github.event.changes.base != null }}
          PR_EVENT_TIMESTAMP: ${{ github.event.pull_request.updated_at }}
        run: |
          PR_LABELS=$(gh api --paginate "repos/${{ github.repository }}/issues/$PR_NUMBER/labels?per_page=100" --jq '.[] | {name}') || PR_LABELS=""
          PR_LABELS=$(printf '%s\n' "$PR_LABELS" | jq -s '.')
          export PR_LABELS
          ORIG_SHA=$(git rev-parse HEAD)
          git fetch --unshallow --quiet || git fetch --quiet
          git fetch --quiet origin "$GITHUB_BASE_REF:refs/remotes/origin/$GITHUB_BASE_REF" "$PR_HEAD_SHA"
          git show "origin/$GITHUB_BASE_REF:.github/scripts/revert-guard.mjs" > "$RUNNER_TEMP/rg.mjs"
          git checkout --quiet "$PR_HEAD_SHA"
          STATUS=0
          node "$RUNNER_TEMP/rg.mjs" || STATUS=$?
          git checkout --quiet "$ORIG_SHA"
          if [ "$STATUS" -ne 0 ]; then
            echo "::error::revert-guard would fail; fix that first (or add intentional-revert), then re-run"
            exit 1
          fi

      - name: Resolve dependency cache version
        id: dependency-cache-version
        run: |
          echo "node-abi=$(node -p 'process.versions.modules')" >> "$GITHUB_OUTPUT"
          echo "npm-major=$(npm --version | cut -d. -f1)" >> "$GITHUB_OUTPUT"

      - name: Restore node_modules cache
        id: restore-node-modules
        if: github.event_name == 'push' || steps.scope.outputs.build_needed == 'true'
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: node_modules
          key: node-modules-${{ runner.os }}-${{ runner.arch }}-abi${{ steps.dependency-cache-version.outputs.node-abi }}-npm${{ steps.dependency-cache-version.outputs.npm-major }}-${{ hashFiles('package-lock.json', 'package.json', '.npmrc') }}

      - name: Restore ESLint cache
        id: restore-eslint-cache
        if: github.event_name == 'push' || steps.scope.outputs.build_needed == 'true'
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: .cache/eslint
          key: eslint-${{ runner.os }}-${{ hashFiles('package-lock.json', 'eslint.config.mjs', 'tsconfig.json') }}-${{ github.sha }}
          restore-keys: |
            eslint-${{ runner.os }}-${{ hashFiles('package-lock.json', 'eslint.config.mjs', 'tsconfig.json') }}-

      - name: Relocate ESLint cache
        if: github.event_name == 'push' || steps.scope.outputs.build_needed == 'true'
        run: node .github/scripts/relocate-eslint-cache.mjs .cache/eslint/.eslintcache "$GITHUB_WORKSPACE"

      - name: Install dependencies
        if: (github.event_name == 'push' || steps.scope.outputs.build_needed == 'true') && steps.restore-node-modules.outputs.cache-hit != 'true'
        run: npm ci --prefer-offline --no-audit --no-fund

      - name: Save node_modules cache
        # PRs restore the trusted production cache, but only production pushes save.
        if: github.event_name == 'push' && steps.restore-node-modules.outputs.cache-hit != 'true'
        uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: node_modules
          key: ${{ steps.restore-node-modules.outputs.cache-primary-key }}

      - name: Generate Prisma client
        if: github.event_name == 'push' || steps.scope.outputs.build_needed == 'true'
        run: npx prisma generate

      - name: Restore TypeScript cache
        id: restore-tsc-cache
        # A stale tsbuildinfo is safe: tsc validates it against file hashes and
        # falls back to a full check when they differ.
        if: github.event_name == 'push' || steps.scope.outputs.build_needed == 'true'
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: .cache/tsc
          key: tsc-${{ runner.os }}-${{ hashFiles('package-lock.json', 'tsconfig.json') }}-${{ github.sha }}
          restore-keys: |
            tsc-${{ runner.os }}-${{ hashFiles('package-lock.json', 'tsconfig.json') }}-

      - name: Typecheck
        # Next.js generates route-handler signature checks outside ordinary tsc.
        # Generate them first so CI catches the same errors as the Vercel build.
        if: github.event_name == 'push' || steps.scope.outputs.build_needed == 'true'
        run: npx next typegen && npx tsc --noEmit --incremental --tsBuildInfoFile .cache/tsc/tsbuildinfo

      - name: Save TypeScript cache
        # PRs may restore the trusted production cache, but only production pushes save.
        if: github.event_name == 'push' && steps.restore-tsc-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: .cache/tsc
          key: ${{ steps.restore-tsc-cache.outputs.cache-primary-key }}

      - name: Lint
        if: github.event_name == 'push' || steps.scope.outputs.build_needed == 'true'
        run: npm run lint -- --cache --cache-strategy content --cache-location .cache/eslint/.eslintcache

      - name: Save ESLint cache
        # PRs may restore the trusted base-branch cache, but only production pushes
        # may refresh it. This prevents untrusted PR cache data from becoming a
        # production input while still accelerating every subsequent PR.
        # cache-hit is true only for an exact primary-key match. Restoring the
        # previous production SHA through restore-keys returns false, so every new
        # production commit saves a refreshed cache; only same-SHA reruns skip it.
        if: github.event_name == 'push' && steps.restore-eslint-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: .cache/eslint
          key: ${{ steps.restore-eslint-cache.outputs.cache-primary-key }}

      # Every PR body claims "npm test N passed" and nothing checked it, so a
      # broken suite sat green on production for days (HTPR-5161).
      # HT_REQUIRE_PG_TESTS turns the real-PostgreSQL suites' "docker missing"
      # skip into a hard failure. Locally a developer without docker still gets a
      # clean skip; here a skip would be the same false green that let PR #2789's
      # task-write outage through (HTPR-5467).
      # PR lane: run only the tests that reference something this PR touched.
      # The full suite is the production lane's job (below), where a red run
      # warns without changing the live site. Selection falls back to the whole
      # suite whenever it cannot be confident (dependency/schema change, wide
      # fan-out, nothing matched).
      - name: Select tests for changed files
        id: select
        if: github.event_name == 'pull_request' && steps.scope.outputs.build_needed == 'true'
        shell: bash
        run: |
          set -euo pipefail
          # Run the selector from the BASE branch, not the PR workspace: a PR
          # must not be able to edit the thing deciding which of its tests run.
          # The selector still reads the PR's own tests (cwd is the workspace).
          SEL="$RUNNER_TEMP/selector"
          mkdir -p "$SEL/.github/scripts" "$SEL/scripts"
          git fetch --depth=1 --quiet origin "$GITHUB_BASE_REF"
          if git show "FETCH_HEAD:.github/scripts/select-tests.mjs" > "$SEL/.github/scripts/select-tests.mjs" \
            && git show "FETCH_HEAD:scripts/test-inventory.mjs" > "$SEL/scripts/test-inventory.mjs"; then
            SELECTED=$(node "$SEL/.github/scripts/select-tests.mjs" < "$RUNNER_TEMP/changed-files.txt")
          else
            # No trusted selector on the base branch yet: run everything.
            SELECTED=ALL
          fi
          echo "$SELECTED"
          if [ "$SELECTED" = "ALL" ]; then
            echo "files=" >> "$GITHUB_OUTPUT"
            echo "require_pg=1" >> "$GITHUB_OUTPUT"
          else
            echo "files=$(echo "$SELECTED" | tr '\n' ' ')" >> "$GITHUB_OUTPUT"
            if echo "$SELECTED" | grep -q -- '-postgres\.test\.cjs'; then
              echo "require_pg=1" >> "$GITHUB_OUTPUT"
            else
              echo "require_pg=" >> "$GITHUB_OUTPUT"
            fi
          fi

      - name: Test
        if: github.event_name != 'push' && steps.scope.outputs.build_needed == 'true'
        env:
          HT_REQUIRE_PG_TESTS: ${{ steps.select.outputs.require_pg }}
        run: npm test -- ${{ steps.select.outputs.files }}

      - name: Test with coverage collection
        id: push-test
        if: github.event_name == 'push'
        shell: bash
        env:
          NODE_V8_COVERAGE: coverage/raw
          HT_REQUIRE_PG_TESTS: "1"
        run: npm test 2>&1 | tee "$RUNNER_TEMP/push-test.log"

      - name: Record push test outcome
        id: test-outcome
        if: always() && github.event_name == 'push'
        shell: bash
        run: |
          echo "failed=${{ steps.push-test.outcome == 'failure' }}" >> "$GITHUB_OUTPUT"
          failures=""
          if [ -f "$RUNNER_TEMP/push-test.log" ]; then
            failures=$(sed -nE 's/^[[:space:]]*not ok [0-9]+ - (.*)$/\1/p' "$RUNNER_TEMP/push-test.log" \
              | awk 'BEGIN { ORS="" } NR <= 3 { if (NR > 1) printf "; "; printf "%s", $0 }')
          fi
          echo "failed_tests=${failures:-test command failed before naming a test}" >> "$GITHUB_OUTPUT"

      - name: Build report-only coverage baseline
        if: github.event_name == 'push'
        continue-on-error: true
        run: npm run coverage:report

      - name: Upload coverage baseline
        if: always() && github.event_name == 'push'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: automated-test-coverage-${{ github.sha }}
          path: |
            coverage/report/
            coverage/critical-domains.json
            coverage/critical-domains.md
          if-no-files-found: warn
          retention-days: 30

  browser-smoke:
    name: browser-smoke
    if: github.event_name == 'push' || (github.event.pull_request.draft == false && (!endsWith(github.event.pull_request.user.login, '[bot]') || github.event.pull_request.user.login == 'dependabot[bot]') && contains(github.event.pull_request.labels.*.name, 'full-ci'))
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      contents: read
    services:
      postgres:
        image: postgres:16-bookworm@sha256:bb3e1a57e5407e0a5280b4211980a5e537f4abd234a87014ac979849a78dd825
        env:
          POSTGRES_DB: hypertask_smoke
          POSTGRES_USER: browser_smoke
          POSTGRES_PASSWORD: browser_smoke
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U browser_smoke -d hypertask_smoke"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
      redis:
        image: redis:7-alpine@sha256:ff02b58f971e7d7d156a1267e283fcbbeee91773b6aa36c49dac28ecfe28eadf
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
      soketi:
        image: quay.io/soketi/soketi:1.6-16-alpine@sha256:5e45fe1adbf2d4ef8022d0126a3c7e4371b7b08f35784b76a2dc353954ee885c
        env:
          SOKETI_DEFAULT_APP_ID: app-id
          SOKETI_DEFAULT_APP_KEY: app-key
          SOKETI_DEFAULT_APP_SECRET: app-secret
        ports:
          - 6001:6001
        options: >-
          --health-cmd "wget --no-verbose --tries=1 --spider http://127.0.0.1:6001"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 20
          cache: npm
      - name: Install dependencies and Chromium
        run: |
          npm ci --prefer-offline --no-audit --no-fund
          npx prisma generate
          npx playwright install --with-deps chromium
      - name: Prepare disposable local credentials
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          session_secret=$(openssl rand -hex 32)
          jwt_secret=$(openssl rand -hex 32)
          better_auth_secret=$(openssl rand -hex 32)
          printf '::add-mask::%s\n' "$session_secret"
          printf '::add-mask::%s\n' "$jwt_secret"
          printf '::add-mask::%s\n' "$better_auth_secret"
          {
            printf '%s\n' 'DATABASE_URL=postgresql://browser_smoke:browser_smoke@127.0.0.1:5432/hypertask_smoke'
            printf '%s\n' 'REDIS_URL=redis://127.0.0.1:6379'
            printf 'SESSION_SECRET=%s\n' "$session_secret"
            printf 'JWT_SECRET=%s\n' "$jwt_secret"
            printf 'BETTER_AUTH_SECRET=%s\n' "$better_auth_secret"
            printf '%s\n' 'BETTER_AUTH_URL=http://127.0.0.1:3100'
            printf '%s\n' 'QSTASH_CALLBACK_BASE_URL=http://127.0.0.1:3100'
            printf '%s\n' 'QSTASH_AUTO_REGISTER_SWEEP=false'
            printf '%s\n' 'NEXT_PUBLIC_PUSHER_KEY=app-key'
            printf '%s\n' 'NEXT_PUBLIC_PUSHER_HOST=127.0.0.1'
            printf '%s\n' 'NEXT_PUBLIC_PUSHER_PORT=6001'
            printf '%s\n' 'NEXT_PUBLIC_PUSHER_USE_TLS=false'
            printf '%s\n' 'NEXT_PUBLIC_PUSHER_CLUSTER=mt1'
            printf '%s\n' 'PUSHER_APP_ID=app-id'
            printf '%s\n' 'PUSHER_KEY=app-key'
            printf '%s\n' 'PUSHER_SECRET=app-secret'
            printf '%s\n' 'PUSHER_HOST=127.0.0.1'
            printf '%s\n' 'PUSHER_PORT=6001'
            printf '%s\n' 'PUSHER_USE_TLS=false'
            printf '%s\n' 'PUSHER_CLUSTER=mt1'
          } >> "$GITHUB_ENV"
      - name: Create isolated database and logged-in fixtures
        id: fixtures
        env:
          BROWSER_SMOKE_STATE_FILE: e2e/smoke/.state/smoke-state.json
        run: |
          npx prisma migrate deploy
          node scripts/seed-browser-smoke.mjs
      - name: Build the local app (no migrations)
        run: npx next build --webpack
      - name: Serve and check logged-in pages
        env:
          BASE_URL: http://127.0.0.1:3100
          SMOKE_BOARD_PATH: ${{ steps.fixtures.outputs.board_path }}
          SMOKE_DEMO_BOARD_PATH: ${{ steps.fixtures.outputs.demo_board_path }}
          BROWSER_SMOKE_PR: '1'
        run: |
          npx next start -H 127.0.0.1 -p 3100 > "$RUNNER_TEMP/browser-smoke-server.log" 2>&1 &
          server=$!
          trap 'kill "$server" 2>/dev/null || true' EXIT
          for attempt in {1..60}; do
            if curl -fsS -o /dev/null "$BASE_URL/login"; then break; fi
            kill -0 "$server" 2>/dev/null || { echo '::error::Local app exited before it became ready'; exit 1; }
            sleep 2
          done
          curl -fsS -o /dev/null "$BASE_URL/login" || { echo '::error::Local app did not become ready'; exit 1; }
          npx playwright test -c playwright.config.smoke.ts e2e/smoke/prod.spec.ts

  production-test-warning:
    name: production-test-warning
    # Unit tests report code correctness, not whether the live deployment is
    # unhealthy. Only the production-health workflow may change the live site.
    needs: ci-tests
    if: always() && github.event_name == 'push' && needs.ci-tests.outputs.test_failed == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      actions: read
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 20

      - name: Warn about failed production tests
        shell: bash
        env:
          BEFORE_SHA: ${{ github.event.before }}
          FAILED_TESTS: ${{ needs.ci-tests.outputs.failed_tests }}
          GH_TOKEN: ${{ github.token }}
          TG_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TG_CHAT: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          set -euo pipefail

          send_alert() {
            local message="$1" code
            code=$(curl -s --connect-timeout 10 --max-time 60 -o "$RUNNER_TEMP/telegram.json" -w '%{http_code}' \
              -X POST "https://api.telegram.org/bot$TG_TOKEN/sendMessage" \
              -d chat_id="$TG_CHAT" --data-urlencode text="$message" 2>/dev/null) || true
            if [ "${code:-}" != "200" ]; then
              echo "::error::Telegram alert failed (HTTP ${code:-none}): $(cat "$RUNNER_TEMP/telegram.json" 2>/dev/null || true)"
            fi
          }

          HISTORY=$(node .github/scripts/should-auto-revert.mjs "$GITHUB_REPOSITORY" "$BEFORE_SHA" 2>/dev/null) || HISTORY='{}'
          HISTORY_REASON=$(printf '%s' "$HISTORY" | jq -r '.reason // "previous production test result unavailable"' 2>/dev/null || true)
          echo "::notice::Previous run: ${HISTORY_REASON:-previous production test result unavailable}"

          RUN_URL="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
          FAILED_TESTS="${FAILED_TESTS:-test command failed before naming a test}"
          MESSAGE=$(printf 'What failed: %s\nLive site changed: no\nNext: production stays live while the test failure is investigated\nRun: %s' "$FAILED_TESTS" "$RUN_URL")
          send_alert "$MESSAGE"
          echo "::warning::$FAILED_TESTS failed. Production was not reverted or rolled back."

  production-cli-parity:
    name: production-cli-parity
    # Candidate PRs are verified by parity-contract-trusted using the protected
    # base verifier. This job verifies the merged inventory against production.
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    env:
      TRUSTED_CLI_PACKAGE: "@hypertask/hypertask_cli"
      TRUSTED_CLI_VERSION: "1.13.29"
      TRUSTED_CLI_NEXT_VERSION: "2.0.0"
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 20

      - name: Verify production CLI parity inventory
        run: |
          CONTRACT_PACKAGE=$(node -p "require('./config/parity/contract.json').cliPackage.name")
          CONTRACT_VERSION=$(node -p "require('./config/parity/contract.json').cliPackage.version")
          if [ "$CONTRACT_PACKAGE" != "$TRUSTED_CLI_PACKAGE" ]; then
            echo "Parity contract selected untrusted package $CONTRACT_PACKAGE"
            exit 1
          fi
          if [ "$CONTRACT_VERSION" != "$TRUSTED_CLI_VERSION" ] && [ "$CONTRACT_VERSION" != "$TRUSTED_CLI_NEXT_VERSION" ]; then
            echo "Parity contract selected untrusted version $CONTRACT_VERSION"
            exit 1
          fi
          LATEST_VERSION=$(npm view "$TRUSTED_CLI_PACKAGE" version)
          if [ "$CONTRACT_VERSION:$LATEST_VERSION" != "$TRUSTED_CLI_VERSION:$TRUSTED_CLI_VERSION" ] && \
             [ "$CONTRACT_VERSION:$LATEST_VERSION" != "$TRUSTED_CLI_VERSION:$TRUSTED_CLI_NEXT_VERSION" ] && \
             [ "$CONTRACT_VERSION:$LATEST_VERSION" != "$TRUSTED_CLI_NEXT_VERSION:$TRUSTED_CLI_NEXT_VERSION" ]; then
            echo "Parity transition does not permit contract $CONTRACT_VERSION with npm latest $LATEST_VERSION"
            exit 1
          fi
          PARITY_TMP=$(mktemp -d "$RUNNER_TEMP/hypertask-parity.XXXXXX")
          cp config/parity/runner/package.json config/parity/runner/package-lock.json "$PARITY_TMP/"
          npm ci --prefix "$PARITY_TMP" --ignore-scripts --no-audit --no-fund
          env -u GITHUB_TOKEN -u GH_TOKEN "$PARITY_TMP/node_modules/.bin/hypertask" capabilities --json > "$PARITY_TMP/capabilities.json"
          node scripts/parity-contract.mjs \
            --check \
            --cli-capabilities "$PARITY_TMP/capabilities.json" \
            --typescript "$PARITY_TMP/node_modules/typescript/lib/typescript.js"
