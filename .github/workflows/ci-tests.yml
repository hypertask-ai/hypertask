name: CI Tests

# Correctness gate that runs on free GitHub-hosted runners without using a Vercel
# build slot. Purpose: let PRs be verified for merge without competing for the
# Vercel build slot. This is the intended required check; the preview is not.
#
# It also runs on every push to `production`. A PR can be green against the base it
# branched from and still break once squash-merged onto a production that has moved
# (HTPR-4632: PR #1959 merged with ci-build SUCCESS, then failed the production
# build). Nothing typechecked the merge result, so the first signal was a failed
# Vercel prod deploy blocking every later release. This makes the merge commit
# itself a checked artifact.
on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  push:
    branches: [production]

concurrency:
  group: ci-tests-${{ github.event.pull_request.number || github.sha }}
  # Superseded PR runs are waste, but every production run must finish its full
  # test report and warning path.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# One knob for the Test step. YPER4-554 (HT Product Lead, 2026-10-24) capped it
# at 2 because 3 or more count-split shards queued other pulls. YPER4-777 broke
# that cap with measurements, not preference: the wall is not the average shard,
# it is the slowest one, and a hosted runner's throughput moves up to a third
# between VMs. On 2026-10-31T14:05Z the three shards had identical 542s plans and
# finished at 522s, 513s and 816s, and in that slow leg 580 of 615 files ran over
# their own committed weight while the fast legs had 96 and 83 - a slow machine,
# not a bad split. Four shards put 407s of planned work on each leg, so even a
# 1.5x VM stays inside the 12-minute target, while two could not come under
# 856s per leg at all. The queue cost this adds is measured at 45s median and
# 82s p90 over the last 39 runs (shard jobs only; every 20-min wait in that
# window was browser-smoke, never a shard). The required check stays ci-tests.
#
# HYCI-6 adds the serial lane: the TypeScript files and the isolated CJS files
# hold one worker each, so a lane that mixed them with the pool left three of
# its four workers idle for that whole stretch. Those files now share the last
# lane, which runs beside the pool lanes. Measured on four production pushes the
# serial stretch per lane was 26s to 183s; packed away, every pool lane plans
# 337s instead of 406s.
#
# HYCI-42 raises the pool to six lanes on four production pushes from
# 2026-10-31 (41246170446, 41245291300, 41243110481, 41243877982): a lane's wall
# time tracks its own summed file time divided by four (441s planned 434s, 406s
# planned 382s, 495s planned 418s), so the four workers are saturated and only
# less work per lane shortens the slowest leg. Six lanes plan 225s each instead
# of 337s, which is the 30% the ticket asks for, and a lane now opens with its
# longest file so a 270-322s file never runs at the tail. Seven test jobs put a
# non-draft PR at 19 jobs of the 20-job pool; the added queue cost is measured
# after this ships, and the required check stays ci-tests.
#
# HYCI-45 splits the serial lane, which HYCI-42 turned into the slowest leg: on
# production push 41254186616 the serial lane's Test step ran 364s while the
# slowest pool lane ran 331s, against a 346s target. A serial lane costs the sum
# of its files, and the 163 serial files total 280s of measured work, so its
# count, not its balance, sets that lane's wall. CI_SERIAL_SHARDS gives them two
# lanes that plan 140s each; the pool lanes keep their 225s plan and every lane
# still opens with its longest file. Eight test jobs put a non-draft PR at
# 20 jobs of the 20-job pool, which is the queue cost the ticket accepts; the
# slowest leg on a real run is recorded on the ticket, and the required check
# stays ci-tests.
env:
  # 6 pool lanes plus 2 serial lanes, so CI Test is 8 lanes.
  CI_TEST_SHARDS: "6"
  CI_SERIAL_SHARDS: "2"

jobs:
  ci-prepare:
    name: ci-prepare
    # Skip drafts; pushes always run. HR-04 (Valentin, 2026-09-29): no author
    # is exempted from the gate any more. The "Vercel bot" author skip this
    # replaced was ported wholesale from a private-repo template (9f074926b)
    # and never matched a real PR (no vercel[bot] PR has ever existed in this
    # repo, confirmed against the full PR history). It also silently exempted
    # hypertask-agents[bot], our own GitHub App: its PRs open from branches in
    # this same repo (not a fork), this job runs on `pull_request` (not
    # `pull_request_target`), holds a read-only token, and never touches a
    # secret, so there was no security reason to give bot-authored code a free
    # pass. Every bot-authored PR now runs the exact same gate as a human one.
    # No label gate any more (HTPR-6734, HR-04: no skipped checks). The
    # review-first `full-ci` label (owner, 2026-08-26) left ci-tests SKIPPED
    # until the label arrived, and GitHub's ruleset counts SKIPPED as passing:
    # PRs 782, 798 and 799 went live that way, and 782 broke the suite. Every
    # non-draft PR now runs the gate on code/lifecycle events; superseded runs are
    # cancelled by the concurrency group above, so only the newest one costs
    # runner time. A job-level skip is never used here, because a skipped run
    # newer than a failed one would read as passing again.
    if: github.event_name == 'push' || github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    timeout-minutes: 80
    # This job checks out and executes pull request code, so it never holds a
    # write token. The production warning is a separate push-only job.
    permissions:
      contents: read
      pull-requests: read
      issues: read
      checks: read
      # "Skip the build when the review is already red" reads commit statuses
      # for GitHub AI Review; without this the gh call 403s and aborts the job.
      statuses: read
      packages: read
    outputs:
      boundary_needed: ${{ steps.boundary-scope.outputs.needed }}
      run_tests: ${{ steps.shards.outputs.run_tests }}
      shard_indexes: ${{ steps.shards.outputs.indexes }}
      stress_fixtures: ${{ steps.fixtures.outputs.stress }}
      handoff_fixture: ${{ steps.fixtures.outputs.handoff }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 1

      # Reads the checkout and nothing else, so it runs before every other step:
      # a session ledger is a private file, and the PR is red until it is gone.
      # A docs-only PR skips every later step, which is exactly the shape a
      # ledger-only PR takes, so this step carries no `if:` and no new job.
      - name: Guard session ledgers
        run: node scripts/check-session-ledgers.mjs

      # Never build a commit whose review already failed (owner, 2026-08-26).
      # This does NOT wait: a pending or absent verdict builds in parallel as
      # normal; only an existing red verdict stops the build before it starts.
      - name: Skip the build when the review is already red
        if: github.event_name == 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          if ! STATE=$(gh api "repos/${{ github.repository }}/commits/$HEAD_SHA/status?per_page=100" --jq '
            [.statuses[] | select(.context == "ai-review" or .context == "claude-review") | {context, state}]
            | group_by(.context) | map(.[0])
            | if any(.[]; .state == "success") then "success"
              elif any(.[]; .state == "failure") then "failure" else "none" end'); then
            echo "::warning::Review precheck unavailable; running tests. Required AI review still blocks merging."
          else
            [ "$STATE" != "failure" ] || { echo "::error::GitHub AI Review already failed for $HEAD_SHA; fix the findings and push - the new commit builds normally."; exit 1; }
          fi
      - name: Runner admission, dispatcher and selfupdate fixtures
        run: |
          python3 .claude/skills/ship/scripts/session-policy-guard.test.py
          python3 .claude/skills/ship/scripts/runner-dispatch.test.py
          python3 .claude/skills/ship/scripts/runner-dispatch.cache.test.py
          python3 .claude/skills/ship/scripts/runner-snapshot.test.py
          bash .claude/skills/ship/scripts/runner-selfupdate.test.sh
          bash .claude/skills/ship/scripts/gh-notify.test.sh

      - name: Guard CI image sources
        run: node --test tests/ci-image-sources.test.cjs

      # Runs before the change scope, so a workflow-only pull request (which
      # installs no node_modules) is still guarded (HYCI-15).
      - name: Guard workflow job timeouts
        run: node --test tests/workflow-timeouts.test.cjs

      # Keep both required jobs running: only their heavy steps may be skipped.
      - name: Determine change scope
        id: scope
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          # A missing/broken detector must never suppress correctness checks.
          if ! node .github/scripts/ci-change-scope.cjs; then
            echo "build_needed=true" >> "$GITHUB_OUTPUT"
            : > "$RUNNER_TEMP/changed-files.txt"
          fi

      - name: Determine boundary scan scope
        id: boundary-scope
        env:
          BUILD_NEEDED: ${{ steps.scope.outputs.build_needed }}
        run: |
          python3 - <<'PY'
          import os
          from pathlib import Path
          files = Path(os.environ['RUNNER_TEMP'], 'changed-files.txt').read_text().splitlines()
          needed = os.environ['BUILD_NEEDED'] == 'true' or not files or any(
              not (f.startswith('docs/') or (f.endswith('.md') and not f.startswith('src/'))) for f in files)
          with open(os.environ['GITHUB_OUTPUT'], 'a') as out:
              out.write(f"needed={str(needed).lower()}\n")
          PY

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        if: github.event_name == 'push' || steps.scope.outputs.build_needed == 'true'
        with:
          node-version: ^24.22.1
          check-latest: true


      - name: Resolve dependency cache version
        id: dependency-cache-version
        if: github.event_name == 'push' || steps.scope.outputs.build_needed == 'true'
        run: |
          echo "node-abi=$(node -p 'process.versions.modules')" >> "$GITHUB_OUTPUT"
          echo "npm-major=$(npm --version | cut -d. -f1)" >> "$GITHUB_OUTPUT"

      - name: Restore node_modules cache
        id: restore-node-modules
        if: github.event_name == 'push' || steps.scope.outputs.build_needed == 'true'
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: node_modules
          key: node-modules-${{ runner.os }}-${{ runner.arch }}-abi${{ steps.dependency-cache-version.outputs.node-abi }}-npm${{ steps.dependency-cache-version.outputs.npm-major }}-${{ hashFiles('package-lock.json', 'package.json', '.npmrc') }}

      - name: Install dependencies
        if: (github.event_name == 'push' || steps.scope.outputs.build_needed == 'true') && steps.restore-node-modules.outputs.cache-hit != 'true'
        run: npm ci --prefer-offline --no-audit --no-fund

      - name: Agent scope debt needs a recorded approval
        if: github.event_name == 'pull_request'
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: node .github/scripts/agent-scope/baseline-approval.mjs

      - name: Save node_modules cache
        # PRs restore the trusted production cache, but only production pushes save.
        if: github.event_name == 'push' && steps.restore-node-modules.outputs.cache-hit != 'true'
        uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: node_modules
          key: ${{ steps.restore-node-modules.outputs.cache-primary-key }}

      # HYCI-78: the fixture stress and the palette handoff moved out of this job
      # into ci-fixtures. They ran here, ahead of "Select tests for changed files",
      # so a push that touched one of those four files paid their whole wall time
      # before a single test shard could start: 114-446 s on the eight real pushes
      # that ran it, against a 55 s median ci-prepare. Each step still decides for
      # itself whether it has anything to do, and the job only starts when one of
      # them does.
      - name: Decide fixture lane scope
        id: fixtures
        if: github.event_name == 'pull_request' && steps.scope.outputs.build_needed == 'true'
        shell: bash
        run: |
          set -euo pipefail
          changed="$RUNNER_TEMP/changed-files.txt"
          stress=false
          handoff=false
          if [ -f "$changed" ] && grep -Eq '^tests/(htpr-7305-board-from-text|htpr-7652-ctrlj-enter-queue|compose-task-palette|search-board-loading)\.test\.cjs$' "$changed"; then
            stress=true
          fi
          if [ -f "$changed" ] && grep -Eq '^tests/compose-task-palette\.test\.cjs$' "$changed"; then
            handoff=true
          fi
          echo "stress=$stress" >> "$GITHUB_OUTPUT"
          echo "handoff=$handoff" >> "$GITHUB_OUTPUT"

      # Every PR body claims "npm test N passed" and nothing checked it, so a
      # broken suite sat green on production for days (HTPR-5161).
      # HT_REQUIRE_PG_TESTS turns the real-PostgreSQL suites' "docker missing"
      # skip into a hard failure. Locally a developer without docker still gets a
      # clean skip; here a skip would be the same false green that let PR #2789's
      # task-write outage through (HTPR-5467).
      # PR lane: run only the tests that reference something this PR touched.
      # The full suite is the production lane's job (below), where a red run
      # warns without changing the live site. Selection falls back to the whole
      # suite whenever it cannot be confident (dependency/schema change, wide
      # fan-out, nothing matched).
      - name: Select tests for changed files
        id: select
        if: github.event_name == 'pull_request' && steps.scope.outputs.build_needed == 'true'
        shell: bash
        run: |
          set -euo pipefail
          # Run the selector from the BASE branch, not the PR workspace: a PR
          # must not be able to edit the thing deciding which of its tests run.
          # The selector still reads the PR's own tests (cwd is the workspace).
          SEL="$RUNNER_TEMP/selector"
          mkdir -p "$SEL/.github/scripts" "$SEL/scripts"
          if git fetch --depth=1 --quiet origin "$GITHUB_BASE_REF" \
            && git show "FETCH_HEAD:.github/scripts/select-tests.mjs" > "$SEL/.github/scripts/select-tests.mjs" \
            && git show "FETCH_HEAD:scripts/test-inventory.mjs" > "$SEL/scripts/test-inventory.mjs"; then
            SELECTED=$(node "$SEL/.github/scripts/select-tests.mjs" < "$RUNNER_TEMP/changed-files.txt")
          else
            # No trusted selector on the base branch yet: run everything.
            SELECTED=ALL
          fi
          echo "$SELECTED"
          printf '%s\n' "$SELECTED" > "$RUNNER_TEMP/selected-tests.txt"
          if [ "$SELECTED" = "ALL" ]; then
            echo "files=" >> "$GITHUB_OUTPUT"
            echo "require_pg=1" >> "$GITHUB_OUTPUT"
          else
            echo "files=$(echo "$SELECTED" | tr '\n' ' ')" >> "$GITHUB_OUTPUT"
            if echo "$SELECTED" | grep -q -- '-postgres\.test\.cjs'; then
              echo "require_pg=1" >> "$GITHUB_OUTPUT"
            else
              echo "require_pg=" >> "$GITHUB_OUTPUT"
            fi
          fi

      - name: Write test shards
        id: shards
        env:
          BUILD_NEEDED: ${{ steps.scope.outputs.build_needed }}
        shell: bash
        run: |
          set -euo pipefail
          if [ "$GITHUB_EVENT_NAME" != "push" ] && [ "$BUILD_NEEDED" != "true" ]; then
            echo "run_tests=false" >> "$GITHUB_OUTPUT"
            echo 'indexes=["0"]' >> "$GITHUB_OUTPUT"
            exit 0
          fi
          OUT="$RUNNER_TEMP/ci-shards"
          mkdir -p "$OUT"
          # HYCI-6/HYCI-45: the pool lanes plus the serial lanes, so a lane never
          # waits on a serial file with three workers idle and no lane pays for every
          # serial file.
          LANES=$((CI_TEST_SHARDS + CI_SERIAL_SHARDS))
          if [ "$GITHUB_EVENT_NAME" = "push" ] || grep -qx ALL "$RUNNER_TEMP/selected-tests.txt"; then
            node .github/scripts/shard-tests.mjs --discover --count "$LANES" --serial-lanes "$CI_SERIAL_SHARDS" --out "$OUT"
          elif ! grep -q '[^[:space:]]' "$RUNNER_TEMP/selected-tests.txt"; then
            echo "selected test list is empty; refusing to skip the suite" >&2
            exit 1
          else
            node .github/scripts/shard-tests.mjs --count "$LANES" --serial-lanes "$CI_SERIAL_SHARDS" --out "$OUT" < "$RUNNER_TEMP/selected-tests.txt"
          fi
          node .github/scripts/shard-tests.mjs --check --serial-lanes "$CI_SERIAL_SHARDS" --out "$OUT"
          # State how much of the suite this run covers. A pick that quietly
          # widened back to everything is then visible in the run itself.
          TOTAL=$(node -e 'import("./scripts/test-inventory.mjs").then(async (m) => {
            const found = await m.discoverTestFiles({ root: process.cwd(), testsRoot: process.cwd() + "/tests" });
            process.stdout.write(String(found.supported.length));
          })')
          RUN=$(jq -r '.files' "$OUT/manifest.json")
          echo "test selection: ${RUN} of ${TOTAL} test files ($((RUN * 100 / TOTAL))%)" | tee -a "$GITHUB_STEP_SUMMARY"
          echo "run_tests=true" >> "$GITHUB_OUTPUT"
          indexes=$(node -e 'const n=Number(process.argv[1]); if (!Number.isInteger(n)||n<1) process.exit(1); process.stdout.write(JSON.stringify([...Array(n).keys()].map(String)))' "$LANES")
          echo "indexes=${indexes}" >> "$GITHUB_OUTPUT"

      - name: Upload test shard lists
        if: steps.shards.outputs.run_tests == 'true'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: ci-test-shards
          path: ${{ runner.temp }}/ci-shards
          retention-days: 7

  ci-checks:
    name: ci-checks
    needs: ci-prepare
    if: needs.ci-prepare.outputs.run_tests == 'true' || needs.ci-prepare.outputs.boundary_needed == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 40
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
          persist-credentials: false

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: ^24.22.1
          check-latest: true

      - name: Resolve dependency cache version
        id: dependency-cache-version
        run: |
          echo "node-abi=$(node -p 'process.versions.modules')" >> "$GITHUB_OUTPUT"
          echo "npm-major=$(npm --version | cut -d. -f1)" >> "$GITHUB_OUTPUT"

      - name: Restore node_modules cache
        id: restore-node-modules
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830
        with:
          path: node_modules
          key: node-modules-${{ runner.os }}-${{ runner.arch }}-abi${{ steps.dependency-cache-version.outputs.node-abi }}-npm${{ steps.dependency-cache-version.outputs.npm-major }}-${{ hashFiles('package-lock.json', 'package.json', '.npmrc') }}

      - name: Install dependencies
        if: steps.restore-node-modules.outputs.cache-hit != 'true'
        run: npm ci --prefer-offline --no-audit --no-fund

      - name: Restore ESLint cache
        if: needs.ci-prepare.outputs.run_tests == 'true'
        id: restore-eslint-cache
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: .cache/eslint
          key: eslint-${{ runner.os }}-${{ hashFiles('package-lock.json', 'eslint.config.mjs', 'tsconfig.json') }}-${{ github.sha }}
          restore-keys: |
            eslint-${{ runner.os }}-${{ hashFiles('package-lock.json', 'eslint.config.mjs', 'tsconfig.json') }}-

      - name: Relocate ESLint cache
        if: needs.ci-prepare.outputs.run_tests == 'true'
        run: node .github/scripts/relocate-eslint-cache.mjs .cache/eslint/.eslintcache "$GITHUB_WORKSPACE"

      - name: Restore agent scope pip cache
        if: needs.ci-prepare.outputs.run_tests == 'true'
        id: agent-scope-pip-cache
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: ${{ runner.temp }}/agent-scope-pip-cache
          key: agent-scope-pip-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('.github/scripts/agent-scope/requirements.txt') }}

      - name: Restore TypeScript cache
        if: needs.ci-prepare.outputs.run_tests == 'true'
        id: restore-tsc-cache
        # A stale tsbuildinfo is safe: tsc validates it against file hashes and
        # falls back to a full check when they differ. Generated route types move
        # with it and are reused only when their own input digest still matches.
        # HTPR-8234: PRs cache under their own `tsc-pr-` namespace so a repeat push
        # reuses the branch's own state instead of a production one that has moved.
        # Production never restores a `tsc-pr-` key: only trusted pushes may feed
        # the production check, the same rule the ESLint cache follows.
        env:
          TSC_CACHE_NAMESPACE: ${{ github.event_name == 'pull_request' && format('pr-{0}', github.event.pull_request.number) || 'prod' }}
          TSC_CACHE_FINGERPRINT: ${{ hashFiles('package-lock.json', 'tsconfig.json') }}
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: |
            .cache/tsc
            .next/types
            .next/dev/types
            next-env.d.ts
          key: tsc-${{ env.TSC_CACHE_NAMESPACE }}-${{ runner.os }}-${{ env.TSC_CACHE_FINGERPRINT }}-${{ github.sha }}
          restore-keys: |
            tsc-${{ env.TSC_CACHE_NAMESPACE }}-${{ runner.os }}-${{ env.TSC_CACHE_FINGERPRINT }}-
            tsc-prod-${{ runner.os }}-${{ env.TSC_CACHE_FINGERPRINT }}-

      - name: Generate Prisma client and flag index
        if: needs.ci-prepare.outputs.run_tests == 'true'
        # npm prelint hooks rebuild the flag index themselves. Building it once
        # here leaves every lane reading the same file instead of three lanes
        # writing it at the same time.
        run: |
          npx prisma generate
          node scripts/generate-flag-index.mjs

      # Every static gate below reads the checkout or the caches and nothing
      # produced by another gate, so none of them waits for another. Run one
      # after another they cost their sum (about 150 s of the job); started
      # together the job costs its slowest gate (HYCI-8). A gate that fails is
      # named in its own log group and the step fails once every lane is done.
      - name: Run independent static checks
        if: needs.ci-prepare.outputs.run_tests == 'true' || needs.ci-prepare.outputs.boundary_needed == 'true'
        shell: bash
        timeout-minutes: 30
        env:
          RUN_TESTS: ${{ needs.ci-prepare.outputs.run_tests == 'true' }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          SOURCE_TEXT_ALLOWLIST_BASE: ${{ github.event.pull_request.base.sha }}
          PIP_CACHE_DIR: ${{ runner.temp }}/agent-scope-pip-cache
          PIP_DISABLE_PIP_VERSION_CHECK: "1"
          SEMGREP_SEND_METRICS: "off"
          SEMGREP_ENABLE_VERSION_CHECK: "0"
        run: |
          set -uo pipefail
          LOGS="$RUNNER_TEMP/static-gates"
          mkdir -p "$LOGS"
          : > "$LOGS/pids"
          failed=0

          # The board boundary gate also guards the boundary-only run, where no
          # TypeScript or lint gate runs at all.
          lane_board_registration_boundaries() {
            npx depcruise --config .dependency-cruiser.cjs --output-type json src/components/Modals/commands/HTC/domains > "$RUNNER_TEMP/boundary-report.json"
            jq '.summary | {error, violations, totalCruised, totalDependenciesCruised}' "$RUNNER_TEMP/boundary-report.json"
            jq -e '.summary.error == 0 and any(.modules[]; .source == "src/components/Modals/commands/HTC/domains/boardCommands.ts" and any(.dependencies[]; .resolved == "src/models/enums.ts"))' "$RUNNER_TEMP/boundary-report.json"
            node --test tests/domain-boundary.test.cjs
          }

          lane_agent_board_scope() {
            PY312=$(ls -d "$RUNNER_TOOL_CACHE"/Python/3.12.*/x64/bin/python3 2>/dev/null | sort -V | tail -1 || true)
            PY312=${PY312:-python3}
            "$PY312" -c 'import sys; assert sys.version_info[:2] == (3, 12), "requirements.txt is locked for Python 3.12, got " + sys.version'
            "$PY312" -m venv "$RUNNER_TEMP/agent-scope-venv"
            export PATH="$RUNNER_TEMP/agent-scope-venv/bin:$PATH"
            python -m pip install --require-hashes -r .github/scripts/agent-scope/requirements.txt
            python .github/scripts/agent-scope/run.py --self-test
            python .github/scripts/agent-scope/run.py
          }

          # Next.js generates route-handler signature checks outside ordinary tsc,
          # so they are generated first and CI catches the same errors as the
          # Vercel build. HTPR-8234: the generator is skipped only when the restored
          # types came from an identical route input digest, which makes a stale
          # match impossible; any doubt regenerates. `next typegen` also writes the
          # feature-flag index through next.config, so that index is built here
          # directly and no gate depends on the generator running at all.
          lane_typescript() {
            started=$(date +%s%3N)
            node scripts/generate-flag-index.mjs
            surface="unavailable"
            surface=$(node .github/scripts/ts-route-surface.mjs) || surface="unavailable"
            if [ "$surface" != "unavailable" ] && [ -d .next/types ] \
              && node .github/scripts/ts-route-surface.mjs --match .cache/tsc/route-surface; then
              echo "Route types reused: route inputs unchanged ($surface)."
            else
              typegen_started=$(date +%s%3N)
              npx next typegen
              echo "next typegen $(( $(date +%s%3N) - typegen_started ))ms"
              node .github/scripts/ts-route-surface.mjs --write .cache/tsc/route-surface >/dev/null || true
            fi
            tsc_started=$(date +%s%3N)
            npx tsc --noEmit --incremental --tsBuildInfoFile .cache/tsc/tsbuildinfo
            echo "tsc $(( $(date +%s%3N) - tsc_started ))ms"
            echo "typecheck total $(( $(date +%s%3N) - started ))ms"
          }

          # Two linters read the same tree: Oxlint for the rules it can express,
          # ESLint for the rest.
          lane_oxlint() {
            npm run lint:oxlint
          }

          lane_eslint() {
            if [ -n "$BASE_SHA" ]; then
              npm run lint:changed -- "$BASE_SHA"
            else
              npm run lint -- --cache --cache-strategy content --cache-location .cache/eslint/.eslintcache
            fi
          }

          lane_lint_overlap_guard() {
            node --test tests/oxlint-overlap.test.cjs
          }

          # Directory discovery in the Ctrl+K coverage gate is broader than the PR
          # selector's exact-path heuristic, so it runs even when another suite
          # owns the diff. A PR that adds a source-text regex is exactly the PR the
          # selector never routes to the regex gate, so that one reads the whole
          # tests/ tree on every PR.
          lane_contracts() {
            node --test tests/board-filters/*.test.cjs
            node --test tests/settings-cmdk-coverage.test.cjs
            node --test tests/source-text-regex-lint.test.cjs
          }

          lane_changed_style_tokens() {
            npm run lint:styles -- "$BASE_SHA" "$HEAD_SHA"
          }

          lane_paid_api_cost_notes() {
            node .github/scripts/paid-api-cost-notes.mjs "$BASE_SHA" "$HEAD_SHA"
          }

          run_lane() {
            local name=$1
            ( set -euo pipefail; "lane_${name//-/_}" ) > "$LOGS/$name.log" 2>&1 &
            printf '%s %s\n' "$name" "$!" >> "$LOGS/pids"
          }

          run_lane board-registration-boundaries
          if [ "$RUN_TESTS" = "true" ]; then
            # Lanes that diff against the base share one fetch here, so no two
            # lanes write to .git at the same time.
            if [ -n "$BASE_SHA" ]; then
              git fetch --no-tags --depth=1000 origin "$BASE_SHA" "$HEAD_SHA"
            fi
            run_lane agent-board-scope
            run_lane typescript
            run_lane oxlint
            run_lane eslint
            run_lane lint-overlap-guard
            run_lane contracts
            if [ -n "$BASE_SHA" ]; then
              run_lane changed-style-tokens
              run_lane paid-api-cost-notes
            fi
          fi

          while read -r name pid; do
            if wait "$pid"; then
              printf 'static gate %s: passed\n' "$name"
            else
              printf 'static gate %s: FAILED\n' "$name"
              failed=1
            fi
            printf '::group::static gate %s\n' "$name"
            cat "$LOGS/$name.log"
            printf '::endgroup::\n'
          done < "$LOGS/pids"

          if [ "$failed" -ne 0 ]; then
            printf '::error::at least one static gate failed; the failing gate is named above\n'
            exit 1
          fi

      - name: Save agent scope pip cache
        if: needs.ci-prepare.outputs.run_tests == 'true' && (github.event_name == 'push' && steps.agent-scope-pip-cache.outputs.cache-hit != 'true')
        uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: ${{ runner.temp }}/agent-scope-pip-cache
          key: ${{ steps.agent-scope-pip-cache.outputs.cache-primary-key }}

      - name: Save TypeScript cache
        if: needs.ci-prepare.outputs.run_tests == 'true' && steps.restore-tsc-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: |
            .cache/tsc
            .next/types
            .next/dev/types
            next-env.d.ts
          key: ${{ steps.restore-tsc-cache.outputs.cache-primary-key }}

      - name: Save ESLint cache
        # PRs may restore the trusted base-branch cache, but only production pushes
        # may refresh it. This prevents untrusted PR cache data from becoming a
        # production input while still accelerating every subsequent PR.
        # cache-hit is true only for an exact primary-key match. Restoring the
        # previous production SHA through restore-keys returns false, so every new
        # production commit saves a refreshed cache; only same-SHA reruns skip it.
        if: needs.ci-prepare.outputs.run_tests == 'true' && (github.event_name == 'push' && steps.restore-eslint-cache.outputs.cache-hit != 'true')
        uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: .cache/eslint
          key: ${{ steps.restore-eslint-cache.outputs.cache-primary-key }}


  ci-test:
    name: test-shard
    needs: ci-prepare
    if: needs.ci-prepare.outputs.run_tests == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        shard: ${{ fromJSON(needs.ci-prepare.outputs.shard_indexes || '["0"]') }}
    # Same read-only token as ci-prepare. That job already uploads artifacts
    # without actions: write, and a write token would reach PR-controlled tests
    # through the Docker login that follows.
    permissions:
      contents: read
      packages: read
    env:
      HTPR_PG_IMAGE: ghcr.io/hypertask-ai/ci-postgres:16-alpine@sha256:721873c34ceb9f8d8fc265984940dc982404c105f19ad51be9fdc5970a6080ea
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 1
          persist-credentials: false

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: ^24.22.1
          check-latest: true

      - name: Resolve dependency cache version
        id: dependency-cache-version
        run: |
          echo "node-abi=$(node -p 'process.versions.modules')" >> "$GITHUB_OUTPUT"
          echo "npm-major=$(npm --version | cut -d. -f1)" >> "$GITHUB_OUTPUT"

      - name: Restore node_modules cache
        id: restore-node-modules
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: node_modules
          key: node-modules-${{ runner.os }}-${{ runner.arch }}-abi${{ steps.dependency-cache-version.outputs.node-abi }}-npm${{ steps.dependency-cache-version.outputs.npm-major }}-${{ hashFiles('package-lock.json', 'package.json', '.npmrc') }}

      - name: Install dependencies
        if: steps.restore-node-modules.outputs.cache-hit != 'true'
        run: npm ci --prefer-offline --no-audit --no-fund

      - name: Generate Prisma client
        run: npx prisma generate

      - name: Download test shard lists
        uses: actions/download-artifact@95815c38cf2ff2164869cbab79da8d1f422bc89e # v4.2.1
        with:
          name: ci-test-shards
          path: ci-test-shards

      # A shard needs the registry login and the PostgreSQL image whenever one of
      # its tests starts a container from a CI image. The `-postgres.test.cjs`
      # name alone missed htpr-7038-model-reset (PostgreSQL) and mcp-transports
      # (Redis), so a lane holding only those pulled nothing and its `docker run`
      # died with exit 125.
      - name: Decide shard container fixtures
        id: pg
        shell: bash
        run: node .github/scripts/shard-containers.mjs "ci-test-shards/shard-${{ matrix.shard }}.txt" >> "$GITHUB_OUTPUT"

      - name: Authenticate CI image pulls
        if: steps.pg.outputs.containers == '1'
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}

      - name: Pull PostgreSQL test image
        if: steps.pg.outputs.need == '1'
        run: docker pull "$HTPR_PG_IMAGE"

      # Comparison tests `git show origin/production:<file>`. The old single
      # job fetched the base ref while selecting tests; a fresh shard checkout
      # does not, and fetch-depth 1 leaves that name missing.
      - name: Fetch base branch for comparison tests
        run: |
          set -euo pipefail
          ref="${GITHUB_BASE_REF:-production}"
          git fetch --depth=1 origin "+refs/heads/${ref}:refs/remotes/origin/${ref}"

      - name: Test shard
        id: push-test
        shell: bash
        env:
          SHARD: ${{ matrix.shard }}
          HT_REQUIRE_PG_TESTS: ${{ github.event_name == 'push' && '1' || steps.pg.outputs.need }}
          SOURCE_TEXT_ALLOWLIST_BASE: ${{ github.event.pull_request.base.sha }}
          GITHUB_TOKEN: ""
          GH_TOKEN: ""
        run: |
          set -euo pipefail
          LIST="ci-test-shards/shard-${SHARD}.txt"
          mkdir -p "$RUNNER_TEMP/ci-shard-upload"
          cp "$LIST" "$RUNNER_TEMP/ci-shard-upload/shard-${SHARD}.txt"
          mapfile -t FILES < "$LIST"
          echo "shard ${SHARD} files=${#FILES[@]}"
          if [ "${#FILES[@]}" -eq 0 ]; then
            echo "shard ${SHARD} empty" | tee "$RUNNER_TEMP/ci-shard-upload/shard-${SHARD}.log"
            exit 0
          fi
          npm test -- "${FILES[@]}" 2>&1 | tee "$RUNNER_TEMP/ci-shard-upload/shard-${SHARD}.log"

      - name: Collect test durations
        if: always() && github.event_name == 'push' && steps.push-test.outcome != 'skipped'
        run: |
          mkdir -p "$RUNNER_TEMP/ci-shard-upload"
          if [ -f test-durations.json ]; then
            cp test-durations.json "$RUNNER_TEMP/ci-shard-upload/test-durations.json"
          fi

      - name: Upload shard result
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: ci-test-shard-${{ matrix.shard }}
          path: ${{ runner.temp }}/ci-shard-upload
          if-no-files-found: ignore
          retention-days: 7

  # The cold-board stress and the palette handoff are fixture regressions, not
  # inputs to test selection, so they run beside the shards instead of in front of
  # them. ci-tests still fails whenever this lane fails: the check is unchanged,
  # only its wall time stops adding to every other lane's start.
  ci-fixtures:
    name: ci-fixtures
    needs: ci-prepare
    if: needs.ci-prepare.outputs.stress_fixtures == 'true' || needs.ci-prepare.outputs.handoff_fixture == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 40
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 1
          persist-credentials: false

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: ^24.22.1
          check-latest: true

      - name: Resolve dependency cache version
        id: dependency-cache-version
        run: |
          echo "node-abi=$(node -p 'process.versions.modules')" >> "$GITHUB_OUTPUT"
          echo "npm-major=$(npm --version | cut -d. -f1)" >> "$GITHUB_OUTPUT"

      - name: Restore node_modules cache
        id: restore-node-modules
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: node_modules
          key: node-modules-${{ runner.os }}-${{ runner.arch }}-abi${{ steps.dependency-cache-version.outputs.node-abi }}-npm${{ steps.dependency-cache-version.outputs.npm-major }}-${{ hashFiles('package-lock.json', 'package.json', '.npmrc') }}

      - name: Install dependencies
        if: steps.restore-node-modules.outputs.cache-hit != 'true'
        run: npm ci --prefer-offline --no-audit --no-fund

      - name: Stress cold-board query fixtures
        if: needs.ci-prepare.outputs.stress_fixtures == 'true'
        timeout-minutes: 25
        shell: bash
        run: |
          set -euo pipefail
          npm run flags:generate
          for iteration in {1..50}; do
            echo "Cold-board fixture stress $iteration/50"
            node --test --test-concurrency=1 tests/htpr-7305-board-from-text.test.cjs tests/htpr-7652-ctrlj-enter-queue.test.cjs tests/search-board-loading.test.cjs
          done
          echo "Cold-board fixture stress: 50/50 passed"

      - name: Fixture handoff in one process
        if: needs.ci-prepare.outputs.handoff_fixture == 'true'
        timeout-minutes: 15
        shell: bash
        run: |
          set -euo pipefail
          npm run flags:generate
          lane=$(node scripts/palette-fixture-lane.mjs)
          if [ -z "$lane" ]; then
            echo "No palette reader shares a test lane; nothing to hand over."
            exit 0
          fi
          echo "Shared lane: $lane"
          node --test --test-timeout=1200000 --test-concurrency=1 --test-isolation=none $lane
          echo "One-process fixture handoff passed: $lane"

  ci-tests:
    name: ci-tests
    needs: [ci-prepare, ci-checks, ci-test, ci-fixtures]
    if: always() && (github.event_name == 'push' || github.event.pull_request.draft == false)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      actions: read
    outputs:
      test_failed: ${{ steps.test-outcome.outputs.failed }}
      failed_tests: ${{ steps.test-outcome.outputs.failed_tests }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 1
          persist-credentials: false

      - name: Download planned shard lists
        if: always() && needs.ci-prepare.outputs.run_tests == 'true'
        uses: actions/download-artifact@95815c38cf2ff2164869cbab79da8d1f422bc89e # v4.2.1
        with:
          name: ci-test-shards
          path: ci-test-shards

      - name: Download shard results
        if: always() && needs.ci-prepare.outputs.run_tests == 'true'
        uses: actions/download-artifact@95815c38cf2ff2164869cbab79da8d1f422bc89e # v4.2.1
        with:
          pattern: ci-test-shard-*
          path: ci-shard-results

      - name: Prove every test file ran once
        id: prove
        if: always() && needs.ci-prepare.outputs.run_tests == 'true'
        run: node .github/scripts/shard-tests.mjs --prove --serial-lanes "$CI_SERIAL_SHARDS" --out ci-test-shards --results ci-shard-results

      - name: Combine shard logs
        if: always() && needs.ci-prepare.outputs.run_tests == 'true'
        shell: bash
        run: |
          set +e
          : > "$RUNNER_TEMP/push-test.log"
          find ci-shard-results -name 'shard-*.log' -print | sort | while read -r log; do
            cat "$log" >> "$RUNNER_TEMP/push-test.log"
          done

      - name: Upload test durations
        if: always() && github.event_name == 'push' && needs.ci-prepare.outputs.run_tests == 'true'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: test-durations
          path: ci-shard-results/**/test-durations.json
          if-no-files-found: warn
          retention-days: 14

      - name: Record push test outcome
        id: test-outcome
        if: always() && github.event_name == 'push'
        shell: bash
        run: |
          echo "failed=${{ needs.ci-test.result == 'failure' }}" >> "$GITHUB_OUTPUT"
          failures=""
          if [ -f "$RUNNER_TEMP/push-test.log" ]; then
            failures=$(sed -nE 's/^[[:space:]]*not ok [0-9]+ - (.*)$/\1/p; s/^[[:space:]]*✖ (.*) \([0-9.]+ms\)$/\1/p' "$RUNNER_TEMP/push-test.log" \
              | awk 'BEGIN { ORS="" } NR <= 3 { if (NR > 1) printf "; "; printf "%s", $0 }')
          fi
          echo "failed_tests=${failures:-test command failed before naming a test}" >> "$GITHUB_OUTPUT"

      - name: Publish ci-tests result
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          test "${{ needs.ci-prepare.result }}" = "success"
          case "${{ needs.ci-prepare.outputs.run_tests }}" in true|false) ;; *) exit 1 ;; esac
          case "${{ needs.ci-prepare.outputs.boundary_needed }}" in true|false) ;; *) exit 1 ;; esac
          if [ "${{ needs.ci-prepare.outputs.run_tests }}" = "true" ]; then
            test "${{ needs.ci-checks.result }}" = "success"
            test "${{ needs.ci-test.result }}" = "success"
            test "${{ steps.prove.outcome }}" = "success"
          else
            if [ "${{ needs.ci-prepare.outputs.boundary_needed }}" = "true" ]; then
              test "${{ needs.ci-checks.result }}" = "success"
            else
              test "${{ needs.ci-checks.result }}" = "skipped"
            fi
            test "${{ needs.ci-test.result }}" = "skipped"
          fi
          # A fixture run that started and went red, was cancelled, or never
          # reported back is a red check; only a lane that had nothing to do may
          # be skipped.
          case "${{ needs.ci-fixtures.result }}" in
            success|skipped) ;;
            *) exit 1 ;;
          esac

  browser-build:
    name: browser-build
    # HYCI-59: one build for the whole check. HYCI-57 gave each shard its own
    # warm build so no shard waited behind another, which meant four machines
    # repeated the same build; the check then waited for the slowest shard's
    # build to end before its pages could start. The build is one job now and
    # publishes `app-build`; the four page shards start from that artifact, so
    # the check pays the build once. The Next.js incremental cache is still
    # saved on a production push and restored here, so the one build keeps the
    # warm-cache cost (HYCI-59 measured the check before and after).
    #
    # The builder is the one production uses (`next build`, Turbopack since
    # HTPR-8245), so the artifact every shard serves is the artifact production
    # serves.
    #
    # The services and the disposable credentials stay identical to a shard's,
    # so the build sees the environment it always saw.
    if: github.event_name == 'push' || github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      packages: read
    outputs:
      docs_only: ${{ steps.scope.outputs.heavy_needed == 'false' }}
    services:
      postgres:
        image: ghcr.io/hypertask-ai/ci-postgres:16-bookworm@sha256:bb3e1a57e5407e0a5280b4211980a5e537f4abd234a87014ac979849a78dd825
        credentials:
          username: ${{ github.actor }}
          password: ${{ github.token }}
        env:
          POSTGRES_DB: hypertask_smoke
          POSTGRES_USER: browser_smoke
          POSTGRES_PASSWORD: browser_smoke
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U browser_smoke -d hypertask_smoke"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
      redis:
        image: ghcr.io/hypertask-ai/ci-redis:7-alpine@sha256:ff02b58f971e7d7d156a1267e283fcbbeee91773b6aa36c49dac28ecfe28eadf
        credentials:
          username: ${{ github.actor }}
          password: ${{ github.token }}
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
      soketi:
        image: ghcr.io/hypertask-ai/ci-soketi:1.6-16-alpine@sha256:5e45fe1adbf2d4ef8022d0126a3c7e4371b7b08f35784b76a2dc353954ee885c
        credentials:
          username: ${{ github.actor }}
          password: ${{ github.token }}
        env:
          SOKETI_DEFAULT_APP_ID: app-id
          SOKETI_DEFAULT_APP_KEY: app-key
          SOKETI_DEFAULT_APP_SECRET: app-secret
        ports:
          - 6001:6001
        options: >-
          --health-cmd "wget --no-verbose --tries=1 --spider http://127.0.0.1:6001"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      # Keep the required jobs running: only their heavy steps may be skipped.
      - name: Determine change scope
        id: scope
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          # A missing/broken detector must never suppress correctness checks.
          if ! node .github/scripts/ci-change-scope.cjs; then
            echo "heavy_needed=true" >> "$GITHUB_OUTPUT"
            : > "$RUNNER_TEMP/changed-files.txt"
          fi
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        if: github.event_name == 'push' || steps.scope.outputs.heavy_needed == 'true'
        with:
          node-version: ^24.22.1
          check-latest: true
          cache: npm
      - name: Resolve dependency cache version
        id: dependency-cache-version
        if: github.event_name == 'push' || steps.scope.outputs.heavy_needed == 'true'
        run: |
          echo "node-abi=$(node -p 'process.versions.modules')" >> "$GITHUB_OUTPUT"
          echo "npm-major=$(npm --version | cut -d. -f1)" >> "$GITHUB_OUTPUT"
      - name: Restore node_modules cache
        id: restore-node-modules
        if: github.event_name == 'push' || steps.scope.outputs.heavy_needed == 'true'
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: node_modules
          key: node-modules-${{ runner.os }}-${{ runner.arch }}-abi${{ steps.dependency-cache-version.outputs.node-abi }}-npm${{ steps.dependency-cache-version.outputs.npm-major }}-${{ hashFiles('package-lock.json', 'package.json', '.npmrc') }}
      - name: Install dependencies
        if: (github.event_name == 'push' || steps.scope.outputs.heavy_needed == 'true') && steps.restore-node-modules.outputs.cache-hit != 'true'
        run: npm ci --prefer-offline --no-audit --no-fund
      - name: Generate the client
        if: github.event_name == 'push' || steps.scope.outputs.heavy_needed == 'true'
        run: |
          npx prisma generate
          # A restored node_modules skipped the npm postinstall that writes this file.
          npm run flags:generate
      - name: Prepare disposable local credentials
        if: github.event_name == 'push' || steps.scope.outputs.heavy_needed == 'true'
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          # Derived from the commit so one build serves every consumer.
          seed="${{ github.event.pull_request.head.sha || github.sha }}-smoke"
          session_secret=$(printf '%s' "$seed:session" | sha256sum | cut -d' ' -f1)
          jwt_secret=$(printf '%s' "$seed:jwt" | sha256sum | cut -d' ' -f1)
          better_auth_secret=$(printf '%s' "$seed:better-auth" | sha256sum | cut -d' ' -f1)
          printf '::add-mask::%s\n' "$session_secret"
          printf '::add-mask::%s\n' "$jwt_secret"
          printf '::add-mask::%s\n' "$better_auth_secret"
          {
            printf '%s\n' 'DATABASE_URL=postgresql://browser_smoke:browser_smoke@127.0.0.1:5432/hypertask_smoke'
            printf '%s\n' 'REDIS_URL=redis://127.0.0.1:6379'
            printf 'SESSION_SECRET=%s\n' "$session_secret"
            printf 'JWT_SECRET=%s\n' "$jwt_secret"
            printf 'BETTER_AUTH_SECRET=%s\n' "$better_auth_secret"
            printf '%s\n' 'BETTER_AUTH_URL=http://127.0.0.1:3100'
            printf '%s\n' 'NEXT_PUBLIC_BASEURL=http://127.0.0.1:3100'
            printf '%s\n' 'TURBOPUFFER_BASE_URL=http://127.0.0.1:53101'
            printf '%s\n' 'TURBOPUFFER_API_KEY=disposable-fixture'
            printf '%s\n' 'HT_PREMERGE_AI_STUB=1'
            printf '%s\n' 'HT_PREMERGE_QUEUE_STUB=1'
            printf '%s\n' 'QSTASH_CALLBACK_BASE_URL=http://127.0.0.1:3100'
            printf '%s\n' 'QSTASH_AUTO_REGISTER_SWEEP=false'
            printf '%s\n' 'NEXT_PUBLIC_PUSHER_KEY=app-key'
            printf '%s\n' 'NEXT_PUBLIC_PUSHER_HOST=127.0.0.1'
            printf '%s\n' 'NEXT_PUBLIC_PUSHER_PORT=6001'
            printf '%s\n' 'NEXT_PUBLIC_PUSHER_USE_TLS=false'
            printf '%s\n' 'NEXT_PUBLIC_PUSHER_CLUSTER=mt1'
            printf '%s\n' 'PUSHER_APP_ID=app-id'
            printf '%s\n' 'PUSHER_KEY=app-key'
            printf '%s\n' 'PUSHER_SECRET=app-secret'
            printf '%s\n' 'PUSHER_HOST=127.0.0.1'
            printf '%s\n' 'PUSHER_PORT=6001'
            printf '%s\n' 'PUSHER_USE_TLS=false'
            printf '%s\n' 'PUSHER_CLUSTER=mt1'
          } >> "$GITHUB_ENV"
      - name: Create the database schema
        if: github.event_name == 'push' || steps.scope.outputs.heavy_needed == 'true'
        run: npx prisma migrate deploy
      - name: Restore Next.js build cache
        id: restore-nextjs-cache
        if: github.event_name == 'push' || steps.scope.outputs.heavy_needed == 'true'
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: .next/cache
          key: nextjs-${{ runner.os }}-${{ hashFiles('package-lock.json', 'next.config.*') }}-${{ github.sha }}
          restore-keys: |
            nextjs-${{ runner.os }}-${{ hashFiles('package-lock.json', 'next.config.*') }}-
      - name: Build the local app (no migrations)
        if: github.event_name == 'push' || steps.scope.outputs.heavy_needed == 'true'
        # YPER4-363: next/font downloads Google fonts at build time and about
        # 6% of builds lost that download. Retry once, only for that failure.
        # The guard matches what the build prints: "An error occurred in
        # `next/font`", "`next/font` error:" or the @next/font loader frame (HYCI-63).
        run: |
          set -o pipefail
          for attempt in 1 2; do
            npx next build 2>&1 | tee "$RUNNER_TEMP/next-build.log" && exit 0
            grep -qE 'An error occurred in `next/font`|next/font` error:|@next/font/dist/google/loader\.js' "$RUNNER_TEMP/next-build.log" || exit 1
            echo "::warning::Google font download failed during next build (attempt $attempt)"
          done
          exit 1
      - name: Save Next.js build cache
        if: github.event_name == 'push' && github.ref == 'refs/heads/production' && steps.restore-nextjs-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: .next/cache
          key: ${{ steps.restore-nextjs-cache.outputs.cache-primary-key }}
      - name: Package the one build
        if: github.event_name == 'push' || steps.scope.outputs.heavy_needed == 'true'
        run: tar --exclude='.next/cache' -czf "$RUNNER_TEMP/app-build.tgz" .next
      - name: Upload the one build
        if: github.event_name == 'push' || steps.scope.outputs.heavy_needed == 'true'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: app-build
          path: ${{ runner.temp }}/app-build.tgz
          retention-days: 1

  browser-smoke-desktop:
    name: browser-smoke-desktop
    # HYCI-32 split the browser check in two; HYCI-57 splits the page tests in
    # four, so the check is one build plus the slowest quarter of the pages:
    # `browser-smoke-desktop` (default desktop pages, the instant-open control,
    # the contract), `browser-smoke-mobile` (default phone pages),
    # `browser-smoke-matrix` (the width matrix) and `browser-smoke-flags` (every
    # flag on, then the inbox cycle). HYCI-59: all four run their pages on the one
    # `app-build` that `browser-build` publishes, so the check pays the app build
    # once instead of once per shard. The required context stays `browser-smoke`,
    # a summary job over the four shards, so a red shard still blocks a merge and
    # every existing ruleset, merge guard and policy entry keeps working
    # unchanged.
    needs: browser-build
    if: github.event_name == 'push' || github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      packages: read
    # HR-04 (Valentin, 2026-09-29): no author is exempted and no label is
    # needed, same as ci-tests (PR 785, HTPR-6734). Neither half holds a
    # repository secret (tests/browser-smoke-workflow.test.cjs pins that), so an
    # agent-authored PR runs them like anyone else; a skip would count as
    # passing and let a fix ship without the customer test. Docs-only PRs instead
    # run the heavy steps of both halves as skips and succeed.
    #
    # HYCI-10: the one build was published so the visual comparison reuses it
    # instead of building the candidate a second time. HYCI-59 moved that
    # producer and the shared Next.js cache to `browser-build`.
    outputs:
      contract: ${{ steps.smoke.outputs.contract }}
      docs_only: ${{ steps.scope.outputs.heavy_needed == 'false' }}
    services:
      postgres:
        image: ghcr.io/hypertask-ai/ci-postgres:16-bookworm@sha256:bb3e1a57e5407e0a5280b4211980a5e537f4abd234a87014ac979849a78dd825
        credentials:
          username: ${{ github.actor }}
          password: ${{ github.token }}
        env:
          POSTGRES_DB: hypertask_smoke
          POSTGRES_USER: browser_smoke
          POSTGRES_PASSWORD: browser_smoke
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U browser_smoke -d hypertask_smoke"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
      redis:
        image: ghcr.io/hypertask-ai/ci-redis:7-alpine@sha256:ff02b58f971e7d7d156a1267e283fcbbeee91773b6aa36c49dac28ecfe28eadf
        credentials:
          username: ${{ github.actor }}
          password: ${{ github.token }}
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
      soketi:
        image: ghcr.io/hypertask-ai/ci-soketi:1.6-16-alpine@sha256:5e45fe1adbf2d4ef8022d0126a3c7e4371b7b08f35784b76a2dc353954ee885c
        credentials:
          username: ${{ github.actor }}
          password: ${{ github.token }}
        env:
          SOKETI_DEFAULT_APP_ID: app-id
          SOKETI_DEFAULT_APP_KEY: app-key
          SOKETI_DEFAULT_APP_SECRET: app-secret
        ports:
          - 6001:6001
        options: >-
          --health-cmd "wget --no-verbose --tries=1 --spider http://127.0.0.1:6001"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      # Keep both required jobs running: only their heavy steps may be skipped.
      - name: Determine change scope
        id: scope
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          # A missing/broken detector must never suppress correctness checks.
          if ! node .github/scripts/ci-change-scope.cjs; then
            echo "heavy_needed=true" >> "$GITHUB_OUTPUT"
            : > "$RUNNER_TEMP/changed-files.txt"
          fi

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        if: github.event_name == 'push' || steps.scope.outputs.heavy_needed == 'true'
        with:
          node-version: ^24.22.1
          check-latest: true
          cache: npm
      # YPER4-252: a layout lock baseline or ratchet only changes with the ticket where Valentin
      # approved it, named in approvedIn and in a "Layout change approved: <URL>" PR body line.
      - name: Layout change needs a recorded approval
        if: github.event_name == 'pull_request'
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          git fetch --depth=1 origin "$BASE_SHA"
          node .github/scripts/layout-lock-approval.mjs
      - name: Resolve dependency cache version
        id: dependency-cache-version
        if: github.event_name == 'push' || steps.scope.outputs.heavy_needed == 'true'
        run: |
          echo "node-abi=$(node -p 'process.versions.modules')" >> "$GITHUB_OUTPUT"
          echo "npm-major=$(npm --version | cut -d. -f1)" >> "$GITHUB_OUTPUT"

      # browser-smoke was the last install job outside the shared dependency cache,
      # so every pull request rebuilt node_modules from the npm tarballs alone. It
      # restores the same production-seeded key as ci-prepare and installs only on
      # a miss.
      - name: Restore node_modules cache
        id: restore-node-modules
        if: github.event_name == 'push' || steps.scope.outputs.heavy_needed == 'true'
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: node_modules
          key: node-modules-${{ runner.os }}-${{ runner.arch }}-abi${{ steps.dependency-cache-version.outputs.node-abi }}-npm${{ steps.dependency-cache-version.outputs.npm-major }}-${{ hashFiles('package-lock.json', 'package.json', '.npmrc') }}

      - name: Install dependencies
        if: (github.event_name == 'push' || steps.scope.outputs.heavy_needed == 'true') && steps.restore-node-modules.outputs.cache-hit != 'true'
        run: npm ci --prefer-offline --no-audit --no-fund

      # HYCI-62: the browser revision only moves when package-lock.json does, so a
      # push restores Chromium from the cache instead of downloading it again.
      # prod-health uses the same key, so the two jobs share one entry.
      - name: Restore Playwright browser cache
        id: restore-playwright-browsers
        if: github.event_name == 'push' || steps.scope.outputs.heavy_needed == 'true'
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-chromium-${{ runner.os }}-${{ hashFiles('package-lock.json') }}
      - name: Generate client and install Chromium
        if: github.event_name == 'push' || steps.scope.outputs.heavy_needed == 'true'
        run: |
          npx prisma generate
          # A restored node_modules skipped the npm postinstall that writes this file.
          npm run flags:generate
          printf '%s\n' 'https://archive.ubuntu.com/ubuntu/' | sudo tee /etc/apt/apt-mirrors.txt > /dev/null
          npx playwright install --with-deps chromium
          sudo apt-get update
          sudo apt-get install -y strace
      # HYCI-62: one saver only. Four shards racing the same key would each pay
      # the download when the cache misses, and three of the saves would fail.
      - name: Save Playwright browser cache
        if: (github.event_name == 'push' || steps.scope.outputs.heavy_needed == 'true') && steps.restore-playwright-browsers.outputs.cache-hit != 'true'
        uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-chromium-${{ runner.os }}-${{ hashFiles('package-lock.json') }}
      - name: Prepare disposable local credentials
        if: github.event_name == 'push' || steps.scope.outputs.heavy_needed == 'true'
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          # Derived from the commit so one build serves every consumer.
          seed="${{ github.event.pull_request.head.sha || github.sha }}-smoke"
          session_secret=$(printf '%s' "$seed:session" | sha256sum | cut -d' ' -f1)
          jwt_secret=$(printf '%s' "$seed:jwt" | sha256sum | cut -d' ' -f1)
          better_auth_secret=$(printf '%s' "$seed:better-auth" | sha256sum | cut -d' ' -f1)
          printf '::add-mask::%s\n' "$session_secret"
          printf '::add-mask::%s\n' "$jwt_secret"
          printf '::add-mask::%s\n' "$better_auth_secret"
          {
            printf '%s\n' 'DATABASE_URL=postgresql://browser_smoke:browser_smoke@127.0.0.1:5432/hypertask_smoke'
            printf '%s\n' 'REDIS_URL=redis://127.0.0.1:6379'
            printf 'SESSION_SECRET=%s\n' "$session_secret"
            printf 'JWT_SECRET=%s\n' "$jwt_secret"
            printf 'BETTER_AUTH_SECRET=%s\n' "$better_auth_secret"
            printf '%s\n' 'BETTER_AUTH_URL=http://127.0.0.1:3100'
            printf '%s\n' 'NEXT_PUBLIC_BASEURL=http://127.0.0.1:3100'
            printf '%s\n' 'TURBOPUFFER_BASE_URL=http://127.0.0.1:53101'
            printf '%s\n' 'TURBOPUFFER_API_KEY=disposable-fixture'
            printf '%s\n' 'HT_PREMERGE_AI_STUB=1'
            printf '%s\n' 'HT_PREMERGE_QUEUE_STUB=1'
            printf '%s\n' 'QSTASH_CALLBACK_BASE_URL=http://127.0.0.1:3100'
            printf '%s\n' 'QSTASH_AUTO_REGISTER_SWEEP=false'
            printf '%s\n' 'NEXT_PUBLIC_PUSHER_KEY=app-key'
            printf '%s\n' 'NEXT_PUBLIC_PUSHER_HOST=127.0.0.1'
            printf '%s\n' 'NEXT_PUBLIC_PUSHER_PORT=6001'
            printf '%s\n' 'NEXT_PUBLIC_PUSHER_USE_TLS=false'
            printf '%s\n' 'NEXT_PUBLIC_PUSHER_CLUSTER=mt1'
            printf '%s\n' 'PUSHER_APP_ID=app-id'
            printf '%s\n' 'PUSHER_KEY=app-key'
            printf '%s\n' 'PUSHER_SECRET=app-secret'
            printf '%s\n' 'PUSHER_HOST=127.0.0.1'
            printf '%s\n' 'PUSHER_PORT=6001'
            printf '%s\n' 'PUSHER_USE_TLS=false'
            printf '%s\n' 'PUSHER_CLUSTER=mt1'
          } >> "$GITHUB_ENV"
      - name: Create isolated database and logged-in fixtures
        if: github.event_name == 'push' || steps.scope.outputs.heavy_needed == 'true'
        id: fixtures
        env:
          BROWSER_SMOKE_STATE_FILE: e2e/smoke/.state/smoke-state.json
          MCP_CLI_API_CONTRACT: '1'
          BROWSER_SMOKE_SEARCH_FIXTURES: '1'
        run: |
          npx prisma migrate deploy
          node scripts/seed-browser-smoke.mjs --qa-journeys
      - name: Download checksum-verified pinned native CLI
        if: github.event_name == 'push' || steps.scope.outputs.heavy_needed == 'true'
        env:
          TRUSTED_CLI_BINARY_VERSION: "0.2.15"
          TRUSTED_CLI_BINARY_SHA256: "685af04562d52683e7d6f8feed58fa807407176940558ba79fbcc7cc5406b2a9"
        run: |
          set -euo pipefail
          CLI_BINARY="$RUNNER_TEMP/hypertask-native"
          curl --fail --location --silent --show-error \
            "https://github.com/hypertask-ai/cli/releases/download/v${TRUSTED_CLI_BINARY_VERSION}/hypertask-linux-x86_64" \
            --output "$CLI_BINARY"
          echo "$TRUSTED_CLI_BINARY_SHA256  $CLI_BINARY" | sha256sum --check
          chmod 755 "$CLI_BINARY"
          printf 'MCP_CONTRACT_CLI=%s\n' "$CLI_BINARY" >> "$GITHUB_ENV"
      - name: Download the one build
        if: github.event_name == 'push' || steps.scope.outputs.heavy_needed == 'true'
        uses: actions/download-artifact@95815c38cf2ff2164869cbab79da8d1f422bc89e # v4.2.1
        with:
          name: app-build
          path: ${{ runner.temp }}/app-build
      - name: Unpack the one build
        if: github.event_name == 'push' || steps.scope.outputs.heavy_needed == 'true'
        run: |
          set -euo pipefail
          tar -xzf "$RUNNER_TEMP/app-build/app-build.tgz" -C "$RUNNER_TEMP/app-build"
          rm -rf .next
          mv "$RUNNER_TEMP/app-build/.next" .next
      - name: Serve and check desktop pages
        if: github.event_name == 'push' || steps.scope.outputs.heavy_needed == 'true'
        id: smoke
        env:
          BASE_URL: http://127.0.0.1:3100
          SMOKE_BOARD_PATH: ${{ steps.fixtures.outputs.board_path }}
          SMOKE_DEMO_BOARD_PATH: ${{ steps.fixtures.outputs.demo_board_path }}
          BROWSER_SMOKE_PR: '1'
        run: |
          set -euo pipefail
          node scripts/premerge-local-search.mjs e2e/smoke/.state/card-fixture.json 53101 > "$RUNNER_TEMP/contract-search.log" 2>&1 &
          search=$!
          npx next start -H 127.0.0.1 -p 3100 > "$RUNNER_TEMP/browser-smoke-server.log" 2>&1 &
          server=$!
          trap 'kill "$server" "$search" 2>/dev/null || true' EXIT
          for attempt in {1..60}; do
            if curl -fsS -o /dev/null "$BASE_URL/login"; then break; fi
            kill -0 "$server" 2>/dev/null || { echo '::error::Local app exited before it became ready'; exit 1; }
            sleep 2
          done
          curl -fsS -o /dev/null "$BASE_URL/login" || { echo '::error::Local app did not become ready'; exit 1; }
          for attempt in {1..30}; do
            if curl -fsS -o /dev/null "$TURBOPUFFER_BASE_URL/health"; then break; fi
            kill -0 "$search" 2>/dev/null || { cat "$RUNNER_TEMP/contract-search.log"; echo '::error::Fixture search exited before it became ready'; exit 1; }
            sleep 1
          done
          curl -fsS -o /dev/null "$TURBOPUFFER_BASE_URL/health" || { cat "$RUNNER_TEMP/contract-search.log"; echo '::error::Fixture search did not become ready'; exit 1; }
          node scripts/mcp-cli-api-contract.mjs
          # HYCI-57: the desktop part keeps the build, the contract and the
          # default desktop pages, and the instant-open control for both
          # viewports. The flag modes, the inbox cycle and the phone pages are
          # their own shards now, so one part never pays for another's pages.
          npx playwright test -c playwright.config.smoke.ts --project=Desktop e2e/smoke/prod.spec.ts e2e/smoke/layout-lock.spec.ts
          # Keep the instant-open regression covered even while its live mode is OFF.
          BROWSER_SMOKE_STATE_FILE=e2e/smoke/.state/smoke-state.json node scripts/seed-browser-smoke.mjs --instant-open-control
          npx playwright test -c playwright.config.smoke.ts --project=Desktop --project=Mobile e2e/smoke/prod.spec.ts --grep 'seeded board card opens'
      - name: Upload failing smoke screenshots
        if: failure() && (github.event_name == 'push' || steps.scope.outputs.heavy_needed == 'true')
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: browser-smoke-desktop-failures
          path: |
            test-results/**/*.png
            test-results/**/error-context.md
          if-no-files-found: ignore
          retention-days: 7
