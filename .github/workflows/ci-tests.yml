name: YPER4-826 Outside Proof
on:
  push:
    branches: [runner11/yper4-826-outside-proof]
permissions:
  contents: read
  packages: read
concurrency:
  group: yper4-826-outside-proof-${{ github.sha }}
  cancel-in-progress: false
jobs:
  browser-smoke:
    name: browser-smoke
    # HR-04 (Valentin, 2026-09-29): no author is exempted and no label is
    # needed, same as ci-tests (PR 785, HTPR-6734). This job holds no
    # repository secret (tests/browser-smoke-workflow.test.cjs pins that), so
    # an agent-authored PR runs it like anyone else; a skip would count as
    # passing and let a fix ship without the customer test. Docs-only PRs
    # instead run this job successfully without starting the heavy lane.
    if: github.event_name == 'push' || github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      PROOF_CASE: ${{ contains(github.event.head_commit.message, '[missing-row]') && 'missing-row' || 'green' }}
    outputs:
      contract: ${{ steps.smoke.outputs.contract }}
      docs_only: ${{ steps.scope.outputs.heavy_needed == 'false' }}
    permissions:
      contents: read
      packages: read
    services:
      postgres:
        image: ghcr.io/hypertask-ai/ci-postgres:16-bookworm@sha256:bb3e1a57e5407e0a5280b4211980a5e537f4abd234a87014ac979849a78dd825
        credentials:
          username: ${{ github.actor }}
          password: ${{ github.token }}
        env:
          POSTGRES_DB: hypertask_smoke
          POSTGRES_USER: browser_smoke
          POSTGRES_PASSWORD: browser_smoke
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U browser_smoke -d hypertask_smoke"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
      redis:
        image: ghcr.io/hypertask-ai/ci-redis:7-alpine@sha256:ff02b58f971e7d7d156a1267e283fcbbeee91773b6aa36c49dac28ecfe28eadf
        credentials:
          username: ${{ github.actor }}
          password: ${{ github.token }}
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
      soketi:
        image: ghcr.io/hypertask-ai/ci-soketi:1.6-16-alpine@sha256:5e45fe1adbf2d4ef8022d0126a3c7e4371b7b08f35784b76a2dc353954ee885c
        credentials:
          username: ${{ github.actor }}
          password: ${{ github.token }}
        env:
          SOKETI_DEFAULT_APP_ID: app-id
          SOKETI_DEFAULT_APP_KEY: app-key
          SOKETI_DEFAULT_APP_SECRET: app-secret
        ports:
          - 6001:6001
        options: >-
          --health-cmd "wget --no-verbose --tries=1 --spider http://127.0.0.1:6001"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      # Keep both required jobs running: only their heavy steps may be skipped.
      - name: Fetch exact original repair for source comparison
        run: git fetch --depth=1 origin 5429c3dce63a454385da371a9d898fb2d5ca06b4
      - name: Prepare proof evidence path
        run: echo "PROOF_NETWORK_DIR=$RUNNER_TEMP/proof-network" >> "$GITHUB_ENV"
      - name: Determine change scope
        id: scope
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          # A missing/broken detector must never suppress correctness checks.
          if ! node .github/scripts/ci-change-scope.cjs; then
            echo "heavy_needed=true" >> "$GITHUB_OUTPUT"
            : > "$RUNNER_TEMP/changed-files.txt"
          fi

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        if: github.event_name == 'push' || steps.scope.outputs.heavy_needed == 'true'
        with:
          node-version: ^24.22.1
          check-latest: true
          cache: npm
      # YPER4-252: a layout lock baseline or ratchet only changes with the ticket where Valentin
      # approved it, named in approvedIn and in a "Layout change approved: <URL>" PR body line.
      - name: Layout change needs a recorded approval
        if: github.event_name == 'pull_request'
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          git fetch --depth=1 origin "$BASE_SHA"
          node .github/scripts/layout-lock-approval.mjs
      - name: Install dependencies and Chromium
        if: github.event_name == 'push' || steps.scope.outputs.heavy_needed == 'true'
        run: |
          npm ci --prefer-offline --no-audit --no-fund
          npx prisma generate
          printf '%s\n' 'https://archive.ubuntu.com/ubuntu/' | sudo tee /etc/apt/apt-mirrors.txt > /dev/null
          npx playwright install --with-deps chromium
          sudo apt-get update
          sudo apt-get install -y strace
      - name: Verify observer redaction
        run: node --test tests/yper4-826-network-proof.test.cjs
      - name: Capture source and apply requested negative mutation
        run: |
          node <<'JS'
          const fs=require('node:fs'), cp=require('node:child_process'), crypto=require('node:crypto');
          const source='5429c3dce63a454385da371a9d898fb2d5ca06b4';
          const seed='scripts/seed-browser-smoke.mjs';
          const needle='    await prisma.user_Activity.create({ data: { userId: sidebarUser.id, totalTeamsOwned: 0, lastActiveAt: new Date() } });\n';
          const before=fs.readFileSync(seed,'utf8');
          if(before.split(needle).length!==2)throw Error('Expected one original activity-row seed');
          const spec='e2e/smoke/agent-sidebar-chats.spec.ts';
          const lines=fs.readFileSync(spec,'utf8').split('\n');
          const assertion=lines.findIndex(line=>line.includes("expect((await activity).status(), 'sidebar board startup records user activity').toBe(200)"));
          if(assertion<0)throw Error('Original browser200 assertion missing');
          fs.mkdirSync(process.env.PROOF_NETWORK_DIR,{recursive:true});
          const appDiff=cp.execFileSync('git',['diff',source,'HEAD','--','src','prisma','package.json','package-lock.json'],{encoding:'utf8'});
          if(appDiff.trim())throw Error('Proof must not change product, schema, dependencies or flags');
          if(process.env.PROOF_CASE==='missing-row')fs.writeFileSync(seed,before.replace(needle,''));
          const after=fs.readFileSync(seed,'utf8');
          const manifest={source,head:cp.execFileSync('git',['rev-parse','HEAD'],{encoding:'utf8'}).trim(),case:process.env.PROOF_CASE,assertion:{file:spec,line:assertion+1,text:lines[assertion].trim()},seedRemoved:before!==after,removedLines:before!==after?1:0,productDiffEmpty:true,budgetMinutes:25,seedBeforeSha256:crypto.createHash('sha256').update(before).digest('hex'),seedAfterSha256:crypto.createHash('sha256').update(after).digest('hex')};
          fs.writeFileSync(process.env.PROOF_NETWORK_DIR+'/source.json',JSON.stringify(manifest,null,2));
          fs.writeFileSync(process.env.PROOF_NETWORK_DIR+'/seed-mutation.patch',cp.execFileSync('git',['diff','--',seed],{encoding:'utf8'}));
          console.log('[proof source]',JSON.stringify(manifest));
          JS
      - name: Observe browser metadata without authentication material
        run: |
          node <<'JS'
          const fs=require('node:fs');
          for(const file of fs.readdirSync('e2e/smoke').filter(file=>file.endsWith('.spec.ts'))){
            const target='e2e/smoke/'+file;
            const before=fs.readFileSync(target,'utf8');
            fs.writeFileSync(target,before.replaceAll("from '@playwright/test'", "from './proof-network'"));
          }
          JS
      - name: Prepare disposable local credentials
        if: github.event_name == 'push' || steps.scope.outputs.heavy_needed == 'true'
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          session_secret=$(openssl rand -hex 32)
          jwt_secret=$(openssl rand -hex 32)
          better_auth_secret=$(openssl rand -hex 32)
          printf '::add-mask::%s\n' "$session_secret"
          printf '::add-mask::%s\n' "$jwt_secret"
          printf '::add-mask::%s\n' "$better_auth_secret"
          {
            printf '%s\n' 'DATABASE_URL=postgresql://browser_smoke:browser_smoke@127.0.0.1:5432/hypertask_smoke'
            printf '%s\n' 'REDIS_URL=redis://127.0.0.1:6379'
            printf 'SESSION_SECRET=%s\n' "$session_secret"
            printf 'JWT_SECRET=%s\n' "$jwt_secret"
            printf 'BETTER_AUTH_SECRET=%s\n' "$better_auth_secret"
            printf '%s\n' 'BETTER_AUTH_URL=http://127.0.0.1:3100'
            printf '%s\n' 'NEXT_PUBLIC_BASEURL=http://127.0.0.1:3100'
            printf '%s\n' 'TURBOPUFFER_BASE_URL=http://127.0.0.1:53101'
            printf '%s\n' 'TURBOPUFFER_API_KEY=disposable-fixture'
            printf '%s\n' 'HT_PREMERGE_AI_STUB=1'
            printf '%s\n' 'HT_PREMERGE_QUEUE_STUB=1'
            printf '%s\n' 'QSTASH_CALLBACK_BASE_URL=http://127.0.0.1:3100'
            printf '%s\n' 'QSTASH_AUTO_REGISTER_SWEEP=false'
            printf '%s\n' 'NEXT_PUBLIC_PUSHER_KEY=app-key'
            printf '%s\n' 'NEXT_PUBLIC_PUSHER_HOST=127.0.0.1'
            printf '%s\n' 'NEXT_PUBLIC_PUSHER_PORT=6001'
            printf '%s\n' 'NEXT_PUBLIC_PUSHER_USE_TLS=false'
            printf '%s\n' 'NEXT_PUBLIC_PUSHER_CLUSTER=mt1'
            printf '%s\n' 'PUSHER_APP_ID=app-id'
            printf '%s\n' 'PUSHER_KEY=app-key'
            printf '%s\n' 'PUSHER_SECRET=app-secret'
            printf '%s\n' 'PUSHER_HOST=127.0.0.1'
            printf '%s\n' 'PUSHER_PORT=6001'
            printf '%s\n' 'PUSHER_USE_TLS=false'
            printf '%s\n' 'PUSHER_CLUSTER=mt1'
          } >> "$GITHUB_ENV"
      - name: Create isolated database and logged-in fixtures
        if: github.event_name == 'push' || steps.scope.outputs.heavy_needed == 'true'
        id: fixtures
        env:
          BROWSER_SMOKE_STATE_FILE: e2e/smoke/.state/smoke-state.json
          MCP_CLI_API_CONTRACT: '1'
        run: |
          npx prisma migrate deploy
          node scripts/seed-browser-smoke.mjs --qa-journeys
      - name: Download checksum-verified pinned native CLI
        if: github.event_name == 'push' || steps.scope.outputs.heavy_needed == 'true'
        env:
          TRUSTED_CLI_BINARY_VERSION: "0.2.15"
          TRUSTED_CLI_BINARY_SHA256: "685af04562d52683e7d6f8feed58fa807407176940558ba79fbcc7cc5406b2a9"
        run: |
          set -euo pipefail
          CLI_BINARY="$RUNNER_TEMP/hypertask-native"
          curl --fail --location --silent --show-error \
            "https://github.com/hypertask-ai/cli/releases/download/v${TRUSTED_CLI_BINARY_VERSION}/hypertask-linux-x86_64" \
            --output "$CLI_BINARY"
          echo "$TRUSTED_CLI_BINARY_SHA256  $CLI_BINARY" | sha256sum --check
          chmod 755 "$CLI_BINARY"
          printf 'MCP_CONTRACT_CLI=%s\n' "$CLI_BINARY" >> "$GITHUB_ENV"
      - name: Restore Next.js build cache
        id: restore-nextjs-cache
        if: github.event_name == 'push' || steps.scope.outputs.heavy_needed == 'true'
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: .next/cache
          key: nextjs-${{ runner.os }}-${{ hashFiles('package-lock.json', 'next.config.*') }}-${{ github.sha }}
          restore-keys: |
            nextjs-${{ runner.os }}-${{ hashFiles('package-lock.json', 'next.config.*') }}-
      - name: Build the local app (no migrations)
        if: github.event_name == 'push' || steps.scope.outputs.heavy_needed == 'true'
        # YPER4-363: next/font downloads Google fonts at build time and about
        # 6% of builds lost that download. Retry once, only for that failure.
        run: |
          set -o pipefail
          for attempt in 1 2; do
            npx next build --webpack 2>&1 | tee "$RUNNER_TEMP/next-build.log" && exit 0
            grep -q 'next/font/google' "$RUNNER_TEMP/next-build.log" || exit 1
            echo "::warning::Google font download failed during next build (attempt $attempt)"
          done
          exit 1
      - name: Save Next.js build cache
        if: github.event_name == 'push' && github.ref == 'refs/heads/production' && steps.restore-nextjs-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: .next/cache
          key: ${{ steps.restore-nextjs-cache.outputs.cache-primary-key }}
      - name: Serve and check logged-in pages and layout lock
        if: github.event_name == 'push' || steps.scope.outputs.heavy_needed == 'true'
        id: smoke
        env:
          BASE_URL: http://127.0.0.1:3100
          SMOKE_BOARD_PATH: ${{ steps.fixtures.outputs.board_path }}
          SMOKE_DEMO_BOARD_PATH: ${{ steps.fixtures.outputs.demo_board_path }}
          BROWSER_SMOKE_PR: '1'
        run: |
          set -euo pipefail
          node scripts/premerge-local-search.mjs e2e/smoke/.state/card-fixture.json 53101 > "$RUNNER_TEMP/contract-search.log" 2>&1 &
          search=$!
          npx next start -H 127.0.0.1 -p 3100 > "$RUNNER_TEMP/browser-smoke-server.log" 2>&1 &
          server=$!
          trap 'kill "$server" "$search" 2>/dev/null || true' EXIT
          for attempt in {1..60}; do
            if curl -fsS -o /dev/null "$BASE_URL/login"; then break; fi
            kill -0 "$server" 2>/dev/null || { echo '::error::Local app exited before it became ready'; exit 1; }
            sleep 2
          done
          curl -fsS -o /dev/null "$BASE_URL/login" || { echo '::error::Local app did not become ready'; exit 1; }
          curl -fsS -o /dev/null "$TURBOPUFFER_BASE_URL/health"
          node scripts/mcp-cli-api-contract.mjs
          if [ "$PROOF_CASE" = "missing-row" ]; then
            BROWSER_SMOKE_STATE_FILE=e2e/smoke/.state/smoke-state.json node scripts/seed-browser-smoke.mjs --all-flags-on
            npx playwright test -c playwright.config.smoke.ts e2e/smoke/agent-sidebar-chats.spec.ts --project Desktop --grep 'conversation rows contain two-line titles'
            echo '::error::Missing-row mutation unexpectedly passed the unchanged browser200 assertion'
            exit 1
          fi
          npx playwright test -c playwright.config.smoke.ts e2e/smoke/prod.spec.ts e2e/smoke/layout-lock.spec.ts e2e/smoke/layout-lock-matrix.spec.ts
          # Keep the instant-open regression covered even while its live mode is OFF.
          BROWSER_SMOKE_STATE_FILE=e2e/smoke/.state/smoke-state.json node scripts/seed-browser-smoke.mjs --instant-open-control
          npx playwright test -c playwright.config.smoke.ts e2e/smoke/prod.spec.ts --grep 'seeded board card opens'
          # Layout lock must also cover unreleased and newly registered flags.
          BROWSER_SMOKE_STATE_FILE=e2e/smoke/.state/smoke-state.json node scripts/seed-browser-smoke.mjs --all-flags-on
          npx playwright test -c playwright.config.smoke.ts e2e/smoke/layout-lock.spec.ts e2e/smoke/layout-lock-matrix.spec.ts e2e/smoke/agent-sidebar-chats.spec.ts
          # YPER4-629 core release test: the inbox cycle, last so layout lock still sees an empty inbox. Every flag on, then live-like modes.
          BROWSER_SMOKE_STATE_FILE=e2e/smoke/.state/smoke-state.json node scripts/seed-browser-smoke.mjs --inbox-cycle
          npx playwright test -c playwright.config.smoke.ts e2e/smoke/inbox-cycle.spec.ts
          BROWSER_SMOKE_STATE_FILE=e2e/smoke/.state/smoke-state.json node scripts/seed-browser-smoke.mjs --live-like-control
          BROWSER_SMOKE_STATE_FILE=e2e/smoke/.state/smoke-state.json node scripts/seed-browser-smoke.mjs --inbox-cycle
          npx playwright test -c playwright.config.smoke.ts e2e/smoke/inbox-cycle.spec.ts
          set +e
          BROWSER_SMOKE_STATE_FILE=e2e/smoke/.state/smoke-state.json node scripts/seed-browser-smoke.mjs --inbox-cycle
          reseed_status=$?
          if [ "$reseed_status" -eq 0 ]; then
            export VERIFY_QA_REPORT_ONLY=1
            export VERIFY_QA_BASE="$BASE_URL"
            export VERIFY_QA_STATE_FILE=e2e/smoke/.state/smoke-state.json
            export VERIFY_QA_FIXTURE=e2e/smoke/.state/inbox-cycle-fixture.json
            export VERIFY_QA_CHANGED_FILES="${RUNNER_TEMP}/changed-files.txt"
            export VERIFY_QA_OUT=verify-qa-premerge
            timeout --signal=TERM --kill-after=20s 160s node .github/scripts/verify-qa-premerge.mjs
            verify_qa_status=$?
            if grep -Eq '^(.github/scripts/verify-qa-premerge.mjs|tests/verify-qa-premerge.test.cjs)$' "$VERIFY_QA_CHANGED_FILES"; then
              printf '%s\n' 'src/lib/auth/session.ts' > "$RUNNER_TEMP/verify-qa-matched-files.txt"
              VERIFY_QA_CHANGED_FILES="$RUNNER_TEMP/verify-qa-matched-files.txt" VERIFY_QA_OUT=verify-qa-premerge/matched-control \
                timeout --signal=TERM --kill-after=20s 160s node .github/scripts/verify-qa-premerge.mjs
              control_status=$?
              if [ "$control_status" -ne 0 ]; then
                echo "::warning::verify-qa matched control exited ${control_status}; evidence is report-only"
              fi
            fi
          else
            verify_qa_status=$reseed_status
            echo "::warning::inbox reseed failed (${reseed_status}); skipped premerge verify-qa"
          fi
          set -e
          if [ "${verify_qa_status:-0}" -ne 0 ]; then
            echo "::warning::verify-qa premerge journey exited ${verify_qa_status}; evidence is report-only"
          fi
      # Failing parts are listed in the job log; their "after" screenshots (baseline boxes outlined) are here.
      - name: Upload layout lock screenshots
        if: failure() && (github.event_name == 'push' || steps.scope.outputs.heavy_needed == 'true')
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: layout-lock-matrix
          path: test-results/layout-lock-matrix/
          if-no-files-found: ignore
          retention-days: 7
      - name: Upload premerge verify-qa evidence
        id: verify-qa-evidence
        if: always() && (github.event_name == 'push' || steps.scope.outputs.heavy_needed == 'true')
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: verify-qa-premerge
          path: verify-qa-premerge/
          if-no-files-found: ignore
          retention-days: 7
      - name: Link premerge verify-qa evidence
        if: always() && steps.verify-qa-evidence.outputs.artifact-url != ''
        run: |
          printf '\nEvidence artifact: %s\n' "${{ steps.verify-qa-evidence.outputs.artifact-url }}" >> "$GITHUB_STEP_SUMMARY"


      - name: Upload sanitized outside-proof metadata
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: outside-proof-network
          path: ${{ runner.temp }}/proof-network/
          if-no-files-found: error
          retention-days: 7
