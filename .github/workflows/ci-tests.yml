      # push restores Chromium from the cache instead of downloading it again.
      # prod-health uses the same key, so the two jobs share one entry.
      - name: Restore Playwright browser cache
        id: restore-playwright-browsers
        if: github.event_name == 'push' || steps.scope.outputs.heavy_needed == 'true'
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-chromium-${{ runner.os }}-${{ hashFiles('package-lock.json') }}
      - name: Generate client and install Chromium
        if: github.event_name == 'push' || steps.scope.outputs.heavy_needed == 'true'
        run: |
          npx prisma generate
          # A restored node_modules skipped the npm postinstall that writes this file.
          npm run flags:generate
          printf '%s\n' 'https://archive.ubuntu.com/ubuntu/' | sudo tee /etc/apt/apt-mirrors.txt > /dev/null
          npx playwright install --with-deps chromium
          sudo apt-get update
          sudo apt-get install -y strace
      - name: Prepare disposable local credentials
        if: github.event_name == 'push' || steps.scope.outputs.heavy_needed == 'true'
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          # Derived from the commit so one build serves every consumer.
          seed="${{ github.event.pull_request.head.sha || github.sha }}-smoke"
          session_secret=$(printf '%s' "$seed:session" | sha256sum | cut -d' ' -f1)
          jwt_secret=$(printf '%s' "$seed:jwt" | sha256sum | cut -d' ' -f1)
          better_auth_secret=$(printf '%s' "$seed:better-auth" | sha256sum | cut -d' ' -f1)
          printf '::add-mask::%s\n' "$session_secret"
          printf '::add-mask::%s\n' "$jwt_secret"
          printf '::add-mask::%s\n' "$better_auth_secret"
          {
            printf '%s\n' 'DATABASE_URL=postgresql://browser_smoke:browser_smoke@127.0.0.1:5432/hypertask_smoke'
            printf '%s\n' 'REDIS_URL=redis://127.0.0.1:6379'
            printf 'SESSION_SECRET=%s\n' "$session_secret"
            printf 'JWT_SECRET=%s\n' "$jwt_secret"
            printf 'BETTER_AUTH_SECRET=%s\n' "$better_auth_secret"
            printf '%s\n' 'BETTER_AUTH_URL=http://127.0.0.1:3100'
            printf '%s\n' 'NEXT_PUBLIC_BASEURL=http://127.0.0.1:3100'
            printf '%s\n' 'TURBOPUFFER_BASE_URL=http://127.0.0.1:53101'
            printf '%s\n' 'TURBOPUFFER_API_KEY=disposable-fixture'
            printf '%s\n' 'HT_PREMERGE_AI_STUB=1'
            printf '%s\n' 'HT_PREMERGE_QUEUE_STUB=1'
            printf '%s\n' 'QSTASH_CALLBACK_BASE_URL=http://127.0.0.1:3100'
            printf '%s\n' 'QSTASH_AUTO_REGISTER_SWEEP=false'
            printf '%s\n' 'NEXT_PUBLIC_PUSHER_KEY=app-key'
            printf '%s\n' 'NEXT_PUBLIC_PUSHER_HOST=127.0.0.1'
            printf '%s\n' 'NEXT_PUBLIC_PUSHER_PORT=6001'
            printf '%s\n' 'NEXT_PUBLIC_PUSHER_USE_TLS=false'
            printf '%s\n' 'NEXT_PUBLIC_PUSHER_CLUSTER=mt1'
            printf '%s\n' 'PUSHER_APP_ID=app-id'
            printf '%s\n' 'PUSHER_KEY=app-key'
            printf '%s\n' 'PUSHER_SECRET=app-secret'
            printf '%s\n' 'PUSHER_HOST=127.0.0.1'
            printf '%s\n' 'PUSHER_PORT=6001'
            printf '%s\n' 'PUSHER_USE_TLS=false'
            printf '%s\n' 'PUSHER_CLUSTER=mt1'
          } >> "$GITHUB_ENV"
      - name: Create isolated database and logged-in fixtures
        if: github.event_name == 'push' || steps.scope.outputs.heavy_needed == 'true'
        id: fixtures
        env:
          BROWSER_SMOKE_STATE_FILE: e2e/smoke/.state/smoke-state.json
          BROWSER_SMOKE_SEARCH_FIXTURES: '1'
        run: |
          npx prisma migrate deploy
          node scripts/seed-browser-smoke.mjs --qa-journeys
      - name: Download the one build
        if: github.event_name == 'push' || steps.scope.outputs.heavy_needed == 'true'
        uses: actions/download-artifact@95815c38cf2ff2164869cbab79da8d1f422bc89e # v4.2.1
        with:
          name: app-build
          path: ${{ runner.temp }}/app-build
      - name: Unpack the one build
        if: github.event_name == 'push' || steps.scope.outputs.heavy_needed == 'true'
        run: |
          set -euo pipefail
          tar -xzf "$RUNNER_TEMP/app-build/app-build.tgz" -C "$RUNNER_TEMP/app-build"
          rm -rf .next
          mv "$RUNNER_TEMP/app-build/.next" .next
      - name: Serve and check phone pages and the layout matrix
        if: github.event_name == 'push' || steps.scope.outputs.heavy_needed == 'true'
        id: smoke
        env:
          BASE_URL: http://127.0.0.1:3100
          SMOKE_BOARD_PATH: ${{ steps.fixtures.outputs.board_path }}
          SMOKE_DEMO_BOARD_PATH: ${{ steps.fixtures.outputs.demo_board_path }}
          BROWSER_SMOKE_PR: '1'
        run: |
          set -euo pipefail
          node scripts/premerge-local-search.mjs e2e/smoke/.state/card-fixture.json 53101 > "$RUNNER_TEMP/contract-search.log" 2>&1 &
          search=$!
          npx next start -H 127.0.0.1 -p 3100 > "$RUNNER_TEMP/browser-smoke-server.log" 2>&1 &
          server=$!
          trap 'kill "$server" "$search" 2>/dev/null || true' EXIT
          for attempt in {1..60}; do
            if curl -fsS -o /dev/null "$BASE_URL/login"; then break; fi
            kill -0 "$server" 2>/dev/null || { echo '::error::Local app exited before it became ready'; exit 1; }
            sleep 2
          done
          curl -fsS -o /dev/null "$BASE_URL/login" || { echo '::error::Local app did not become ready'; exit 1; }
          for attempt in {1..30}; do
            if curl -fsS -o /dev/null "$TURBOPUFFER_BASE_URL/health"; then break; fi
            kill -0 "$search" 2>/dev/null || { cat "$RUNNER_TEMP/contract-search.log"; echo '::error::Fixture search exited before it became ready'; exit 1; }
            sleep 1
          done
          curl -fsS -o /dev/null "$TURBOPUFFER_BASE_URL/health" || { cat "$RUNNER_TEMP/contract-search.log"; echo '::error::Fixture search did not become ready'; exit 1; }
          BROWSER_SMOKE_STATE_FILE=e2e/smoke/.state/smoke-state.json node scripts/seed-browser-smoke.mjs --all-flags-on
          # HYCI-57: every registry flag on, both viewports, then the inbox
          # cycle with every flag on and again with live-like modes. Layout
          # lock still sees the empty inbox because it runs before the cycle.
          npx playwright test -c playwright.config.smoke.ts --project=Desktop --project=Mobile e2e/smoke/layout-lock.spec.ts e2e/smoke/agent-sidebar-chats.spec.ts
          BROWSER_SMOKE_STATE_FILE=e2e/smoke/.state/smoke-state.json node scripts/seed-browser-smoke.mjs --inbox-cycle
          npx playwright test -c playwright.config.smoke.ts --project=Inbox e2e/smoke/inbox-cycle.spec.ts
          BROWSER_SMOKE_STATE_FILE=e2e/smoke/.state/smoke-state.json node scripts/seed-browser-smoke.mjs --live-like-control
          BROWSER_SMOKE_STATE_FILE=e2e/smoke/.state/smoke-state.json node scripts/seed-browser-smoke.mjs --inbox-cycle
          npx playwright test -c playwright.config.smoke.ts --project=Inbox e2e/smoke/inbox-cycle.spec.ts
          set +e
          BROWSER_SMOKE_STATE_FILE=e2e/smoke/.state/smoke-state.json node scripts/seed-browser-smoke.mjs --inbox-cycle
          reseed_status=$?
          if [ "$reseed_status" -eq 0 ]; then
            export VERIFY_QA_REPORT_ONLY=1
            export VERIFY_QA_BASE="$BASE_URL"
            export VERIFY_QA_STATE_FILE=e2e/smoke/.state/smoke-state.json
            export VERIFY_QA_FIXTURE=e2e/smoke/.state/inbox-cycle-fixture.json
            export VERIFY_QA_CHANGED_FILES="${RUNNER_TEMP}/changed-files.txt"
            export VERIFY_QA_OUT=verify-qa-premerge
            timeout --signal=TERM --kill-after=20s 160s node .github/scripts/verify-qa-premerge.mjs
            verify_qa_status=$?
            if grep -Eq '^(.github/scripts/verify-qa-premerge.mjs|tests/verify-qa-premerge.test.cjs)$' "$VERIFY_QA_CHANGED_FILES"; then
              printf '%s\n' 'src/lib/auth/session.ts' > "$RUNNER_TEMP/verify-qa-matched-files.txt"
              VERIFY_QA_CHANGED_FILES="$RUNNER_TEMP/verify-qa-matched-files.txt" VERIFY_QA_OUT=verify-qa-premerge/matched-control \
                timeout --signal=TERM --kill-after=20s 160s node .github/scripts/verify-qa-premerge.mjs
              control_status=$?
              if [ "$control_status" -ne 0 ]; then
                echo "::warning::verify-qa matched control exited ${control_status}; evidence is report-only"
              fi
            fi
          else
            verify_qa_status=$reseed_status
            echo "::warning::inbox reseed failed (${reseed_status}); skipped premerge verify-qa"
          fi
          set -e
          if [ "${verify_qa_status:-0}" -ne 0 ]; then
            echo "::warning::verify-qa premerge journey exited ${verify_qa_status}; evidence is report-only"
          fi
      - name: Upload premerge verify-qa evidence
        id: verify-qa-evidence
        if: always() && (github.event_name == 'push' || steps.scope.outputs.heavy_needed == 'true')
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: verify-qa-premerge
          path: verify-qa-premerge/
          if-no-files-found: ignore
          retention-days: 7
      - name: Link premerge verify-qa evidence
        if: always() && steps.verify-qa-evidence.outputs.artifact-url != ''
        run: |
          printf '\nEvidence artifact: %s\n' "${{ steps.verify-qa-evidence.outputs.artifact-url }}" >> "$GITHUB_STEP_SUMMARY"
      - name: Upload failing smoke screenshots
        if: failure() && (github.event_name == 'push' || steps.scope.outputs.heavy_needed == 'true')
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: browser-smoke-flags-failures
          path: |
            test-results/**/*.png
            test-results/**/error-context.md
          if-no-files-found: ignore
          retention-days: 7

  browser-smoke:
    name: browser-smoke
    # HYCI-32: the required context the ruleset, the merge guard and
    # docs/ci-policy.yml all name. It stays one green/red result because it is a
    # summary over the page shards, not a test job: a red shard, a cancelled shard
    # or a shard that never reported is never a pass (a skipped required check
    # reads as passing, so the skip path is gated here as well).
    # HYCI-57: four shards, so the check is the slowest quarter of the page tests
    # plus one build instead of the slower of two halves.
    # HYCI-59: the one build is a need of its own, so a build that fails or is
    # cancelled before any shard starts is a red check, never a skipped one.
    needs: [browser-build, browser-smoke-desktop, browser-smoke-mobile, browser-smoke-matrix, browser-smoke-flags]
    if: always() && (github.event_name == 'push' || github.event.pull_request.draft == false)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions: {}
    outputs:
      # visual-compare and mcp-cli-api-contract read these two off this job, and
      # both live in the desktop half: the contract runs there, and the docs-only
      # scope answer is the same in either half.
      contract: ${{ needs.browser-smoke-desktop.outputs.contract }}
      docs_only: ${{ needs.browser-smoke-desktop.outputs.docs_only }}
    steps:
      - name: Require every browser shard
        env:
          BUILD: ${{ needs.browser-build.result }}
          DESKTOP: ${{ needs.browser-smoke-desktop.result }}
          MOBILE: ${{ needs.browser-smoke-mobile.result }}
          MATRIX: ${{ needs.browser-smoke-matrix.result }}
          FLAGS: ${{ needs.browser-smoke-flags.result }}
        run: |
          set -euo pipefail
          test "$BUILD" = success
          test "$DESKTOP" = success
          test "$MOBILE" = success
          test "$MATRIX" = success
          test "$FLAGS" = success

  visual-compare:
    name: visual-compare
    # HYCI-10: this comparison used to live in visual-regression.yml and build the
    # candidate a second time. It now reuses the build browser-smoke published, so a
    # screen change costs one build, not two. Advisory, like the workflow it replaces.
    # HYCI-77: it waited for the summary, so all four page shards (and the summary)
    # ran before the comparison could start, and it finished last on most of the
    # slowest pushes of the day. It needs only the one build and the scope answer
    # that build already publishes, so it now runs alongside the shards.
    needs: [browser-build]
    if: ${{ !cancelled() && github.event_name == 'pull_request' && github.event.pull_request.draft == false && needs.browser-build.result == 'success' && needs.browser-build.outputs.docs_only != 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      packages: read
    env:
      TZ: UTC
    services:
      postgres:
        image: ghcr.io/hypertask-ai/ci-postgres:16-bookworm@sha256:bb3e1a57e5407e0a5280b4211980a5e537f4abd234a87014ac979849a78dd825
        credentials:
          username: ${{ github.actor }}
          password: ${{ github.token }}
        env:
          POSTGRES_DB: hypertask_smoke
          POSTGRES_USER: browser_smoke
          POSTGRES_PASSWORD: browser_smoke
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U browser_smoke -d hypertask_smoke"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
      redis:
        image: ghcr.io/hypertask-ai/ci-redis:7-alpine@sha256:ff02b58f971e7d7d156a1267e283fcbbeee91773b6aa36c49dac28ecfe28eadf
        credentials:
          username: ${{ github.actor }}
          password: ${{ github.token }}
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    steps:
      - name: Checkout base
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          path: base
          persist-credentials: false
      - name: Checkout head
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          repository: ${{ github.event.pull_request.head.repo.full_name }}
          ref: ${{ github.event.pull_request.head.sha }}
          path: head
          persist-credentials: false
      # The comparison only runs when a screen or harness file changed; an
      # unreadable diff runs it rather than skipping it.
      - name: Determine visual scope
        id: scope
        working-directory: head
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: node .github/scripts/visual-change-scope.cjs
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        if: steps.scope.outputs.visual_needed != 'false'
        with:
          node-version: ^24.22.1
          check-latest: true
      - name: Identify exact baseline
        id: baseline
        shell: bash
        run: |
          echo "sha=$(git -C base rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          echo "head=$(git -C head rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          echo "image=$ImageVersion" >> "$GITHUB_OUTPUT"
      - name: Restore production baseline
        id: baseline-cache
        if: steps.scope.outputs.visual_needed != 'false'
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: ${{ runner.temp }}/visual-expected
          key: visual-base-v1-${{ runner.os }}-${{ runner.arch }}-${{ steps.baseline.outputs.image }}-${{ steps.baseline.outputs.sha }}-${{ hashFiles('head/e2e/visual/**', 'head/scripts/seed-browser-smoke.mjs', 'head/scripts/premerge-local-search.mjs', 'head/scripts/visual-regression-ci.mjs', 'head/.github/workflows/visual-regression.yml') }}
      - name: Restore base Next.js build cache
        id: restore-base-nextjs-cache
        if: steps.scope.outputs.visual_needed != 'false' && steps.baseline-cache.outputs.cache-hit != 'true'
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: .next/cache
          key: nextjs-${{ runner.os }}-${{ hashFiles('base/package-lock.json', 'base/next.config.*') }}-${{ steps.baseline.outputs.sha }}
          restore-keys: |
            nextjs-${{ runner.os }}-${{ hashFiles('base/package-lock.json', 'base/next.config.*') }}-
      - name: Stage base Next.js build cache
        if: steps.scope.outputs.visual_needed != 'false' && steps.baseline-cache.outputs.cache-hit != 'true'
        shell: bash
        run: |
          if [ -d .next/cache ]; then
            mkdir -p base/.next
            mv .next/cache base/.next/cache
          fi
      - name: Install pinned Chromium and fonts once
        if: steps.scope.outputs.visual_needed != 'false'
        run: |
          npm exec --yes --package=@playwright/test@1.64.0 -- playwright install --with-deps chromium
          sudo apt-get install -y fonts-liberation fonts-noto-core fonts-noto-color-emoji
      - name: Prepare disposable local credentials
        if: steps.scope.outputs.visual_needed != 'false'
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          # Derived from the commit so one build serves every consumer.
          seed="${{ github.event.pull_request.head.sha || github.sha }}-smoke"
          session_secret=$(printf '%s' "$seed:session" | sha256sum | cut -d' ' -f1)
          jwt_secret=$(printf '%s' "$seed:jwt" | sha256sum | cut -d' ' -f1)
          better_auth_secret=$(printf '%s' "$seed:better-auth" | sha256sum | cut -d' ' -f1)
          printf '::add-mask::%s\n' "$session_secret"
          printf '::add-mask::%s\n' "$jwt_secret"
          printf '::add-mask::%s\n' "$better_auth_secret"
          {
            printf '%s\n' 'DATABASE_URL=postgresql://browser_smoke:browser_smoke@127.0.0.1:5432/hypertask_smoke'
            printf '%s\n' 'REDIS_URL=redis://127.0.0.1:6379'
            printf 'SESSION_SECRET=%s\n' "$session_secret"
            printf 'JWT_SECRET=%s\n' "$jwt_secret"
            printf 'BETTER_AUTH_SECRET=%s\n' "$better_auth_secret"
            printf '%s\n' 'BETTER_AUTH_URL=http://127.0.0.1:3100'
            printf '%s\n' 'NEXT_PUBLIC_BASEURL=http://127.0.0.1:3100'
            printf '%s\n' 'TURBOPUFFER_BASE_URL=http://127.0.0.1:53101'
            printf '%s\n' 'TURBOPUFFER_API_KEY=disposable-fixture'
            printf '%s\n' 'HT_PREMERGE_AI_STUB=1'
            printf '%s\n' 'HT_PREMERGE_QUEUE_STUB=1'
            printf '%s\n' 'QSTASH_CALLBACK_BASE_URL=http://127.0.0.1:3100'
            printf '%s\n' 'QSTASH_AUTO_REGISTER_SWEEP=false'
            printf '%s\n' 'NEXT_PUBLIC_PUSHER_KEY=app-key'
            printf '%s\n' 'NEXT_PUBLIC_PUSHER_HOST=127.0.0.1'
            printf '%s\n' 'NEXT_PUBLIC_PUSHER_PORT=6001'
            printf '%s\n' 'NEXT_PUBLIC_PUSHER_USE_TLS=false'
            printf '%s\n' 'NEXT_PUBLIC_PUSHER_CLUSTER=mt1'
            printf '%s\n' 'PUSHER_APP_ID=app-id'
            printf '%s\n' 'PUSHER_KEY=app-key'
            printf '%s\n' 'PUSHER_SECRET=app-secret'
            printf '%s\n' 'PUSHER_HOST=127.0.0.1'
            printf '%s\n' 'PUSHER_PORT=6001'
            printf '%s\n' 'PUSHER_USE_TLS=false'
            printf '%s\n' 'PUSHER_CLUSTER=mt1'
          } >> "$GITHUB_ENV"
      - name: Download the one build
        if: steps.scope.outputs.visual_needed != 'false'
        uses: actions/download-artifact@95815c38cf2ff2164869cbab79da8d1f422bc89e # v4.2.1
        with:
          name: app-build
          path: ${{ runner.temp }}/app-build
      - name: Give the head the one build
        if: steps.scope.outputs.visual_needed != 'false'
        run: |
          mkdir -p "$RUNNER_TEMP/app-build/unpacked"
          tar -xzf "$RUNNER_TEMP/app-build/app-build.tgz" -C "$RUNNER_TEMP/app-build/unpacked"
          mv "$RUNNER_TEMP/app-build/unpacked/.next" head/.next
      - name: Build and capture base, then compare head
        if: steps.scope.outputs.visual_needed != 'false'
        env:
          VISUAL_BASE_CACHE_HIT: ${{ steps.baseline-cache.outputs.cache-hit }}
          VISUAL_BASE_ONLY: 'false'
          VISUAL_HEAD_BUILD: artifact
        run: node head/scripts/visual-regression-ci.mjs
      - name: Summarize failed screens
        if: always() && steps.scope.outputs.visual_needed != 'false' && hashFiles('head/scripts/visual-regression-ci.mjs') != ''
        env:
          VISUAL_BASE_CACHE_HIT: ${{ steps.baseline-cache.outputs.cache-hit }}
          VISUAL_BASE_ONLY: 'false'
          VISUAL_HEAD_BUILD: artifact
        run: node head/scripts/visual-regression-ci.mjs --summary
      - name: Upload visual differences
        if: failure() && steps.scope.outputs.visual_needed != 'false'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: visual-regression-diffs
          path: |
            test-results/**/*.png
            test-results/**/error-context.md
            test-results/**/trace.zip
          if-no-files-found: ignore
          retention-days: 7

  mcp-cli-api-contract:
    name: mcp-cli-api-contract
    needs: browser-smoke
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 2
    permissions: {}
    steps:
      - name: Require a successful producer and explicit contract pass
        env:
          SMOKE_RESULT: ${{ needs.browser-smoke.result }}
          CONTRACT_RESULT: ${{ needs.browser-smoke.outputs.contract }}
          DOCS_ONLY: ${{ needs.browser-smoke.outputs.docs_only }}
        run: |
          test "$SMOKE_RESULT" = success && { test "$CONTRACT_RESULT" = passed || test "${DOCS_ONLY:-false}" = true; }

  production-test-warning:
    name: production-test-warning
    # Unit tests report code correctness, not whether the live deployment is
    # unhealthy. Only the production-health workflow may change the live site.
    needs: ci-tests
    if: always() && github.event_name == 'push' && needs.ci-tests.outputs.test_failed == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      actions: read
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: ^24.22.1
          check-latest: true

      - name: Warn about failed production tests
        shell: bash
        env:
          BEFORE_SHA: ${{ github.event.before }}
          FAILED_TESTS: ${{ needs.ci-tests.outputs.failed_tests }}
          GH_TOKEN: ${{ github.token }}
          ALERT_GITHUB_TOKEN: ${{ secrets.AUTOMERGE_TOKEN }}
          HYPERTASK_MCP_TOKEN: ${{ secrets.HYPERTASK_MCP_TOKEN }}
        run: |
          set -euo pipefail

          HISTORY=$(node .github/scripts/should-auto-revert.mjs "$GITHUB_REPOSITORY" "$BEFORE_SHA" 2>/dev/null) || HISTORY='{}'
          HISTORY_REASON=$(printf '%s' "$HISTORY" | jq -r '.reason // "previous production test result unavailable"' 2>/dev/null || true)
          echo "::notice::Previous run: ${HISTORY_REASON:-previous production test result unavailable}"

          RUN_URL="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
          FAILED_TESTS="${FAILED_TESTS:-test command failed before naming a test}"
          MESSAGE=$(printf 'What failed: %s\nLive site changed: no\nNext: production stays live while the test failure is investigated\nRun: %s' "$FAILED_TESTS" "$RUN_URL")
          node .github/scripts/production-alert.mjs setup production-tests "$MESSAGE"
          echo "::warning::$FAILED_TESTS failed. Production was not reverted or rolled back."

  production-cli-parity:
    name: production-cli-parity
    # Candidate PRs are verified by parity-contract-trusted using the protected
    # base verifier. This job verifies the merged inventory against production.
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    env:
      TRUSTED_CLI_PACKAGE: "@hypertask/hypertask_cli"
      TRUSTED_CLI_VERSION: "2.0.10"
      TRUSTED_CLI_BINARY_VERSION: "0.2.15"
      TRUSTED_CLI_BINARY_SHA256: "685af04562d52683e7d6f8feed58fa807407176940558ba79fbcc7cc5406b2a9"
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: ^24.22.1
          check-latest: true

      - name: Verify production CLI parity inventory
        run: |
          CONTRACT_PACKAGE=$(node -p "require('./config/parity/contract.json').cliPackage.name")
          CONTRACT_VERSION=$(node -p "require('./config/parity/contract.json').cliPackage.version")
          if [ "$CONTRACT_PACKAGE" != "$TRUSTED_CLI_PACKAGE" ]; then
            echo "Parity contract selected untrusted package $CONTRACT_PACKAGE"
            exit 1
          fi
          if [ "$CONTRACT_VERSION" != "$TRUSTED_CLI_VERSION" ]; then
            echo "Parity contract selected untrusted version $CONTRACT_VERSION"
            exit 1
          fi
          LATEST_VERSION=$(npm view "$TRUSTED_CLI_PACKAGE" version)
          if [ "$LATEST_VERSION" != "$TRUSTED_CLI_VERSION" ]; then
            echo "Parity contract pins $CONTRACT_VERSION but production is $LATEST_VERSION"
            exit 1
          fi
          PARITY_TMP=$(mktemp -d "$RUNNER_TEMP/hypertask-parity.XXXXXX")
          cp config/parity/runner/package.json config/parity/runner/package-lock.json "$PARITY_TMP/"
          npm ci --prefix "$PARITY_TMP" --ignore-scripts --no-audit --no-fund
          CLI_BINARY="$PARITY_TMP/hypertask-native"
          curl --fail --location --silent --show-error \
            "https://github.com/hypertask-ai/cli/releases/download/v${TRUSTED_CLI_BINARY_VERSION}/hypertask-linux-x86_64" \
            --output "$CLI_BINARY"
          if ! echo "$TRUSTED_CLI_BINARY_SHA256  $CLI_BINARY" | sha256sum --check; then
            exit 1
          fi
          chmod 755 "$CLI_BINARY"
          env -u GITHUB_TOKEN -u GH_TOKEN "$CLI_BINARY" capabilities --json > "$PARITY_TMP/capabilities.json"
          node scripts/parity-contract.mjs \
            --check \
            --cli-capabilities "$PARITY_TMP/capabilities.json" \
            --typescript "$PARITY_TMP/node_modules/typescript/lib/typescript.js"
