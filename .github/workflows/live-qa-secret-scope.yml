name: Live QA Secret Scope

on:
  pull_request:
    branches: [production]

permissions:
  contents: read

jobs:
  secret-scope:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Assert PR jobs cannot receive broad-scope QA login secrets
        env:
          QA_SECRET_PRESENT: ${{ secrets.QA_LOGIN_EMAIL != '' || secrets.QA_LOGIN_PASSWORD != '' || secrets.QA_LOGIN_CREDENTIALS != '' }}
        run: |
          if [ "$QA_SECRET_PRESENT" = false ]; then
            echo 'secret-present=false'
          else
            echo 'secret-present=true'
            exit 1
          fi
