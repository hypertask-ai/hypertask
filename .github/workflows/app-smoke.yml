name: App Smoke

# This file runs from production after the GitHub-hosted request workflow.
# Pull-request code cannot change the runner decision or the token permissions.
on:
  workflow_run:
    workflows: ["App Smoke Request"]
    types: [completed]

concurrency:
  group: app-smoke-${{ github.event.workflow_run.pull_requests[0].number || github.event.workflow_run.id }}
  cancel-in-progress: true

permissions: {}

jobs:
  validate:
    name: validate app-smoke request
    runs-on: ubuntu-latest
    timeout-minutes: 2
    permissions:
      pull-requests: read
      statuses: write
    outputs:
      head-repository: ${{ steps.request.outputs.head-repository }}
      head-sha: ${{ steps.request.outputs.head-sha }}
      runner: ${{ steps.request.outputs.runner }}
    steps:
      - name: Validate the exact pull-request revision and choose its runner
        id: request
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          REQUEST_ACTOR: ${{ github.event.workflow_run.actor.login }}
          REQUEST_CONCLUSION: ${{ github.event.workflow_run.conclusion }}
          REQUEST_HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
          REQUEST_PR: ${{ github.event.workflow_run.pull_requests[0].number }}
        shell: bash
        run: |
          set -euo pipefail
          [ "$REQUEST_CONCLUSION" = "success" ] || { echo "::error::Request workflow failed."; exit 1; }
          [ -n "$REQUEST_PR" ] || { echo "::error::Request is not attached to a pull request."; exit 1; }

          pr_json=$(gh api "repos/$REPO/pulls/$REQUEST_PR")
          head_sha=$(jq -r '.head.sha' <<<"$pr_json")
          head_repository=$(jq -r '.head.repo.full_name' <<<"$pr_json")
          head_author=$(jq -r '.user.login' <<<"$pr_json")
          association=$(jq -r '.author_association' <<<"$pr_json")

          jq -e --arg sha "$REQUEST_HEAD_SHA" '
            .state == "open" and
            .draft == false and
            .base.ref == "production" and
            .head.sha == $sha
          ' <<<"$pr_json" >/dev/null || {
            echo "::error::Pull request changed after this request started."
            exit 1
          }

          runner='"ubuntu-latest"'
          if [ "$head_repository" = "$REPO" ] && [ "$REQUEST_ACTOR" = "$head_author" ] && [[ "$association" =~ ^(OWNER|MEMBER)$ ]]; then
            runner='["self-hosted","contabo"]'
          fi

          {
            echo "head-repository=$head_repository"
            echo "head-sha=$head_sha"
            echo "runner=$runner"
          } >>"$GITHUB_OUTPUT"
          gh api --method POST "repos/$REPO/statuses/$head_sha" \
            -f state=pending \
            -f context=app-smoke \
            -f description='Building and testing the real app'

  app-smoke:
    name: run app-smoke
    needs: validate
    runs-on: ${{ fromJSON(needs.validate.outputs.runner) }}
    timeout-minutes: 10
    permissions:
      contents: read
    container:
      image: node:20-bookworm
    services:
      postgres:
        image: postgres:16-bookworm
        env:
          POSTGRES_DB: hypertask_smoke
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        options: >-
          --health-cmd "pg_isready -U postgres -d hypertask_smoke"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    env:
      DATABASE_URL: postgresql://postgres:postgres@postgres:5432/hypertask_smoke
      SESSION_SECRET: core-actions-${{ github.run_id }}-${{ github.run_attempt }}
      NEXT_TELEMETRY_DISABLED: "1"
      CORE_SMOKE_BASE_URL: http://127.0.0.1:3100
      QSTASH_CALLBACK_BASE_URL: http://127.0.0.1:3100
      QSTASH_AUTO_REGISTER_SWEEP: "false"
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          repository: ${{ needs.validate.outputs.head-repository }}
          ref: ${{ needs.validate.outputs.head-sha }}
          fetch-depth: 1
          persist-credentials: false

      - name: Resolve dependency cache version
        id: dependency-cache-version
        run: |
          echo "node-abi=$(node -p 'process.versions.modules')" >> "$GITHUB_OUTPUT"
          echo "npm-major=$(npm --version | cut -d. -f1)" >> "$GITHUB_OUTPUT"

      - name: Restore trusted dependency cache
        id: restore-node-modules
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: node_modules
          key: node-modules-${{ runner.os }}-${{ runner.arch }}-abi${{ steps.dependency-cache-version.outputs.node-abi }}-npm${{ steps.dependency-cache-version.outputs.npm-major }}-${{ hashFiles('package-lock.json', 'package.json', '.npmrc') }}

      - name: Install dependencies
        if: steps.restore-node-modules.outputs.cache-hit != 'true'
        run: npm ci --prefer-offline --no-audit --no-fund

      - name: Prepare throwaway database
        run: |
          npx prisma generate
          npx prisma migrate deploy
          node scripts/seed-core-actions-smoke.mjs

      - name: Build the production app
        run: npx next build --webpack

      - name: Start the app and run the eight core actions
        shell: bash
        run: |
          set -euo pipefail
          node node_modules/next/dist/bin/next start -p 3100 >"$RUNNER_TEMP/app-smoke-next.log" 2>&1 &
          APP_PID=$!
          cleanup() {
            result=$?
            trap - EXIT
            kill "$APP_PID" 2>/dev/null || true
            wait "$APP_PID" 2>/dev/null || true
            if [ "$result" -ne 0 ]; then
              echo "::group::Next.js server log"
              tail -200 "$RUNNER_TEMP/app-smoke-next.log"
              echo "::endgroup::"
            fi
            exit "$result"
          }
          trap cleanup EXIT

          ready=0
          for attempt in $(seq 1 60); do
            if ! kill -0 "$APP_PID" 2>/dev/null; then
              echo "::error::Next.js exited before becoming ready."
              exit 1
            fi
            if node -e "fetch(process.env.CORE_SMOKE_BASE_URL, { redirect: 'manual' }).then(r => process.exit(r.status < 500 ? 0 : 1)).catch(() => process.exit(1))"; then
              ready=1
              break
            fi
            sleep 1
          done
          if [ "$ready" -ne 1 ]; then
            echo "::error::Next.js did not become ready within 60 seconds."
            exit 1
          fi

          node scripts/core-actions-smoke.mjs

  report:
    name: report app-smoke result
    if: always()
    needs: [validate, app-smoke]
    runs-on: ubuntu-latest
    timeout-minutes: 1
    permissions:
      actions: write
      contents: read
      statuses: write
    steps:
      - name: Publish the required status on the tested revision
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          PR: ${{ github.event.workflow_run.pull_requests[0].number }}
          HEAD_SHA: ${{ needs.validate.outputs.head-sha || github.event.workflow_run.head_sha }}
          VALIDATION_RESULT: ${{ needs.validate.result }}
          SMOKE_RESULT: ${{ needs.app-smoke.result }}
        shell: bash
        run: |
          set -euo pipefail
          state=failure
          description='App smoke failed'
          if [ "$VALIDATION_RESULT" = "success" ] && [ "$SMOKE_RESULT" = "success" ]; then
            state=success
            description='Real build and eight core actions passed'
          fi
          gh api --method POST "repos/$REPO/statuses/$HEAD_SHA" \
            -f state="$state" \
            -f context=app-smoke \
            -f description="$description"
          if [ -n "$PR" ]; then
            gh workflow run automerge.yml --repo "$REPO" --ref production -f pr="$PR"
          fi
