name: App Smoke

# This file runs from production. Pull-request code cannot change its checks,
# permissions, or the dependency cache created by production pushes.
on:
  push:
    branches: [production]
  workflow_run:
    workflows: ["App Smoke Request"]
    types: [completed]

permissions: {}

concurrency:
  group: ${{ github.event_name == 'push' && 'app-smoke-production-cache' || github.event.workflow_run.conclusion == 'cancelled' && format('app-smoke-cancelled-request-{0}', github.run_id) || format('app-smoke-{0}-{1}', github.event.workflow_run.head_repository.full_name, github.event.workflow_run.head_branch) }}
  cancel-in-progress: true
