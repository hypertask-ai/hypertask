name: App Smoke
run-name: ${{ github.event_name == 'workflow_run' && format('App Smoke request {0} for {1}:{2}', github.event.workflow_run.run_number, github.event.workflow_run.head_repository.full_name, github.event.workflow_run.head_branch) || 'App Smoke production cache' }}

# This file runs from production. Pull-request code cannot change its checks,
# permissions, or the dependency cache created by production pushes.
on:
  push:
    branches: [production]
  workflow_run:
    workflows: ["App Smoke Request"]
    types: [completed]

permissions: {}

concurrency:
  group: ${{ github.event_name == 'push' && 'app-smoke-production-cache' || format('app-smoke-run-{0}', github.run_id) }}
  cancel-in-progress: true

jobs:
  warm-dependencies:
    name: warm app-smoke dependencies
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 8
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 1
          persist-credentials: false

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: ^24.22.1
          check-latest: true

      - name: Resolve dependency cache version
        id: dependency-cache-version
        shell: bash
        run: |
          echo "node-abi=$(node -p 'process.versions.modules')" >> "$GITHUB_OUTPUT"
          echo "npm-major=$(npm --version | cut -d. -f1)" >> "$GITHUB_OUTPUT"

      - name: Restore the production app-smoke cache
        id: restore-node-modules
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: node_modules
          key: app-smoke-node-modules-${{ runner.os }}-${{ runner.arch }}-abi${{ steps.dependency-cache-version.outputs.node-abi }}-npm${{ steps.dependency-cache-version.outputs.npm-major }}-${{ hashFiles('package-lock.json', 'package.json', '.npmrc', 'prisma.config.ts', 'src/prisma/**') }}

      - name: Install production dependencies
        if: steps.restore-node-modules.outputs.cache-hit != 'true'
        run: npm ci --no-audit --no-fund && npx prisma generate

      - name: Save the production app-smoke cache
        if: steps.restore-node-modules.outputs.cache-hit != 'true'
        uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: node_modules
          key: ${{ steps.restore-node-modules.outputs.cache-primary-key }}

  # The request workflow cancels superseded duplicates. Only its surviving run
  # may validate or publish the required status for that revision.
  validate:
    name: validate app-smoke request
    if: github.event_name == 'workflow_run' && github.event.workflow_run.conclusion != 'cancelled'
    runs-on: ubuntu-latest
    timeout-minutes: 65
    permissions:
      actions: write
      contents: read
      pull-requests: read
      statuses: write
    outputs:
      head-repository: ${{ steps.request.outputs.head-repository }}
      head-sha: ${{ steps.request.outputs.head-sha }}
      pr: ${{ steps.request.outputs.pr }}
      superseded: ${{ steps.request.outputs.superseded == 'true' || steps.current-request.outputs.superseded == 'true' }}
      docs-only: ${{ steps.scope.outputs.heavy_needed == 'false' }}
    steps:
      - name: Validate the exact pull-request revision
        id: request
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          REQUEST_CONCLUSION: ${{ github.event.workflow_run.conclusion }}
          REQUEST_HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
          REQUEST_PR: ${{ github.event.workflow_run.pull_requests[0].number }}
        shell: bash
        run: |
          set -euo pipefail
          [ "$REQUEST_CONCLUSION" = "success" ] || { echo "::error::Request workflow failed."; exit 1; }

          if [ -z "$REQUEST_PR" ]; then
            prs_json=$(gh api "repos/$REPO/commits/$REQUEST_HEAD_SHA/pulls")
            REQUEST_PR=$(jq -r --arg sha "$REQUEST_HEAD_SHA" '
              [.[] | select(
                .state == "open" and
                .draft == false and
                .base.ref == "production" and
                .head.sha == $sha
              )] |
              if length == 1 then .[0].number else empty end
            ' <<<"$prs_json")
            if [ -z "$REQUEST_PR" ] && jq -e --arg sha "$REQUEST_HEAD_SHA" '
              all(.[]; .state != "open" or .base.ref != "production" or .head.sha != $sha)
            ' <<<"$prs_json" >/dev/null; then
              echo "::notice::No open production pull request has $REQUEST_HEAD_SHA as its head any more (closed, merged or pushed again); nothing to smoke."
              echo "superseded=true" >>"$GITHUB_OUTPUT"
              exit 0
            fi
          fi
          [ -n "$REQUEST_PR" ] || { echo "::error::Request is not attached to one open production pull request."; exit 1; }

          pr_json=$(gh api "repos/$REPO/pulls/$REQUEST_PR")
          head_sha=$(jq -r '.head.sha' <<<"$pr_json")
          head_repository=$(jq -r '.head.repo.full_name' <<<"$pr_json")
          jq -e --arg sha "$REQUEST_HEAD_SHA" '
            .state == "open" and
            .draft == false and
            .base.ref == "production" and
            .head.sha == $sha
          ' <<<"$pr_json" >/dev/null || {
            if jq -e --arg sha "$REQUEST_HEAD_SHA" '.state != "open" or .head.sha != $sha' <<<"$pr_json" >/dev/null; then
              echo "::notice::Pull request #$REQUEST_PR was closed or pushed again after this request started; its newest head gets its own request."
              echo "superseded=true" >>"$GITHUB_OUTPUT"
              exit 0
            fi
            echo "::error::Pull request changed after this request started."
            exit 1
          }

          {
            echo "head-repository=$head_repository"
            echo "head-sha=$head_sha"
            echo "pr=$REQUEST_PR"
            echo "base-sha=$(jq -r '.base.sha' <<<"$pr_json")"
          } >>"$GITHUB_OUTPUT"
          post_status() {
            for attempt in $(seq 1 20); do
              gh api --method POST "$@" && return 0
              echo "::warning::Status publish failed (attempt $attempt of 20); GitHub API rate limit may be the cause. Retrying in 180s."
              sleep 180
            done
            echo "### GitHub API rate limit, not a test failure" >>"$GITHUB_STEP_SUMMARY"
            echo "The app-smoke status could not be published after 20 tries over 60 minutes." >>"$GITHUB_STEP_SUMMARY"
            return 1
          }
          post_status "repos/$REPO/statuses/$head_sha" \
            -f state=pending \
            -f context=app-smoke \
            -f description='Building and testing the real app'

      - name: Check out the trusted scope detector
        if: steps.request.outputs.superseded != 'true'
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Determine heavy smoke scope
        id: scope
        if: steps.request.outputs.superseded != 'true'
        env:
          SCOPE_EVENT_NAME: pull_request
          BASE_SHA: ${{ steps.request.outputs.base-sha }}
          HEAD_SHA: ${{ steps.request.outputs.head-sha }}
        run: |
          if ! node .github/scripts/ci-change-scope.cjs; then
            echo "heavy_needed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Mint the hypertask-ci read token
        id: ci-token
        if: steps.request.outputs.superseded != 'true'
        continue-on-error: true
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          app-id: ${{ secrets.CI_APP_ID }}
          private-key: ${{ secrets.CI_APP_PRIVATE_KEY }}
          permission-actions: write
          permission-pull-requests: read
      - name: Recheck the head and cancel only older requests
        id: current-request
        if: steps.request.outputs.superseded != 'true'
        uses: actions/github-script@60a0d83039c74a4aee543508d2ffcb1c3799cdea # v7
        env:
          PR: ${{ steps.request.outputs.pr }}
          HEAD_SHA: ${{ steps.request.outputs.head-sha }}
          GH_FALLBACK_TOKEN: ${{ github.token }}
          CI_TOKEN_MINTED: ${{ steps.ci-token.outputs.token != '' }}
        with:
          github-token: ${{ steps.ci-token.outputs.token || github.token }}
          script: |
            const { retryGithubRequest } = await import(`${process.env.GITHUB_WORKSPACE}/.github/scripts/github-rate-limit.mjs`);
            let client = github;
            const discover = async () => {
              const request = context.payload.workflow_run;
              const currentHead = async () => {
                const { data: pr } = await client.rest.pulls.get({
                  ...context.repo, pull_number: Number(process.env.PR),
                });
                if (pr.state === 'open' && pr.head.sha === process.env.HEAD_SHA) return true;
                core.setOutput('superseded', 'true');
                core.info('The pull request was closed or pushed again; its newest head has its own request.');
                return false;
              };
              if (!await currentHead()) return;
              const runs = (await Promise.all(['queued', 'in_progress', 'waiting', 'pending', 'requested'].map(status =>
                client.paginate(client.rest.actions.listWorkflowRuns, {
                  ...context.repo, workflow_id: 'app-smoke.yml', event: 'workflow_run', status, per_page: 100,
                }),
              ))).flat();
              for (const run of runs) {
                if (run.id === context.runId || run.status === 'completed') continue;
                const match = /^App Smoke request ([0-9]+) for /.exec(run.display_title);
                if (!match) continue;
                const requestNumber = Number(match[1]);
                const title = `App Smoke request ${requestNumber} for ${request.head_repository.full_name}:${request.head_branch}`;
                if (run.display_title !== title) continue;
                if (!(requestNumber < request.run_number || (requestNumber === request.run_number && run.run_number < context.runNumber))) continue;
                if (!await currentHead()) return;
                try {
                  await client.rest.actions.cancelWorkflowRun({ ...context.repo, run_id: run.id });
                } catch (error) {
                  if (error.status !== 409) throw error;
                  core.info(`App Smoke run ${run.id} already finished cancelling or completed.`);
                }
              }
              await currentHead();
            };
            try {
              await retryGithubRequest(async () => {
                try {
                  await discover();
                } catch (error) {
                  if (client !== github || process.env.CI_TOKEN_MINTED !== 'true') throw error;
                  core.warning('hypertask-ci token failed; retrying with github.token');
                  client = new github.constructor({ auth: process.env.GH_FALLBACK_TOKEN });
                  await discover();
                }
              }, { log: core.warning });
            } catch (error) {
              if (!error.rateLimited) throw error;
              core.warning(`Could not cancel older app-smoke runs; continuing the build. ${error.message}`);
            }

  app-smoke:
    name: run app-smoke
    needs: validate
    runs-on: ubuntu-latest
    if: needs.validate.outputs.superseded != 'true' && needs.validate.outputs.docs-only != 'true'
    timeout-minutes: 15
    permissions:
      contents: read
      packages: read
    steps:
      - name: Check out the production-pinned smoke harness
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
          persist-credentials: false

      - name: Check out the candidate without executing it
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          repository: ${{ needs.validate.outputs.head-repository }}
          ref: ${{ needs.validate.outputs.head-sha }}
          path: candidate
          fetch-depth: 1
          persist-credentials: false

      - name: Match the production dependency cache
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: ^24.22.1
          check-latest: true

      - name: Resolve dependency cache version
        id: dependency-cache-version
        shell: bash
        run: |
          echo "node-abi=$(node -p 'process.versions.modules')" >> "$GITHUB_OUTPUT"
          echo "npm-major=$(npm --version | cut -d. -f1)" >> "$GITHUB_OUTPUT"

      - name: Restore the production app-smoke cache
        id: restore-node-modules
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: node_modules
          key: app-smoke-node-modules-${{ runner.os }}-${{ runner.arch }}-abi${{ steps.dependency-cache-version.outputs.node-abi }}-npm${{ steps.dependency-cache-version.outputs.npm-major }}-${{ hashFiles('package-lock.json', 'package.json', '.npmrc', 'prisma.config.ts', 'src/prisma/**') }}

      - name: Install production smoke dependencies
        if: steps.restore-node-modules.outputs.cache-hit != 'true'
        run: npm ci --no-audit --no-fund && npx prisma generate

      - name: Authenticate CI image pulls
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}

      - name: Build and test the candidate in disposable containers
        shell: bash
        env:
          CORE_SMOKE_TRUSTED_DEPENDENCIES: ${{ steps.restore-node-modules.outputs.cache-hit }}
        run: bash scripts/run-app-smoke-isolated.sh "$GITHUB_WORKSPACE/candidate" "$GITHUB_WORKSPACE"

  report:
    name: report app-smoke result
    if: always() && !cancelled() && github.event_name == 'workflow_run' && github.event.workflow_run.conclusion != 'cancelled' && needs.validate.outputs.superseded != 'true'
    needs: [validate, app-smoke]
    runs-on: ubuntu-latest
    timeout-minutes: 65
    permissions:
      actions: write
      contents: read
      pull-requests: read
      statuses: write
    steps:
      - name: Publish the required status on the tested revision
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          PR: ${{ needs.validate.outputs.pr }}
          HEAD_SHA: ${{ needs.validate.outputs.head-sha || github.event.workflow_run.head_sha }}
          VALIDATION_RESULT: ${{ needs.validate.result }}
          SMOKE_RESULT: ${{ needs.app-smoke.result }}
          DOCS_ONLY: ${{ needs.validate.outputs.docs-only }}
        shell: bash
        run: |
          set -euo pipefail
          if [ "$SMOKE_RESULT" = "cancelled" ]; then
            echo "::notice::Cancelled app-smoke work does not publish a failing required status."
            exit 0
          fi
          if [ -n "$PR" ]; then
            pr_json=$(gh api "repos/$REPO/pulls/$PR")
            if ! jq -e --arg sha "$HEAD_SHA" '.state == "open" and .head.sha == $sha' <<<"$pr_json" >/dev/null; then
              echo "::notice::The pull request was closed or pushed again; no stale app-smoke status will be published."
              exit 0
            fi
          fi
          state=failure
          description='App smoke failed'
          if [ "$VALIDATION_RESULT" = "success" ] && [ "$SMOKE_RESULT" = "success" ]; then
            state=success
            description='Real build and eight core actions passed'
          fi
          if [ "$VALIDATION_RESULT" = "success" ] && [ "$DOCS_ONLY" = "true" ]; then
            state=success
            description='docs-only change, skipped'
            echo "$description"
          fi
          post_status() {
            for attempt in $(seq 1 20); do
              gh api --method POST "$@" && return 0
              echo "::warning::Status publish failed (attempt $attempt of 20); GitHub API rate limit may be the cause. Retrying in 180s."
              sleep 180
            done
            echo "### GitHub API rate limit, not a test failure" >>"$GITHUB_STEP_SUMMARY"
            echo "The app-smoke status could not be published after 20 tries over 60 minutes." >>"$GITHUB_STEP_SUMMARY"
            return 1
          }
          post_status "repos/$REPO/statuses/$HEAD_SHA" \
            -f state="$state" \
            -f context=app-smoke \
            -f description="$description"
          if [ -n "$PR" ]; then
            # The status above is the result. Auto-merge is switched off by hand
            # on purpose, so a refused dispatch must not turn a green run red.
            gh workflow run automerge.yml --repo "$REPO" --ref production -f pr="$PR" ||
              echo "::warning::Could not start automerge.yml (workflow may be disabled). The app-smoke status was already published."
          fi
