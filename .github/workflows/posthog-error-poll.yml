name: PostHog Error Issues

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:

concurrency:
  group: posthog-issue-writer
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  issues:
    if: github.ref == 'refs/heads/production'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: production
      - name: File and count new production PostHog issues
        env:
          ERROR_ALERT_APP_URL: https://app.hypertask.ai
          ERROR_ALERT_BOARD_ID: "15"
          ERROR_ALERT_BUGS_SECTION_ID: "4389"
          ERROR_ALERT_VERCEL_PROJECT: hypertasks-prod
          HYPERTASK_MCP_TOKEN: ${{ secrets.HYPERTASK_MCP_TOKEN }}
          POSTHOG_FULL_API_KEY: ${{ secrets.POSTHOG_FULL_API_KEY }}
          POSTHOG_ISSUES_SINCE: ${{ vars.POSTHOG_ISSUES_SINCE }}
        run: node .github/scripts/posthog-error-poll.mjs
