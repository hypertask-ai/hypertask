name: AI evals

on:
  pull_request:
  push:
    branches: [production]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ai-evals-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  ai-evals:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: ^24.22.1
          check-latest: true
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm run flags:generate
      # Chat schemas use generated Prisma enums, but evals never connect to a database.
      - run: npx prisma generate
      - run: node --test tests/ai-eval.test.cjs tests/ai-prompt-registry.test.cjs
      - run: node --test tests/task-writer-eval.test.cjs
      - run: node scripts/task-writer-eval.cjs --verify-baseline
      - run: node scripts/ai-eval.cjs
        env:
          AI_EVAL_LIVE: "0"
          AI_EVAL_WRONG_TOOL_THRESHOLD: "0"
      - run: node --test tests/rag-search-eval.test.cjs
      - run: node scripts/rag-eval.cjs --check-set
      - name: Report search scores (no score threshold)
        run: |
          node scripts/rag-eval.cjs --output rag-search-report.json | tee rag-search-report.txt
          echo '```text' >> "$GITHUB_STEP_SUMMARY"
          cat rag-search-report.txt >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: rag-search-report
          path: rag-search-report.*
