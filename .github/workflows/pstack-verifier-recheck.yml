name: pstack-verifier-recheck
on:
  workflow_run:
    workflows: ["CI Tests", "PR Guards"]
    types: [completed]
  workflow_dispatch:
  schedule:
    - cron: "7,22,37,52 * * * *"
permissions: {}
jobs:
  recheck:
    if: "(github.event_name == 'workflow_run' && github.event.workflow_run.event == 'pull_request') || github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/production')"
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      pull-requests: read
      statuses: read
      actions: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: production
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: "^24.22.1"
          check-latest: true
      - env:
          GH_TOKEN: "${{ github.token }}"
        run: node .github/scripts/pstack-verifier-recheck.mjs
  chain:
    needs: [recheck]
    if: "!cancelled() && (github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/production'))"
    runs-on: ubuntu-latest
    timeout-minutes: 40
    permissions:
      contents: read
      actions: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: production
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: "^24.22.1"
          check-latest: true
      - name: Start the next recheck link
        env:
          GH_TOKEN: "${{ github.token }}"
          REPO: "${{ github.repository }}"
        run: node .github/scripts/schedule-chain.cjs hand-off --workflow pstack-verifier-recheck.yml --gap-minutes 30 --chain-events workflow_dispatch
