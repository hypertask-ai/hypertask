name: Trusted parity contract

on:
  pull_request_target:
    branches: [production]
    types: [opened, synchronize, reopened, ready_for_review]

permissions:
  contents: read

jobs:
  parity-contract-trusted:
    # Self-hosted despite pull_request_target: the job takes no secrets, runs
    # with contents: read, unsets GITHUB_TOKEN/GH_TOKEN before every command,
    # and only reads JSON and markdown out of the candidate checkout. It never
    # executes pull request code, and ci-fast already builds that code anyway.
    runs-on: ubuntu-latest
    env:
      TRUSTED_CLI_PACKAGE: "@hypertask/hypertask_cli"
      TRUSTED_CLI_VERSION: "2.0.9"
      TRUSTED_CLI_BINARY_VERSION: "0.2.14"
      TRUSTED_CLI_BINARY_SHA256: "3b4286ff78d66042b9a564150c548d3a6fc0cdc1e02bbda13128f7a39cab683f"
      TRUSTED_CLI_NPM_INTEGRITY: "sha512-D0FSkK19GDM0BybtvwBIJqfY1L1e9zGgUVa/8b6+ytm7xup4YoceKr6+dT060xAF0h59N8CVzVazw+4UrEc+Bg=="
    steps:
      - name: Check out trusted verifier from the base branch
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          path: trusted
          persist-credentials: false

      - name: Check out candidate source as data only
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          path: candidate
          persist-credentials: false

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24

      - name: Verify candidate inventory with the trusted base-branch verifier
        shell: bash
        run: |
          CONTRACT_PACKAGE=$(node -p "require('./candidate/config/parity/contract.json').cliPackage.name")
          CONTRACT_VERSION=$(node -p "require('./candidate/config/parity/contract.json').cliPackage.version")
          if [ "$CONTRACT_PACKAGE" != "$TRUSTED_CLI_PACKAGE" ] || [ "$CONTRACT_VERSION" != "$TRUSTED_CLI_VERSION" ]; then
            echo "Candidate parity contract does not select the trusted production CLI"
            exit 1
          fi
          node <<'NODE'
          const fs = require("node:fs");
          const read = (root, name) => fs.readFileSync(`${root}/config/parity/runner/${name}`, "utf8");
          const fail = () => {
            throw new Error("Candidate parity runner is not the reviewed lock for the contract CLI version");
          };
          for (const name of ["package.json", "package-lock.json"]) {
            if (read("candidate", name) !== read("trusted", name)) fail();
          }
          const lock = JSON.parse(read("trusted", "package-lock.json"));
          const cli = lock.packages[`node_modules/${process.env.TRUSTED_CLI_PACKAGE}`];
          if (cli.version !== process.env.TRUSTED_CLI_VERSION ||
              cli.integrity !== process.env.TRUSTED_CLI_NPM_INTEGRITY) fail();
          NODE

          PARITY_TMP=$(mktemp -d "$RUNNER_TEMP/hypertask-parity.XXXXXX")
          cp trusted/config/parity/runner/package.json trusted/config/parity/runner/package-lock.json "$PARITY_TMP/"
          npm ci --prefix "$PARITY_TMP" --ignore-scripts --no-audit --no-fund
          CLI_BINARY="$PARITY_TMP/hypertask-native"
          curl --fail --location --silent --show-error \
            "https://github.com/hypertask-ai/cli/releases/download/v${TRUSTED_CLI_BINARY_VERSION}/hypertask-linux-x86_64" \
            --output "$CLI_BINARY"
          if ! echo "$TRUSTED_CLI_BINARY_SHA256  $CLI_BINARY" | sha256sum --check; then
            exit 1
          fi
          chmod 755 "$CLI_BINARY"
          env -u GITHUB_TOKEN -u GH_TOKEN "$CLI_BINARY" capabilities --json > "$PARITY_TMP/capabilities.json"
          env -u GITHUB_TOKEN -u GH_TOKEN node trusted/scripts/parity-contract.mjs \
            --root candidate \
            --validate-only \
            --contract trusted/config/parity/contract.json \
            --baseline trusted/config/parity/generated-inventory.json \
            --candidate-contract candidate/config/parity/contract.json \
            --candidate-inventory candidate/config/parity/generated-inventory.json \
            --candidate-report candidate/docs/parity.md \
            --trusted-cli-package "$TRUSTED_CLI_PACKAGE" \
            --trusted-cli-version "$TRUSTED_CLI_VERSION" \
            --cli-capabilities "$PARITY_TMP/capabilities.json" \
            --typescript "$PARITY_TMP/node_modules/typescript/lib/typescript.js"
