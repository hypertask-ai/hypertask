name: UX Signoff Gate

# https://app.hypertask.ai/detail/project-15/7072 shipped new decision inbox UI
# in PR 1271 without Valentin's design yes. Visible UI needs ticket signoff
# on a clickable wireframe; new component names need his explicit approval too.
# Run trusted production code only. Reactions are reread on every pull request
# event, and the hourly pass is dispatched by ux-signoff-chain.yml (YPER4-985):
# GitHub ran the cron it used to own every four to six hours (12 of 168 runs in
# the seven days to 2026-11-02T04:17Z), so the schedule now lives in the chain and
# this workflow keeps only what it does itself.

on:
  pull_request_target:
    types: [opened, synchronize, reopened, edited, ready_for_review]
    branches: [production]
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: read
  statuses: write

concurrency:
  group: ux-signoff-gate
  queue: max
  cancel-in-progress: false

jobs:
  ux-signoff-gate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: production
          persist-credentials: false

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: ^24.22.1
          check-latest: true

      - name: Mint the hypertask-ci read token
        id: ci-token
        continue-on-error: true
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          app-id: ${{ secrets.CI_APP_ID }}
          private-key: ${{ secrets.CI_APP_PRIVATE_KEY }}
          permission-contents: read
          permission-pull-requests: read
          permission-statuses: read
      - name: Reconcile UX signoff from ticket comments
        env:
          GH_API_MAX_WAIT_SECONDS: '240'
          GH_API_TIME_BUDGET_SECONDS: '480'
          # Required status authorship is pinned to GitHub Actions.
          GH_TOKEN: ${{ github.token }}
          GH_READ_TOKEN: ${{ steps.ci-token.outputs.token }}
          MCP_TOKEN: ${{ secrets.HYPERTASK_MCP_TOKEN }}
          MCP_BASE_URL: https://app.hypertask.ai
          REPO: ${{ github.repository }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          EVENT_NAME: ${{ github.event_name }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          if [ "$EVENT_NAME" = pull_request_target ]; then
            node .github/scripts/ux-signoff-gate.mjs --reconcile --pr "$PR_NUMBER"
          else
            node .github/scripts/ux-signoff-gate.mjs --reconcile
          fi
