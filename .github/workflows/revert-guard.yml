# pull_request runs PR-authored workflows; safety depends on agent logins lacking
# .github/workflows write access (Hypertask Agents App has no workflows permission)
# and HUMAN_APPROVERS being a login held by no automation.
name: Revert Guard

on:
  pull_request:
    branches: [production]
    types: [opened, synchronize, reopened, labeled, unlabeled]

permissions:
  contents: read
  # Needed to read the PR's labels live; without it gh 403s and the
  # intentional-revert override never takes effect.
  pull-requests: read
  issues: read
  checks: read

jobs:
  clear-revert-label:
    if: github.event.action == 'synchronize' && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    permissions:
      pull-requests: write
      issues: write
    steps:
      - name: Require fresh approval after a push
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          set -euo pipefail
          labels=$(gh api --paginate "repos/${{ github.repository }}/issues/$PR_NUMBER/labels?per_page=100" --jq '.[].name')
          if grep -Fxq intentional-revert <<< "$labels"; then
            gh api -X DELETE "repos/${{ github.repository }}/issues/$PR_NUMBER/labels/intentional-revert"
          fi

  revert-guard:
    name: revert-guard
    needs: clear-revert-label
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    concurrency:
      group: revert-guard-${{ github.event.pull_request.number }}
      cancel-in-progress: true
    steps:
      - name: Verify label was cleared after the push
        if: github.event.action == 'synchronize' && github.event.pull_request.head.repo.full_name == github.repository && needs.clear-revert-label.result != 'success'
        run: exit 1

      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha }}

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 20

      - name: Check for stale-branch clobbers
        env:
          GITHUB_BASE_REF: ${{ github.base_ref }}
          # Live fetch, not the event payload: the payload freezes labels at
          # trigger time, so intentional-revert added after the run fires (or
          # before a rerun) was invisible and cost a retrigger commit every time.
          GH_TOKEN: ${{ github.token }}
          HUMAN_APPROVERS: ${{ vars.HUMAN_APPROVERS || 'valentinyeo' }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          PR_HEAD_IS_FORK: ${{ github.event.pull_request.head.repo.full_name != github.repository }}
        run: |
          PR_LABELS=$(gh api --paginate "repos/${{ github.repository }}/issues/$PR_NUMBER/labels?per_page=100" --jq '.[] | {name}') || PR_LABELS=""
          PR_LABELS=$(printf '%s\n' "$PR_LABELS" | jq -s '.')
          export PR_LABELS
          git fetch --quiet origin "$GITHUB_BASE_REF:refs/remotes/origin/$GITHUB_BASE_REF"
          git show "origin/$GITHUB_BASE_REF:.github/scripts/revert-guard.mjs" > "$RUNNER_TEMP/rg.mjs"
          node "$RUNNER_TEMP/rg.mjs"
