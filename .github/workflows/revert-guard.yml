name: Revert Guard

on:
  pull_request:
    branches: [production]
    types: [opened, synchronize, reopened, labeled, unlabeled]

concurrency:
  group: revert-guard-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions:
  contents: read
  # Needed to read the PR's labels live; without it gh 403s and the
  # intentional-revert override never takes effect.
  pull-requests: read

jobs:
  revert-guard:
    name: revert-guard
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha }}

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 20

      - name: Check for stale-branch clobbers
        env:
          GITHUB_BASE_REF: ${{ github.base_ref }}
          # Live fetch, not the event payload: the payload freezes labels at
          # trigger time, so intentional-revert added after the run fires (or
          # before a rerun) was invisible and cost a retrigger commit every time.
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          PR_LABELS=$(gh api "repos/${{ github.repository }}/issues/$PR_NUMBER/labels" --jq '[.[] | {name}]') || PR_LABELS="[]"
          export PR_LABELS
          node .github/scripts/revert-guard.mjs
