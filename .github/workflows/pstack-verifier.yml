name: pstack-verifier
on:
  workflow_run:
    workflows: ["Pstack Verifier Request"]
    types: [completed]
permissions: {}
concurrency:
  group: pstack-verifier-${{ github.event.workflow_run.head_sha }}
  cancel-in-progress: true
jobs:
  resolve:
    if: github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions: { contents: read, pull-requests: read, statuses: write }
    outputs:
      skip: ${{ steps.resolve.outputs.skip }}
      rev: ${{ steps.resolve.outputs.rev }}
      pr: ${{ steps.resolve.outputs.pr }}
      repository: ${{ steps.resolve.outputs.repository }}
    steps:
      - &trusted
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - id: resolve
        run: node scripts/pstack-verifier.mjs resolve
  drive:
    needs: resolve
    if: needs.resolve.outputs.skip != 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 35
    permissions: { contents: read, packages: read, actions: read }
    steps:
      - <<: *trusted
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          repository: ${{ needs.resolve.outputs.repository }}
          ref: ${{ needs.resolve.outputs.rev }}
          path: candidate
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with: { node-version: "^24.22.1", check-latest: true }
      - run: npm ci --no-audit --no-fund && npx prisma generate && npm install --prefix "$RUNNER_TEMP/relay" --no-audit --no-fund @actions/artifact@2.1.11
      - run: echo "$GITHUB_TOKEN" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin
      - env:
          PSTACK_RELAY: "1"
          CORE_SMOKE_TRUSTED_DEPENDENCIES: "true"
          REPO: ${{ github.repository }}
          PR: ${{ needs.resolve.outputs.pr }}
          HEAD_SHA: ${{ needs.resolve.outputs.rev }}
          NODE_PATH: ${{ runner.temp }}/relay/node_modules
        run: bash scripts/pstack-verifier-job.sh "$GITHUB_WORKSPACE" "$GITHUB_WORKSPACE/candidate" "${{ runner.temp }}/pstack-verifier"
      - if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: pstack-verifier-${{ needs.resolve.outputs.pr }}
          if-no-files-found: ignore
          retention-days: 14
          path: |
            ${{ runner.temp }}/pstack-verifier/verdict.json
            ${{ runner.temp }}/pstack-verifier/shots
  model:
    needs: resolve
    if: needs.resolve.outputs.skip != 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 35
    permissions: { contents: read, actions: read }
    steps:
      - <<: *trusted
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with: { node-version: "^24.22.1", check-latest: true }
      - run: npm install --prefix "$RUNNER_TEMP/relay" --no-audit --no-fund @actions/artifact@2.1.11
      - env:
          OPENROUTER_EVAL_KEY: ${{ secrets.OPENROUTER_EVAL_KEY }}
          NODE_PATH: ${{ runner.temp }}/relay/node_modules
        run: node scripts/pstack-verifier.mjs answer
  post:
    needs: [resolve, drive]
    if: always() && needs.resolve.result == 'success' && needs.resolve.outputs.skip != 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions: { contents: read, actions: read, statuses: write }
    steps:
      - <<: *trusted
      - uses: actions/download-artifact@95815c38cf2ff2164869cbab79da8d1f422bc89e
        continue-on-error: true
        with:
          name: pstack-verifier-${{ needs.resolve.outputs.pr }}
          path: ${{ runner.temp }}/pstack-verifier
      - if: always()
        env:
          REPO: ${{ github.repository }}
          HEAD_SHA: ${{ needs.resolve.outputs.rev || github.event.workflow_run.head_sha }}
          PR: ${{ needs.resolve.outputs.pr || github.event.workflow_run.pull_requests[0].number }}
        run: |
          node scripts/pstack-verifier.mjs post && exit 0 || code=$?
          if [ "$code" -eq 2 ]; then exit 2; fi
          gh api --method POST "repos/$REPO/statuses/$HEAD_SHA" -f state=failure -f context=pstack-verifier -f description="FAIL: The verifier did not finish."
          exit 1
  pstack-verifier-cancel:
    needs: [resolve, post]
    if: always() && needs.resolve.outputs.skip != 'true' && (needs.resolve.result != 'success' || needs.post.result != 'success')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions: { contents: read, statuses: write }
    steps:
      - run: |
          state="$(gh api "repos/${{ github.repository }}/commits/${{ github.event.workflow_run.head_sha }}/statuses" --jq '[.[]|select(.context=="pstack-verifier")][0].state' || true)"
          if [ "$state" = "success" ] || [ "$state" = "failure" ]; then exit 0; fi
          gh api --method POST "repos/${{ github.repository }}/statuses/${{ github.event.workflow_run.head_sha }}" -f state=failure -f context=pstack-verifier -f description="FAIL: The verifier did not finish."
          exit 1
