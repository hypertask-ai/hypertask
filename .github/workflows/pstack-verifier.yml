name: Pstack verifier

on:
  workflow_run:
    workflows: ["Pstack verifier request"]
    types: [completed]
  workflow_dispatch:
    inputs:
      pr:
        description: Pull request number to verify
        required: true
        type: string
      author_family:
        description: Author family when commits have no Author-Family trailer
        required: false
        type: string

permissions:
  contents: read
  pull-requests: write
  checks: write

concurrency:
  group: ${{ github.event_name == 'workflow_run' && format('pstack-verifier-{0}-{1}', github.event.workflow_run.pull_requests[0].number, github.event.workflow_run.head_sha) || format('pstack-verifier-{0}-manual', inputs.pr) }}
  cancel-in-progress: true

jobs:
  verify:
    name: Drive this pull request
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'workflow_run' && github.event.workflow_run.event == 'pull_request' &&
       github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.pull_requests[0] != null &&
       github.event.workflow_run.head_repository.full_name == github.repository)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      PSTACK_PLAN: ${{ runner.temp }}/pstack-plan.json
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: production
          fetch-depth: 1
          persist-credentials: false
          sparse-checkout: |
            .github/scripts/pstack-verifier
            .claude/skills/verify-qa/reference/feature-map
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: ^24.22.1
          check-latest: true
      - name: Prepare the verdict
        id: prepare
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          PR_INPUT: ${{ github.event_name == 'workflow_dispatch' && inputs.pr || github.event.workflow_run.pull_requests[0].number }}
          EVENT_SHA: ${{ github.event.workflow_run.head_sha }}
          EVENT_NAME: ${{ github.event_name }}
          AUTHOR_FAMILY: ${{ github.event_name == 'workflow_dispatch' && inputs.author_family || '' }}
          CLAUDE_READY: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN != '' }}
          DEEPSEEK_READY: ${{ secrets.OPENCODE_API_KEY != '' }}
        run: node .github/scripts/pstack-verifier/prepare.cjs
      - name: Install the pinned Claude Code CLI
        if: steps.prepare.outputs.surface == 'app' && contains(steps.prepare.outputs.try, 'claude')
        run: npm install --global @anthropic-ai/claude-code@2.1.325
      - name: Install the browser driver
        if: steps.prepare.outputs.surface == 'app'
        run: |
          npm install --prefix "$RUNNER_TEMP/pstack-drive" --no-audit --no-fund @playwright/test@1.64.1
          PLAYWRIGHT_BROWSERS_PATH="$RUNNER_TEMP/pstack-browsers" "$RUNNER_TEMP/pstack-drive/node_modules/.bin/playwright" install --with-deps chromium
      - name: Drive, judge and post the verdict
        if: always() && steps.prepare.outputs.go == 'yes'
        env:
          GH_TOKEN: ${{ github.token }}
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          OPENCODE_API_KEY: ${{ secrets.OPENCODE_API_KEY }}
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          QA_LOGIN_EMAIL: ${{ secrets.QA_LOGIN_EMAIL }}
          QA_LOGIN_PASSWORD: ${{ secrets.QA_LOGIN_PASSWORD }}
          NODE_PATH: ${{ runner.temp }}/pstack-drive/node_modules
          PLAYWRIGHT_BROWSERS_PATH: ${{ runner.temp }}/pstack-browsers
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: node .github/scripts/pstack-verifier/verify.cjs
