name: pstack-verifier
on:
  workflow_run:
    workflows: ["Pstack Verifier Request"]
    types: [completed]
permissions: {}
concurrency:
  group: pstack-verifier-${{ github.event.workflow_run.head_sha }}
  cancel-in-progress: true
jobs:
  resolve:
    if: github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions: { contents: read, pull-requests: read, actions: read }
    outputs:
      stop: ${{ steps.resolve.outputs.stop }}
      mark: ${{ steps.resolve.outputs.mark }}
      description: ${{ steps.resolve.outputs.description }}
      pr: ${{ steps.resolve.outputs.pr }}
      sha: ${{ steps.resolve.outputs.sha }}
      base: ${{ steps.resolve.outputs.base }}
      files: ${{ steps.resolve.outputs.files }}
      author: ${{ steps.resolve.outputs.author }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with: { ref: "${{ github.sha }}", fetch-depth: 1, persist-credentials: false }
      - id: resolve
        env: { GH_TOKEN: "${{ github.token }}" }
        run: node scripts/pstack-verifier.mjs resolve
      - if: steps.resolve.outputs.stop != 'true'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with: { name: "pstack-request-${{ github.run_id }}-${{ github.run_attempt }}", retention-days: 7, path: "${{ runner.temp }}/pstack-verifier/request" }
  plan:
    needs: [resolve]
    if: needs.resolve.result == 'success' && needs.resolve.outputs.stop != 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions: { contents: read }
    outputs:
      empty: ${{ steps.plan.outputs.empty }}
      model: ${{ steps.plan.outputs.model }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with: { ref: "${{ github.sha }}", fetch-depth: 1, persist-credentials: false }
      - uses: actions/download-artifact@95815c38cf2ff2164869cbab79da8d1f422bc89e
        with: { name: "pstack-request-${{ github.run_id }}-${{ github.run_attempt }}", path: "${{ runner.temp }}/pstack-verifier/request" }
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with: { repository: valentinyeo/token-ladder, ref: deb4fa6c0fd1d47576804538242a1e7f231d21dd, path: token-ladder, fetch-depth: 1, persist-credentials: false }
      - id: plan
        env:
          GH_TOKEN: "${{ github.token }}"
          PSTACK_VERIFIER_ALT_MODEL: "${{ vars.PSTACK_VERIFIER_ALT_MODEL }}"
          HEAD_SHA: "${{ needs.resolve.outputs.sha }}"
          LADDER_CALL_BIN: "${{ github.workspace }}/token-ladder/ci/ladder-call"
          LADDER_CALL_ROOT: "${{ github.workspace }}/token-ladder"
          AI_GATEWAY_API_KEY: "${{ secrets.AI_GATEWAY_API_KEY }}"
          OPENCODE_API_KEY: "${{ secrets.OPENCODE_API_KEY }}"
          DEEPSEEK_API_KEY: "${{ secrets.DEEPSEEK_API_KEY }}"
          OPENROUTER_API_KEY: "${{ secrets.OPENROUTER_EVAL_KEY }}"
        run: node scripts/pstack-verifier.mjs plan
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with: { name: "pstack-plan-${{ github.run_id }}-${{ github.run_attempt }}", retention-days: 7, if-no-files-found: error, path: "${{ runner.temp }}/pstack-verifier/plan" }
  drive:
    needs: [resolve, plan]
    if: needs.resolve.outputs.stop != 'true' && needs.plan.result == 'success' && needs.plan.outputs.empty != 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions: { contents: read, packages: read }
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with: { ref: "${{ github.sha }}", fetch-depth: 1, persist-credentials: false }
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with: { repository: "${{ github.repository }}", ref: "${{ needs.resolve.outputs.sha }}", path: candidate, fetch-depth: 1, persist-credentials: false }
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with: { node-version: "^24.22.1", check-latest: true }
      - run: npm ci --no-audit --no-fund && npx playwright install --with-deps chromium
      - name: Generate Prisma client
        run: npx prisma generate
      - env: { GH_TOKEN: "${{ github.token }}" }
        run: set -o pipefail; printf '%s\n' "$GH_TOKEN" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin
      - uses: actions/download-artifact@95815c38cf2ff2164869cbab79da8d1f422bc89e
        with: { name: "pstack-plan-${{ github.run_id }}-${{ github.run_attempt }}", path: "${{ runner.temp }}/pstack-verifier/plan" }
      - env: { HEAD_SHA: "${{ needs.resolve.outputs.sha }}", CORE_SMOKE_TRUSTED_DEPENDENCIES: "true" }
        run: bash scripts/pstack-verifier-job.sh "$GITHUB_WORKSPACE" "$GITHUB_WORKSPACE/candidate" "${{ runner.temp }}/pstack-verifier"
      - id: base-plan
        env: { HEAD_SHA: "${{ needs.resolve.outputs.sha }}" }
        run: node scripts/pstack-verifier.mjs base-plan
      - if: steps.base-plan.outputs.needed == 'true'
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with: { repository: "${{ github.repository }}", ref: "${{ needs.resolve.outputs.base }}", path: candidate-base, fetch-depth: 1, persist-credentials: false }
      - if: steps.base-plan.outputs.needed == 'true'
        continue-on-error: true
        env: { HEAD_SHA: "${{ needs.resolve.outputs.sha }}", CORE_SMOKE_TRUSTED_DEPENDENCIES: "true", PSTACK_PLAN_FILE: "${{ runner.temp }}/pstack-verifier/plan/base-plan.json" }
        run: |
          bash scripts/pstack-verifier-job.sh "$GITHUB_WORKSPACE" "$GITHUB_WORKSPACE/candidate-base" "${{ runner.temp }}/pstack-verifier-base"
          cp "${{ runner.temp }}/pstack-verifier-base/evidence/evidence.json" "${{ runner.temp }}/pstack-verifier/evidence/base-evidence.json"
      - if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with: { name: "pstack-evidence-${{ github.run_id }}-${{ github.run_attempt }}", retention-days: 7, if-no-files-found: ignore, path: "${{ runner.temp }}/pstack-verifier/evidence" }
  judge:
    needs: [resolve, plan, drive]
    if: always() && needs.resolve.outputs.stop != 'true' && needs.plan.result == 'success' && (needs.drive.result == 'success' || needs.drive.result == 'failure' || needs.drive.result == 'skipped')
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions: { contents: read, checks: read, statuses: read, actions: read }
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with: { ref: "${{ github.sha }}", fetch-depth: 1, persist-credentials: false }
      - uses: actions/download-artifact@95815c38cf2ff2164869cbab79da8d1f422bc89e
        with: { name: "pstack-plan-${{ github.run_id }}-${{ github.run_attempt }}", path: "${{ runner.temp }}/pstack-verifier/plan" }
      - uses: actions/download-artifact@95815c38cf2ff2164869cbab79da8d1f422bc89e
        continue-on-error: true
        with: { name: "pstack-evidence-${{ github.run_id }}-${{ github.run_attempt }}", path: "${{ runner.temp }}/pstack-verifier/evidence" }
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with: { repository: valentinyeo/token-ladder, ref: deb4fa6c0fd1d47576804538242a1e7f231d21dd, path: token-ladder, fetch-depth: 1, persist-credentials: false }
      - env:
          GH_TOKEN: "${{ github.token }}"
          PSTACK_VERIFIER_ALT_MODEL: "${{ vars.PSTACK_VERIFIER_ALT_MODEL }}"
          HEAD_SHA: "${{ needs.resolve.outputs.sha }}"
          LADDER_CALL_BIN: "${{ github.workspace }}/token-ladder/ci/ladder-call"
          LADDER_CALL_ROOT: "${{ github.workspace }}/token-ladder"
          AI_GATEWAY_API_KEY: "${{ secrets.AI_GATEWAY_API_KEY }}"
          OPENCODE_API_KEY: "${{ secrets.OPENCODE_API_KEY }}"
          DEEPSEEK_API_KEY: "${{ secrets.DEEPSEEK_API_KEY }}"
          OPENROUTER_API_KEY: "${{ secrets.OPENROUTER_EVAL_KEY }}"
        run: node scripts/pstack-verifier.mjs judge
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with: { name: "pstack-verdict-${{ github.run_id }}-${{ github.run_attempt }}", retention-days: 7, if-no-files-found: error, path: "${{ runner.temp }}/pstack-verifier/verdict" }
  mark:
    needs: [resolve]
    if: "${{ github.ref == 'refs/heads/production' && needs.resolve.result == 'success' && needs.resolve.outputs.mark != 'skip' }}"
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: pstack-verifier
    permissions: { contents: read, statuses: read }
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with: { ref: "${{ github.sha }}", fetch-depth: 1, persist-credentials: false }
      - env: { GH_TOKEN: "${{ github.token }}", HYPERTASK_RUNNERS_KEY: "${{ secrets.HYPERTASK_RUNNERS_KEY }}", HEAD_SHA: "${{ needs.resolve.outputs.sha }}", MARK: "${{ needs.resolve.outputs.mark }}", MARK_DESCRIPTION: "${{ needs.resolve.outputs.description }}" }
        run: node scripts/pstack-verifier.mjs mark
  post:
    needs: [resolve, judge, mark]
    if: "${{ github.ref == 'refs/heads/production' && !cancelled() && needs.resolve.outputs.stop != 'true' && needs.resolve.result == 'success' && needs.mark.result == 'success' && needs.judge.result != 'cancelled' }}"
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: pstack-verifier
    permissions: { actions: read, contents: read, pull-requests: write, statuses: read }
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with: { ref: "${{ github.sha }}", fetch-depth: 1, persist-credentials: false }
      - uses: actions/download-artifact@95815c38cf2ff2164869cbab79da8d1f422bc89e
        continue-on-error: true
        with: { name: "pstack-verdict-${{ github.run_id }}-${{ github.run_attempt }}", path: "${{ runner.temp }}/pstack-verifier/verdict" }
      - env: { GH_TOKEN: "${{ github.token }}", HYPERTASK_RUNNERS_KEY: "${{ secrets.HYPERTASK_RUNNERS_KEY }}", HEAD_SHA: "${{ needs.resolve.outputs.sha }}", PR: "${{ needs.resolve.outputs.pr }}" }
        run: started="$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}" --jq .run_started_at || true)"; RUN_STARTED_AT="$started" node scripts/pstack-verifier.mjs post
  cancel:
    needs: [resolve, post]
    if: "${{ github.ref == 'refs/heads/production' && !cancelled() && needs.resolve.outputs.stop != 'true' && needs.post.result != 'success' }}"
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: pstack-verifier
    permissions: { contents: read, statuses: read }
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with: { ref: "${{ github.sha }}", fetch-depth: 1, persist-credentials: false }
      - env: { GH_TOKEN: "${{ github.token }}", HYPERTASK_RUNNERS_KEY: "${{ secrets.HYPERTASK_RUNNERS_KEY }}", HEAD_SHA: "${{ needs.resolve.outputs.sha || github.event.workflow_run.head_sha }}" }
        run: node scripts/pstack-verifier.mjs cancel
