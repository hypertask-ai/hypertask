name: MCP client eval

on:
  schedule:
    - cron: "0 6 * * 1"
  pull_request:
    paths:
      - "evals/mcp-client/**"
      - "src/lib/mcp-server/**"
      - "src/lib/mcp/**"
      - "src/app/api/mcp/**"
      - "src/app/mcp/**"
      - "src/lib/mcpClientEval/**"
      - ".github/workflows/mcp-client-eval.yml"
  workflow_dispatch:

jobs:
  mcp-client-eval:
    name: mcp-client-eval
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 20
          cache: npm

      - name: Install Node dependencies
        run: |
          npm ci --ignore-scripts
          npx prisma generate

      - name: Install the native hypertask CLI
        run: |
          set -euo pipefail
          curl -fsSL -o /tmp/hypertask \
            https://github.com/hypertask-ai/cli/releases/download/v0.2.2/hypertask-linux-x86_64
          chmod +x /tmp/hypertask
          echo "EVAL_HYPERTASK_BIN=/tmp/hypertask" >> "$GITHUB_ENV"

      - name: Grade the 20-task catalog against isolated fixtures
        run: node --test tests/mcp-client-eval.test.cjs
        env:
          EVAL_HYPERTASK_BIN: /tmp/hypertask

      - name: Write the production-surface report
        if: github.event_name == 'pull_request'
        run: node evals/mcp-client/run.mjs --mode fixture --label pr
        env:
          EVAL_HYPERTASK_BIN: /tmp/hypertask

      - name: Run live clients against an isolated project
        if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
        env:
          EVAL_HYPERTASK_BIN: /tmp/hypertask
          EVAL_LIVE_CLIENTS: claude,cursor,codex
          EVAL_LIVE_WRITES: "1"
          EVAL_MEASURE_SURFACES: "1"
          EVAL_PROJECT_ID: ${{ secrets.EVAL_PROJECT_ID }}
          EVAL_REQUIRE_CLIENTS: claude,cursor,codex
        run: node evals/mcp-client/run.mjs --mode live --label weekly --require-clients claude,cursor,codex

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: mcp-client-eval-report
          path: src/lib/mcpClientEval/latest.json

  publish-eval-report:
    name: publish-eval-report
    needs: mcp-client-eval
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: actions/download-artifact@7a0c4c269abb142cd0f7adaa5bb6378ca1972986 # v4
        with:
          name: mcp-client-eval-report
          path: /tmp/mcp-client-eval

      - name: Publish latest.json to eval-reports
        run: |
          set -euo pipefail
          git fetch origin eval-reports:eval-reports || true
          if git show-ref --verify --quiet refs/heads/eval-reports; then
            git checkout eval-reports
          else
            git checkout --orphan eval-reports
            git rm -rf --quiet . || true
          fi
          cp /tmp/mcp-client-eval/latest.json latest.json
          git add latest.json
          if git diff --cached --quiet; then
            echo "No report change"
            exit 0
          fi
          git -c user.name="github-actions[bot]" -c user.email="41898282+github-actions[bot]@users.noreply.github.com" \
            commit -m "Publish MCP client eval report"
          git push origin HEAD:eval-reports
