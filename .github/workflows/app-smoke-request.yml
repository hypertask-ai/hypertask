name: App Smoke Request

on:
  workflow_dispatch:

concurrency:
  group: app-smoke-request-${{ github.run_id }}
  cancel-in-progress: true

permissions: {}

jobs:
  request:
    runs-on: ubuntu-latest
    timeout-minutes: 1
    steps:
      - name: Request the protected app-smoke workflow
        run: echo 'App smoke runs nightly on production (HTPR-9450).'
