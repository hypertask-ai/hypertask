name: App Smoke Request

on:
  pull_request:
    branches: [production]
    types: [opened, synchronize, reopened, ready_for_review]
  workflow_dispatch:

concurrency:
  group: app-smoke-request-${{ github.run_id }}
  cancel-in-progress: true

permissions: {}

jobs:
  request:
    runs-on: ubuntu-latest
    timeout-minutes: 1
    steps:
      - name: Request the protected app-smoke workflow
        run: echo 'App smoke moved to nightly (HTPR-9450).'
