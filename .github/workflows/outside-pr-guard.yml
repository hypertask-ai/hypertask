# pull_request_target is safe here: this workflow never checks out PR code.
# It runs only production code and reads PR metadata through the GitHub API.
name: Outside PR guard

on:
  workflow_dispatch:
    inputs:
      pr_number:
        description: PR number to inspect (dry run only)
        type: string
        required: false
      simulate_author:
        description: Author login to simulate instead of fetching a PR
        type: string
        required: false
      simulate_fork:
        description: Simulate a fork rather than a same-repo branch
        type: boolean
        default: false
        required: false

concurrency:
  group: outside-pr-guard-${{ github.event.pull_request.number || inputs.pr_number || inputs.simulate_author || github.run_id }}
  cancel-in-progress: false

permissions:
  pull-requests: write
  contents: read

jobs:
  outside-pr-guard:
    name: outside-pr-guard
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: production
          fetch-depth: 1
          persist-credentials: false
      - uses: actions/github-script@60a0d83039c74a4aee543508d2ffcb1c3799cdea # v7
        with:
          script: |
            await require('./.github/scripts/outside-pr-guard.cjs')({ github, context, core });
