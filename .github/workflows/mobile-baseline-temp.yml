name: Mobile design baseline refresh (temporary)
on:
  push:
    branches: [mobile-designer/htpr-9636-mobile-verification]
permissions: { contents: read }
concurrency: { group: mobile-baseline-temp, cancel-in-progress: true }
jobs:
  baseline:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        theme: [porcelain, graphite, amoled, dia]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with: { persist-credentials: false }
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with: { node-version: ^24.22.1, check-latest: true, cache: npm }
      - run: npm ci --no-audit --no-fund && npx prisma generate && bash .github/scripts/install-chromium.sh
        timeout-minutes: 20
      - env: { SMOKE_BASE_URL: 'https://app.hypertask.ai', SMOKE_POSTDEPLOY: '1', MOBILE_DESIGN_UPDATE: '1', MOBILE_DESIGN_THEMES: '${{ matrix.theme }}', MOBILE_DESIGN_BASELINE: 'mobile-design.baseline.${{ matrix.theme }}.json', QA_LOGIN_EMAIL: '${{ secrets.QA_LOGIN_EMAIL }}', QA_LOGIN_PASSWORD: '${{ secrets.QA_LOGIN_PASSWORD }}', SMOKE_BOARD_PATH: '/project?id=7049&surface=board', SMOKE_TASK_PATH: '/detail/project-7049/6283' }
        run: timeout 1800 npx playwright test -c e2e/smoke/playwright.config.mobile.ts --project=mobile-design
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with: { name: 'baseline-${{ matrix.theme }}', path: 'mobile-design.baseline.${{ matrix.theme }}.json', if-no-files-found: error, retention-days: 7 }
