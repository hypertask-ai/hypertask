name: Vercel security findings

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  findings:
    if: github.ref == 'refs/heads/production'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: "^24.22.1"
          check-latest: true
      - name: Read production finding states
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: node .github/scripts/vercel-security-findings.cjs
