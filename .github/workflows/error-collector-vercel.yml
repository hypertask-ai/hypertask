name: Vercel error feed

on:
  schedule:
    - cron: '7 * * * *'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  collect:
    if: github.ref == 'refs/heads/production'
    concurrency:
      group: vercel-error-feed
      cancel-in-progress: false
    runs-on: ubuntu-latest
    timeout-minutes: 14
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: ^24.22.1
          check-latest: true
      - name: Read production sources into an encrypted snapshot
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_TEAM_ID: team_yureFlJZ6ibwebaOOkKc5whs
          VERCEL_PROJECT_ID: prj_oEok2iMNFPzj6AWe1KQBaIAcPaAf
        run: node .claude/skills/ship/scripts/error-collector/vercel-snapshot.mjs
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: vercel-error-feed
          path: vercel-feed/feed.enc
          if-no-files-found: error
          retention-days: 2

  chain:
    needs: [collect]
    if: ${{ !cancelled() && github.ref == 'refs/heads/production' }}
    permissions:
      contents: read
      actions: write
    concurrency:
      group: vercel-error-feed-chain
      cancel-in-progress: false
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: production
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: ^24.22.1
          check-latest: true
      - name: Start the next fifteen-minute link
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: node .github/scripts/schedule-chain.cjs hand-off --workflow error-collector-vercel.yml --gap-minutes 15
