name: Visual Regression
run-name: ${{ inputs.journey || 'visual' }} @ ${{ inputs.head || github.head_ref || github.ref_name }}

# HYCI-10: pull-request comparisons moved to ci-tests.yml (job visual-compare) so the
# head reuses the one app build. This workflow keeps the production baseline capture
# and the on-demand verify-qa journeys, neither of which has a build to share.
on:
  push:
    branches: [production]
  schedule:
    - cron: '5 4 * * 1'
  workflow_dispatch:
    inputs:
      base:
        description: Base ref for temporary expected screenshots
        default: production
        required: true
        type: string
      head:
        description: Candidate ref to compare
        required: true
        type: string
      journey:
        description: Optional single pre-PR journey instead of visual comparison
        default: visual
        type: choice
        options: [visual, inbox-cycle, inbox-cycle-broken, hands-free-drives]

concurrency:
  group: ${{ (github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && inputs.journey == 'inbox-cycle' && inputs.head == 'production')) && 'feature-map-live-weekly' || (inputs.journey && inputs.journey != 'visual' && 'verify-qa' || format('visual-regression-{0}', github.event.pull_request.number || github.sha)) }}
  cancel-in-progress: ${{ github.event_name != 'schedule' && (!inputs.journey || inputs.journey == 'visual') && github.event_name != 'push' }}

jobs:
  visual-regression:
    name: visual-regression
    if: github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && (inputs.journey == '' || inputs.journey == 'visual'))
    runs-on: ubuntu-latest
    timeout-minutes: 35
    permissions:
      contents: read
      packages: read
    env:
      TZ: UTC
    services:
      postgres:
        image: ghcr.io/hypertask-ai/ci-postgres:16-bookworm@sha256:bb3e1a57e5407e0a5280b4211980a5e537f4abd234a87014ac979849a78dd825
        credentials:
          username: ${{ github.actor }}
          password: ${{ github.token }}
        env:
          POSTGRES_DB: hypertask_smoke
          POSTGRES_USER: browser_smoke
          POSTGRES_PASSWORD: browser_smoke
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U browser_smoke -d hypertask_smoke"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
      redis:
        image: ghcr.io/hypertask-ai/ci-redis:7-alpine@sha256:ff02b58f971e7d7d156a1267e283fcbbeee91773b6aa36c49dac28ecfe28eadf
        credentials:
          username: ${{ github.actor }}
          password: ${{ github.token }}
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    steps:
      - name: Checkout base
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.event.pull_request.base.sha || inputs.base || github.sha }}
          path: base
          persist-credentials: false
      - name: Checkout head
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          repository: ${{ github.event.pull_request.head.repo.full_name || github.repository }}
          ref: ${{ github.event.pull_request.head.sha || inputs.head || github.sha }}
          path: head
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: ^24.22.1
          check-latest: true
      - name: Restore browser font cache
        id: restore-browser-fonts
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: ~/.cache/hypertask-browser-fonts
          key: hypertask-browser-fonts-${{ runner.os }}-v2
      - name: Install pinned Chromium and fonts once
        run: |
          npm exec --yes --package=@playwright/test@1.64.0 -- playwright install chromium
          node head/.github/scripts/browser-font-cache.mjs
      # HYCI-106: GitHub rolls ubuntu-latest to a new image without warning, and two
      # images in one hour each missed the other's saved screens, rebuilding the base
      # app for 316-325 s plus 94-97 s of capture. The pixels are the same when the
      # fonts Chromium resolves and their fontconfig are the same, so those are the
      # identity, and an extra font the new image ships changes nothing.
      - name: Fingerprint the fonts that draw the screens
        id: fonts
        shell: bash
        run: node head/scripts/visual-font-fingerprint.mjs >> "$GITHUB_OUTPUT"
      - name: Identify exact baseline
        id: baseline
        shell: bash
        run: |
          set -eo pipefail
          files=$(git -C base ls-tree -r HEAD | awk -F'\t' '$2 !~ /^(docs|tests|\.github|\.claude)\//')
          if [ -z "$files" ]; then
            echo "::error::The base render source hashed to nothing, so no saved baseline can be proven to match it"
            exit 1
          fi
          echo "sha=$(git -C base rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          echo "head=$(git -C head rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          echo "render=$(printf '%s\n' "$files" | sha256sum | cut -c1-16)" >> "$GITHUB_OUTPUT"
      - name: Restore production baseline
        id: baseline-cache
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: ${{ runner.temp }}/visual-expected
          key: visual-base-v3-${{ runner.os }}-${{ runner.arch }}-${{ steps.fonts.outputs.fonts }}-${{ steps.baseline.outputs.render }}-${{ hashFiles('head/e2e/visual/**', 'head/scripts/seed-browser-smoke.mjs', 'head/scripts/premerge-local-search.mjs', 'head/scripts/visual-regression-ci.mjs', 'head/.github/workflows/visual-regression.yml') }}
      - name: Restore base Next.js build cache
        id: restore-base-nextjs-cache
        if: steps.baseline-cache.outputs.cache-hit != 'true'
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: .next/cache
          key: nextjs-${{ runner.os }}-${{ hashFiles('base/package-lock.json', 'base/next.config.*') }}-${{ steps.baseline.outputs.sha }}
          restore-keys: |
            nextjs-${{ runner.os }}-${{ hashFiles('base/package-lock.json', 'base/next.config.*') }}-
      - name: Stage base Next.js build cache
        if: steps.baseline-cache.outputs.cache-hit != 'true'
        shell: bash
        run: |
          if [ -d .next/cache ]; then
            mkdir -p base/.next
            mv .next/cache base/.next/cache
          fi
      - name: Restore head Next.js build cache
        id: restore-head-nextjs-cache
        if: github.event_name != 'push'
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: .next/cache
          key: nextjs-${{ runner.os }}-${{ hashFiles('head/package-lock.json', 'head/next.config.*') }}-${{ steps.baseline.outputs.head }}
          restore-keys: |
            nextjs-${{ runner.os }}-${{ hashFiles('head/package-lock.json', 'head/next.config.*') }}-
      - name: Stage head Next.js build cache
        if: github.event_name != 'push'
        shell: bash
        run: |
          if [ -d .next/cache ]; then
            mkdir -p head/.next
            mv .next/cache head/.next/cache
          fi
      - name: Prepare disposable local credentials
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          # Derived from the commit so one build serves every consumer.
          seed="${{ github.event.pull_request.head.sha || github.sha }}-smoke"
          session_secret=$(printf '%s' "$seed:session" | sha256sum | cut -d' ' -f1)
          jwt_secret=$(printf '%s' "$seed:jwt" | sha256sum | cut -d' ' -f1)
          better_auth_secret=$(printf '%s' "$seed:better-auth" | sha256sum | cut -d' ' -f1)
          printf '::add-mask::%s\n' "$session_secret"
          printf '::add-mask::%s\n' "$jwt_secret"
          printf '::add-mask::%s\n' "$better_auth_secret"
          {
            printf '%s\n' 'DATABASE_URL=postgresql://browser_smoke:browser_smoke@127.0.0.1:5432/hypertask_smoke'
            printf '%s\n' 'REDIS_URL=redis://127.0.0.1:6379'
            printf 'SESSION_SECRET=%s\n' "$session_secret"
            printf 'JWT_SECRET=%s\n' "$jwt_secret"
            printf 'BETTER_AUTH_SECRET=%s\n' "$better_auth_secret"
            printf '%s\n' 'BETTER_AUTH_URL=http://127.0.0.1:3100'
            printf '%s\n' 'NEXT_PUBLIC_BASEURL=http://127.0.0.1:3100'
            printf '%s\n' 'TURBOPUFFER_BASE_URL=http://127.0.0.1:53101'
            printf '%s\n' 'TURBOPUFFER_API_KEY=disposable-fixture'
            printf '%s\n' 'HT_PREMERGE_AI_STUB=1'
            printf '%s\n' 'HT_PREMERGE_QUEUE_STUB=1'
            printf '%s\n' 'FLAG_PROCESS_CACHE_MS=0'
            printf '%s\n' 'QSTASH_CALLBACK_BASE_URL=http://127.0.0.1:3100'
            printf '%s\n' 'QSTASH_AUTO_REGISTER_SWEEP=false'
            printf '%s\n' 'NEXT_PUBLIC_PUSHER_KEY=app-key'
            printf '%s\n' 'NEXT_PUBLIC_PUSHER_HOST=127.0.0.1'
            printf '%s\n' 'NEXT_PUBLIC_PUSHER_PORT=6001'
            printf '%s\n' 'NEXT_PUBLIC_PUSHER_USE_TLS=false'
            printf '%s\n' 'NEXT_PUBLIC_PUSHER_CLUSTER=mt1'
            printf '%s\n' 'PUSHER_APP_ID=app-id'
            printf '%s\n' 'PUSHER_KEY=app-key'
            printf '%s\n' 'PUSHER_SECRET=app-secret'
            printf '%s\n' 'PUSHER_HOST=127.0.0.1'
            printf '%s\n' 'PUSHER_PORT=6001'
            printf '%s\n' 'PUSHER_USE_TLS=false'
            printf '%s\n' 'PUSHER_CLUSTER=mt1'
          } >> "$GITHUB_ENV"
      - name: Build and capture base, then compare head
        env:
          VISUAL_BASE_CACHE_HIT: ${{ steps.baseline-cache.outputs.cache-hit }}
          VISUAL_BASE_ONLY: ${{ github.event_name == 'push' }}
        run: node head/scripts/visual-regression-ci.mjs
      - name: Save successful visual baseline
        if: success() && steps.baseline-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: ${{ runner.temp }}/visual-expected
          key: ${{ steps.baseline-cache.outputs.cache-primary-key }}
      # HYCI-82: the cache holds a 2 MB baseline beside 9 GB of build caches, so the
      # oldest entries are evicted first: eight of the twelve production baselines
      # captured on 2026-11-01 to 2026-11-02 were already gone when a PR asked for
      # them. visual-compare then rebuilt the base app, 333 s of a 513 s step, and
      # the push finished at 13-17 minutes. The same ten validated screenshots are
      # also published as an artifact, which is not part of the cache budget.
      - name: Publish the validated baseline
        if: github.event_name == 'push' && steps.baseline-cache.outputs.cache-hit != 'true'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: visual-baseline-${{ steps.fonts.outputs.fonts }}-${{ steps.baseline.outputs.render }}-${{ hashFiles('head/e2e/visual/**', 'head/scripts/seed-browser-smoke.mjs', 'head/scripts/premerge-local-search.mjs', 'head/scripts/visual-regression-ci.mjs', 'head/.github/workflows/visual-regression.yml') }}
          path: ${{ runner.temp }}/visual-expected
          if-no-files-found: error
      - name: Summarize failed screens
        if: always() && hashFiles('head/scripts/visual-regression-ci.mjs') != ''
        env:
          VISUAL_BASE_CACHE_HIT: ${{ steps.baseline-cache.outputs.cache-hit }}
          VISUAL_BASE_ONLY: ${{ github.event_name == 'push' }}
        run: node head/scripts/visual-regression-ci.mjs --summary
      - name: Upload visual differences
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: visual-regression-diffs
          path: |
            test-results/**/*.png
            test-results/**/error-context.md
            test-results/**/trace.zip
          if-no-files-found: ignore
          retention-days: 7

  verify-qa:
    name: verify-qa
    if: >-
      (github.event_name == 'workflow_dispatch' && inputs.journey != '' && inputs.journey != 'visual')
      || github.event_name == 'schedule'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      contents: read
      packages: read
    env:
      VERIFY_QA_JOURNEY: ${{ github.event_name == 'schedule' && 'inbox-cycle' || inputs.journey }}
    services:
      postgres:
        image: ghcr.io/hypertask-ai/ci-postgres:16-bookworm@sha256:bb3e1a57e5407e0a5280b4211980a5e537f4abd234a87014ac979849a78dd825
        credentials:
          username: ${{ github.actor }}
          password: ${{ github.token }}
        env:
          POSTGRES_DB: hypertask_smoke
          POSTGRES_USER: browser_smoke
          POSTGRES_PASSWORD: browser_smoke
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U browser_smoke -d hypertask_smoke"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
      redis:
        image: ghcr.io/hypertask-ai/ci-redis:7-alpine@sha256:ff02b58f971e7d7d156a1267e283fcbbeee91773b6aa36c49dac28ecfe28eadf
        credentials:
          username: ${{ github.actor }}
          password: ${{ github.token }}
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
      soketi:
        image: ghcr.io/hypertask-ai/ci-soketi:1.6-16-alpine@sha256:5e45fe1adbf2d4ef8022d0126a3c7e4371b7b08f35784b76a2dc353954ee885c
        credentials:
          username: ${{ github.actor }}
          password: ${{ github.token }}
        env:
          SOKETI_DEFAULT_APP_ID: app-id
          SOKETI_DEFAULT_APP_KEY: app-key
          SOKETI_DEFAULT_APP_SECRET: app-secret
        ports:
          - 6001:6001
        options: >-
          --health-cmd "wget --no-verbose --tries=1 --spider http://127.0.0.1:6001"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.event_name == 'schedule' && 'production' || inputs.head }}
          persist-credentials: false
      - name: Initialize evidence
        run: mkdir -p verify-qa
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: ^24.22.1
          check-latest: true
          cache: npm
      - name: Test verification helpers
        if: github.event_name != 'schedule'
        run: node --test tests/verify-qa.test.cjs tests/verify-qa-premerge.test.cjs
      - name: Install dependencies and Chromium
        run: |
          set -o pipefail
          npm ci --prefer-offline --no-audit --no-fund 2>&1 | tee verify-qa/install.log
          npx prisma generate
          npx playwright install chromium
          node .github/scripts/browser-font-cache.mjs
      - name: Prepare disposable local credentials
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          # Derived from the commit so one build serves every consumer.
          seed="${{ github.event.pull_request.head.sha || github.sha }}-smoke"
          session_secret=$(printf '%s' "$seed:session" | sha256sum | cut -d' ' -f1)
          jwt_secret=$(printf '%s' "$seed:jwt" | sha256sum | cut -d' ' -f1)
          better_auth_secret=$(printf '%s' "$seed:better-auth" | sha256sum | cut -d' ' -f1)
          printf '::add-mask::%s\n' "$session_secret"
          printf '::add-mask::%s\n' "$jwt_secret"
          printf '::add-mask::%s\n' "$better_auth_secret"
          {
            printf '%s\n' 'DATABASE_URL=postgresql://browser_smoke:browser_smoke@127.0.0.1:5432/hypertask_smoke'
            printf '%s\n' 'REDIS_URL=redis://127.0.0.1:6379'
            printf 'SESSION_SECRET=%s\n' "$session_secret"
            printf 'JWT_SECRET=%s\n' "$jwt_secret"
            printf 'BETTER_AUTH_SECRET=%s\n' "$better_auth_secret"
            printf '%s\n' 'BETTER_AUTH_URL=http://127.0.0.1:3100'
            printf '%s\n' 'NEXT_PUBLIC_BASEURL=http://127.0.0.1:3100'
            printf '%s\n' 'TURBOPUFFER_BASE_URL=http://127.0.0.1:53101'
            printf '%s\n' 'TURBOPUFFER_API_KEY=disposable-fixture'
            printf '%s\n' 'HT_PREMERGE_AI_STUB=1'
            printf '%s\n' 'HT_PREMERGE_QUEUE_STUB=1'
            printf '%s\n' 'FLAG_PROCESS_CACHE_MS=0'
            printf '%s\n' 'QSTASH_CALLBACK_BASE_URL=http://127.0.0.1:3100'
            printf '%s\n' 'QSTASH_AUTO_REGISTER_SWEEP=false'
            printf '%s\n' 'NEXT_PUBLIC_PUSHER_KEY=app-key'
            printf '%s\n' 'NEXT_PUBLIC_PUSHER_HOST=127.0.0.1'
            printf '%s\n' 'NEXT_PUBLIC_PUSHER_PORT=6001'
            printf '%s\n' 'NEXT_PUBLIC_PUSHER_USE_TLS=false'
            printf '%s\n' 'NEXT_PUBLIC_PUSHER_CLUSTER=mt1'
            printf '%s\n' 'PUSHER_APP_ID=app-id'
            printf '%s\n' 'PUSHER_KEY=app-key'
            printf '%s\n' 'PUSHER_SECRET=app-secret'
            printf '%s\n' 'PUSHER_HOST=127.0.0.1'
            printf '%s\n' 'PUSHER_PORT=6001'
            printf '%s\n' 'PUSHER_USE_TLS=false'
            printf '%s\n' 'PUSHER_CLUSTER=mt1'
          } >> "$GITHUB_ENV"
      - name: Seed disposable fixtures
        env:
          BROWSER_SMOKE_STATE_FILE: e2e/smoke/.state/smoke-state.json
        run: |
          set -o pipefail
          { npx prisma migrate deploy && node scripts/seed-browser-smoke.mjs && node scripts/seed-browser-smoke.mjs --inbox-cycle; } 2>&1 | tee verify-qa/seed.log
      - name: Build once
        env:
          NEXT_TELEMETRY_DISABLED: '1'
          NODE_OPTIONS: --max-old-space-size=5120
        run: |
          set -o pipefail
          for attempt in 1 2; do
            npx next build 2>&1 | tee "verify-qa/build-${attempt}.log" && exit 0
            grep -qE 'An error occurred in `next/font`|next/font` error:|@next/font/dist/google/loader\.js' "verify-qa/build-${attempt}.log" || exit 1
          done
          exit 1
      - name: Launch, doctor, drive, and tear down
        env:
          VERIFY_QA_BASE: http://127.0.0.1:3100
          VERIFY_QA_STATE_FILE: e2e/smoke/.state/smoke-state.json
          VERIFY_QA_FIXTURE: e2e/smoke/.state/inbox-cycle-fixture.json
          VERIFY_QA_REPORT_ONLY: '0'
          PREMERGE_LOCAL: '1'
        run: |
          set -euo pipefail
          node scripts/premerge-local-search.mjs e2e/smoke/.state/card-fixture.json 53101 > verify-qa/search.log 2>&1 &
          search=$!
          npx next start -H 127.0.0.1 -p 3100 > verify-qa/server.log 2>&1 &
          server=$!
          trap 'kill "$server" "$search" 2>/dev/null || true' EXIT
          timeout --signal=TERM --kill-after=20s 900s node scripts/verify-qa-run.mjs 2>&1 | tee verify-qa/journey.log
      - name: Summarize and sanitize evidence
        if: always()
        env:
          VERIFY_QA_JOB_STATUS: ${{ job.status }}
          VERIFY_QA_STATE_FILE: e2e/smoke/.state/smoke-state.json
        run: node scripts/verify-qa-run.mjs --summary
      - name: Upload verification evidence
        if: always()
        id: evidence
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: verify-qa-${{ github.run_id }}-${{ github.run_attempt }}
          path: verify-qa/
          if-no-files-found: error
          retention-days: 7
      - name: Link evidence
        if: always() && steps.evidence.outputs.artifact-url != ''
        env:
          ARTIFACT_URL: ${{ steps.evidence.outputs.artifact-url }}
        run: |
          printf '\nEvidence artifact: %s\n' "$ARTIFACT_URL" >> "$GITHUB_STEP_SUMMARY"
      - name: File fleet-board weekly result
        if: >-
          always() && (
            github.event_name == 'schedule'
            || (github.event_name == 'workflow_dispatch' && inputs.journey == 'inbox-cycle' && inputs.head == 'production')
          )
        env:
          HYPERTASK_MCP_TOKEN: ${{ secrets.HYPERTASK_FLEET_BOARD_MCP_TOKEN }}
          FEATURE_MAP_LIVE_ARTIFACT_URL: ${{ steps.evidence.outputs.artifact-url }}
        run: node .github/scripts/feature-map-live-weekly-file.mjs
