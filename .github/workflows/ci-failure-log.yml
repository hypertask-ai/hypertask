name: CI Failure Log

# One line per red agent change, grouped by cause every three days (HYCI-17).
# The append job never fixes anything: it records the failing step, the first
# error and the run link on the `ci-failure-log` branch. The filing job reads
# that single log, groups the lines by cause with the existing census parser,
# and files one HYCI ticket per cause with two or more lines, or comments on
# the ticket that already carries that cause in its title.

on:
  workflow_run:
    workflows: ["CI Tests"]
    types: [completed]
  schedule:
    - cron: "23 5 */3 * *"
  workflow_dispatch:

permissions:
  contents: write
  actions: read

concurrency:
  group: ci-failure-log
  queue: max
  cancel-in-progress: false

jobs:
  log:
    name: log
    if: >-
      github.event_name == 'workflow_run' &&
      github.event.workflow_run.event == 'pull_request' &&
      github.event.workflow_run.head_branch != 'production' &&
      github.event.workflow_run.conclusion != 'success' &&
      github.event.workflow_run.conclusion != 'cancelled'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: production
          persist-credentials: false

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: ^24.22.1
          check-latest: true

      - name: Install
        run: npm ci --ignore-scripts --no-audit --no-fund

      - name: Append one line to the log
        env:
          GH_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: node scripts/ci-failure-log.mjs --append --run "${{ github.event.workflow_run.id }}" --publish

  file:
    name: file
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: production
          persist-credentials: false

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: ^24.22.1
          check-latest: true

      - name: Install
        run: npm ci --ignore-scripts --no-audit --no-fund

      - name: Group the log by cause and file the missing tickets
        env:
          GH_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          HYPERTASK_MCP_TOKEN: ${{ secrets.HYPERTASK_MCP_TOKEN }}
        run: node scripts/ci-failure-log.mjs --file --from-branch
