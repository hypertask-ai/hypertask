name: Vercel runtime log

on:
  workflow_dispatch:
    inputs:
      ticket:
        description: Hypertask ticket unique index that receives the log
        required: true
      project:
        description: Hypertask project id that ticket lives on
        required: false
        default: "15"
      since:
        description: How far back to read (30s, 10m, 2h, 1d) or an ISO time
        required: false
        default: "30m"
      level:
        description: error, warn, info, or empty for every level
        required: false
        default: ""
      path:
        description: Exact request route, for example /api/cron/saved-view-columns
        required: false
        default: ""
      search:
        description: Only lines whose message contains this text
        required: false
        default: ""
      limit:
        description: Lines to keep, 1 to 500
        required: false
        default: "50"

permissions:
  contents: read

env:
  PROJECT_ID: prj_oEok2iMNFPzj6AWe1KQBaIAcPaAf
  TEAM_ID: team_yureFlJZ6ibwebaOOkKc5whs

jobs:
  log:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Read runtime logs and post them to the ticket
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          MCP_TOKEN: ${{ secrets.HYPERTASK_MCP_TOKEN }}
          TICKET: ${{ inputs.ticket }}
          BOARD: ${{ inputs.project }}
          SINCE: ${{ inputs.since }}
          LEVEL: ${{ inputs.level }}
          ROUTE: ${{ inputs.path }}
          SEARCH: ${{ inputs.search }}
          LIMIT: ${{ inputs.limit }}
        run: |
          set -euo pipefail
          [[ "$TICKET" =~ ^[0-9]{1,7}$ ]] || { echo "ticket must be a ticket's unique index"; exit 1; }
          [[ "$BOARD" =~ ^[0-9]{1,7}$ ]] || { echo "project must be a project id"; exit 1; }
          [[ "$LIMIT" =~ ^[0-9]{1,3}$ ]] && [ "$LIMIT" -ge 1 ] && [ "$LIMIT" -le 500 ] || { echo "limit must be 1 to 500"; exit 1; }
          [[ -z "$LEVEL" || "$LEVEL" =~ ^(error|warn|info)$ ]] || { echo "level must be error, warn, info or empty"; exit 1; }
          [[ -z "$ROUTE" || "$ROUTE" =~ ^/[A-Za-z0-9._/-]{0,200}$ ]] || { echo "path must be a plain route like /api/ai/chat/stream"; exit 1; }
          [ "${#SEARCH}" -le 200 ] || { echo "search must be 200 characters or fewer"; exit 1; }

          now=$(date -u +%s)
          if [[ "$SINCE" =~ ^([0-9]{1,4})([smhd])$ ]]; then
            case "${BASH_REMATCH[2]}" in
              s) unit=1 ;;
              m) unit=60 ;;
              h) unit=3600 ;;
              d) unit=86400 ;;
            esac
            start=$((now - BASH_REMATCH[1] * unit))
          else
            [[ "$SINCE" =~ ^[0-9]{4}-[0-9]{2}-[0-9]{2}T[0-9:.]+Z$ ]] || { echo "since must be 10m, 2h, 1d or an ISO time"; exit 1; }
            start=$(date -u -d "$SINCE" +%s)
          fi
          [ "$start" -lt "$now" ] || { echo "since must be in the past"; exit 1; }

          page=$([ -n "$SEARCH" ] && echo 500 || echo "$LIMIT")
          filter="environment:production"
          [ -z "$LEVEL" ] || filter="$filter AND level:$LEVEL"
          [ -z "$ROUTE" ] || filter="$filter AND requestPath:\"$ROUTE\""

          REQUEST=$(jq -n \
            --arg team "$TEAM_ID" --arg project "$PROJECT_ID" --arg filter "$filter" \
            --arg start "$(date -u -d "@$start" +%Y-%m-%dT%H:%M:%S.000Z)" \
            --arg end "$(date -u -d "@$now" +%Y-%m-%dT%H:%M:%S.000Z)" \
            --argjson page "$page" \
            '{event: "vercel.log",
              scope: {ownerId: $team, projectIds: [$project]},
              select: ["level", "requestMethod", "requestPath", "deploymentId", "message"],
              order: "desc",
              limit: $page,
              filter: $filter,
              timeRange: {start: $start, end: $end}}')

          request_target="https://api.vercel.com/v1/observability/events?teamId=$TEAM_ID"
          code=$(curl -sS -o /tmp/events.json -w "%{http_code}" -X POST "$request_target" \
            -H "Authorization: Bearer $VERCEL_TOKEN" \
            -H "Content-Type: application/json" \
            -H "x-vercel-observability-query-reason: cli/logs-runtime" \
            -d "$REQUEST")
          echo "observability query: HTTP $code"
          if [ "$code" != 200 ]; then
            if grep -qi '<html' /tmp/events.json; then echo "body: html challenge page"; else echo "body: not html"; fi
            exit 1
          fi

          jq -r --arg s "$SEARCH" --argjson n "$LIMIT" '
            [(.events // [])[]
              | select($s == "" or ((.message // "") | contains($s)))]
            | .[0:$n][]
            | "\(.timestamp // "") \(.level // "") \(.requestMethod // "") \(.requestPath // "") \(.deploymentId // "") \(.message // "")"
          ' /tmp/events.json > /tmp/lines.txt

          EVENTS=$(tail -100 /tmp/lines.txt \
            | sed -E -e 's#[a-z]+://[^[:space:]]*@[^[:space:]]+#<url-with-credentials>#g' \
                     -e 's#(token|secret|password|api[_-]?key|authorization)([=: ]+)[^[:space:]]+#\1\2<redacted>#Ig')
          echo "fetched $(wc -l < /tmp/lines.txt) lines, posting up to $(printf '%s\n' "$EVENTS" | wc -l)"

          BODY_JQ=$(cat <<'JQ'
            ($ev | split("\n") | map(select(length > 0)) | reverse) as $rev
            | ("<p><strong>Production runtime log</strong> (vercel-runtime-log workflow, newest first).</p>"
               + "<p>" + ($meta | @html) + "</p>") as $head
            | ([$rev[] | (if length > 400 then .[0:400] + " [...]" else . end) | @html]) as $lines
            | (5000 - ($head | length) - 11 - 120) as $budget
            | reduce $lines[] as $line
                ({kept: [], used: 0, full: false};
                 if .full then .
                 elif (.used + ($line | length) + 1) <= $budget
                   then {kept: ([$line] + .kept), used: (.used + ($line | length) + 1), full: false}
                   else {kept: .kept, used: .used, full: true}
                 end)
            | {unique_index: ($t | tonumber), project_id: ($p | tonumber), content_type: "html",
               text: ($head + "<pre>" + (.kept | join("\n")) + "</pre>"
                      + (if (.kept | length) < ($lines | length)
                         then "<p>Earlier lines were dropped to fit the 5000-character comment limit.</p>"
                         else "" end))}
          JQ
          )
          WINDOW="$SINCE$([ -z "$LEVEL" ] || printf ', level %s' "$LEVEL")$([ -z "$ROUTE" ] || printf ', route %s' "$ROUTE")$([ -z "$SEARCH" ] || printf ', search %s' "$SEARCH")"
          BODY=$(jq -n --arg meta "Read at $(date -u +%Y-%m-%dT%H:%M:%SZ). Window $WINDOW." \
            --arg ev "$EVENTS" --arg t "$TICKET" --arg p "$BOARD" "$BODY_JQ")
          code=$(curl -s -o /tmp/post.out -w "%{http_code}" -X POST "https://app.hypertask.ai/api/mcp/comments" \
            -H "Authorization: Bearer $MCP_TOKEN" -H "Content-Type: application/json" -d "$BODY")
          echo "comment post: HTTP $code"
          case "$code" in
            200|201|202) echo "posted to ticket $BOARD/$TICKET" ;;
            *) head -c 300 /tmp/post.out; echo; exit 1 ;;
          esac
