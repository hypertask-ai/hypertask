name: PR Guards Trusted

on:
  pull_request_target:
    types: [opened, synchronize, reopened, edited, ready_for_review]
  workflow_run:
    workflows: [PR Guards]
    types: [completed]

permissions:
  contents: read
  pull-requests: write
  statuses: write

concurrency:
  group: pr-guards-trusted-${{ github.event.pull_request.number || format('scan-{0}', github.event.workflow_run.id) }}
  cancel-in-progress: true

jobs:
  pr-guards-trusted:
    if: github.event_name == 'pull_request_target'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: production
          fetch-depth: 1
          persist-credentials: false
      - name: Mark original guard contexts pending
        if: ${{ !cancelled() }}
        uses: actions/github-script@60a0d83039c74a4aee543508d2ffcb1c3799cdea # v7
        with:
          script: |
            const eventPr = context.payload.pull_request;
            for (const name of ["outside-pr-guard", "pr-size", "pr-title"]) {
              if (eventPr.base.ref !== 'production' && name !== 'outside-pr-guard') continue;
              const { data: current } = await github.rest.pulls.get({
                ...context.repo, pull_number: eventPr.number,
              });
              if (current.head.sha !== eventPr.head.sha ||
                  (name === 'pr-title' && current.title !== eventPr.title)) continue;
              await github.rest.repos.createCommitStatus({
                ...context.repo, sha: eventPr.head.sha,
                context: name, state: 'pending', description: `${name} is evaluating this pull request`,
              });
            }
      - uses: actions/github-script@60a0d83039c74a4aee543508d2ffcb1c3799cdea # v7
        id: outside
        if: ${{ !cancelled() }}
        with:
          script: |
            await require('./.github/scripts/outside-pr-guard.cjs')({ github, context, core });
      - uses: actions/github-script@60a0d83039c74a4aee543508d2ffcb1c3799cdea # v7
        id: size
        if: ${{ !cancelled() && github.event.pull_request.base.ref == 'production' }}
        with:
          script: |
            const marker = '<!-- pr-size-warning -->';
            const cap = 400;
            const botLogin = 'github-actions[bot]';

            async function run() {
              const prNumber = context.payload.pull_request?.number;
              if (!prNumber) {
                core.info('No pull_request payload; skipping pr-size check.');
                return;
              }

              // Fetch fresh from the API rather than trust the webhook payload.
              const { data: pr } = await github.rest.pulls.get({
                ...context.repo,
                pull_number: prNumber,
              });

              core.setOutput('sha', pr.head.sha);

              // This repo has no fork contributors; skip explicitly and visibly rather
              // than silently commenting on a fork PR we don't intend to support.
              if (pr.head.repo.full_name !== `${context.repo.owner}/${context.repo.repo}`) {
                core.info(`PR #${pr.number} is from a fork (${pr.head.repo.full_name}); skipping pr-size comment.`);
                return;
              }

              const total = (pr.additions || 0) + (pr.deletions || 0);
              const over = total > cap;

              let body;
              if (over) {
                body = `${marker}\n\n:warning: **PR size warning** — this PR is **${total}** changed lines (additions + deletions), over the ~${cap}-line cap in AGENTS.md. Consider splitting it into a stack of small PRs: each builds green and is safe to merge alone, landed in order. The cap is advisory — this comment never blocks merging.`;
              } else {
                body = `${marker}\n\n:white_check_mark: This PR is now **${total}** changed lines (additions + deletions), within the ~${cap}-line cap in AGENTS.md.`;
              }

              const comments = await github.paginate(github.rest.issues.listComments, {
                ...context.repo,
                issue_number: pr.number,
              });
              const existing = comments.find((c) => c.user?.login === botLogin && (c.body || '').includes(marker));

              if (over) {
                if (existing) {
                  if (existing.body !== body) {
                    await github.rest.issues.updateComment({
                      ...context.repo,
                      comment_id: existing.id,
                      body,
                    });
                    core.info(`Updated size comment for PR #${pr.number}.`);
                  } else {
                    core.info(`Size comment for PR #${pr.number} is already up to date.`);
                  }
                } else {
                  await github.rest.issues.createComment({
                    ...context.repo,
                    issue_number: pr.number,
                    body,
                  });
                  core.info(`Created size comment for PR #${pr.number}.`);
                }
              } else if (existing) {
                await github.rest.issues.updateComment({
                  ...context.repo,
                  comment_id: existing.id,
                  body,
                });
                core.info(`Updated size comment to within-cap for PR #${pr.number}.`);
              } else {
                core.info(`PR #${pr.number} is within the cap and has no size comment; nothing to do.`);
              }
            }

            try {
              await run();
            } catch (err) {
              core.warning(`pr-size check failed but will not block the PR: ${err.message}`);
            }

  # Every pull request is authored by the same GitHub account, so the title
  # carries the source ticket and kind of work. The rule lived only in the
  # agent prompt, where an agent with no tag configured never saw it, and three
  # PRs drifted before anyone noticed. This fails the merge instead of trusting
  # each agent to remember.
      - uses: actions/github-script@60a0d83039c74a4aee543508d2ffcb1c3799cdea # v7
        id: title
        if: ${{ !cancelled() && github.event.pull_request.base.ref == 'production' }}
        env:
          HYPERTASK_MCP_TOKEN: ${{ secrets.HYPERTASK_MCP_TOKEN }}
        with:
          script: |
            // YPER4 = Hypertask Infra board (project 4060): plumbing work
            // (agent farm, CI, deploy safety) lives there, not on board 15,
            // so its ticket ids need the same shape rule as HTPR/HYFA
            // (Valentin, 2026-09-27 infra-board rule; supervisor decision,
            // 2026-09-29, on YPER4-17).
            const PREFIXES = ['HTPR', 'HYFA', 'YPER4'];
            const TAGS = [
              'BUGFIX', 'FEATURE', 'IMPROVE', 'CLI/MCP/AI', 'SPEED', 'FEEDBACK',
              'DASH', 'QA', 'BOARD', 'COST', 'PLAN', 'INFRA', 'REFACTOR',
            ];
            const shape = new RegExp(
              '^(?:' + PREFIXES.join('|') + ')-\\d+ \\[(' +
              TAGS.map(t => t.replace(/[/]/g, '\\/')).join('|') +
              ')\\] \\S'
            );

            const prNumber = context.payload.pull_request?.number;
            if (!prNumber) {
              core.info('No pull_request payload; skipping title check.');
              return;
            }

            // Read from the API, not the webhook payload: an edited title
            // arrives stale on a re-run and would fail a PR that is now correct.
            const { data: pr } = await github.rest.pulls.get({
              ...context.repo,
              pull_number: prNumber,
            });

            core.setOutput('sha', pr.head.sha);
            core.setOutput('title', pr.title);

            if (pr.user.login.endsWith('[bot]')) {
              core.info(`Skipping ${pr.user.login}: bots do not follow the agent title rule.`);
              return;
            }

            // Auto-revert PRs carry GitHub's generated title. A rollback is
            // time-critical and must not stall on the agent title rule.
            if (/^Revert "/.test(pr.title)) {
              core.info(`Skipping revert PR title: ${pr.title}`);
              return;
            }

            if (shape.test(pr.title)) {
              const repository = `${context.repo.owner}/${context.repo.repo}`;
              if (pr.base.ref !== 'production' ||
                  pr.base.repo?.full_name !== repository || pr.head.repo?.full_name !== repository) {
                core.info('Skipping ticket binding outside a same-repository production PR.');
                return;
              }
              const token = process.env.HYPERTASK_MCP_TOKEN;
              if (!token) throw new Error('HYPERTASK_MCP_TOKEN is missing; ticket binding cannot run.');
              const ticket = pr.title.split(' ')[0];
              const url = `https://github.com/${repository}/pull/${pr.number}`;
              const response = await fetch('https://app.hypertask.ai/api/mcp/tasks/update', {
                method: 'POST',
                redirect: 'error',
                signal: AbortSignal.timeout(30_000),
                headers: { Authorization: `Bearer ${token}`, 'Content-Type': 'application/json' },
                body: JSON.stringify({ ticket_number: ticket, pull_request_url: url }),
              });
              if (!response.ok) throw new Error(`Ticket binding returned HTTP ${response.status}`);
              const result = await response.json();
              if (result.success !== true || result.tasks?.length !== 1 ||
                  result.tasks[0].ticketNumber !== ticket ||
                  !result.tasks[0].pullRequests?.some(link => link.url === url)) {
                throw new Error('Ticket binding was not confirmed by the app.');
              }
              core.info(`Title OK: ${pr.title}; linked ${ticket} to ${url}`);
              return;
            }

            core.setFailed(
              [
                `Pull request title does not match the required shape.`,
                ``,
                `  got:      ${pr.title}`,
                `  expected: (HTPR|HYFA|YPER4)-<n> [TAG] <summary>`,
                ``,
                `Valid tags: ${TAGS.join(', ')}`,
                ``,
                `Example: HTPR-5626 [INFRA] Move every job off GitHub-hosted runners`,
                `         HYFA-43 [INFRA] Add Factory acceptance routes`,
                `         YPER4-17 [INFRA] Step 4: rules enforced in code`,
                ``,
                `Edit the title and this check re-runs on its own.`,
              ].join('\n')
            );
      - name: Publish original guard contexts
        if: ${{ !cancelled() }}
        uses: actions/github-script@60a0d83039c74a4aee543508d2ffcb1c3799cdea # v7
        env:
          RESULTS: ${{ toJSON(steps) }}
        with:
          script: |
            const results = JSON.parse(process.env.RESULTS);
            const eventPr = context.payload.pull_request;
            const guards = [["outside-pr-guard", "outside"], ["pr-size", "size"], ["pr-title", "title"]];
            let failed = false;
            for (const [name, id] of guards) {
              if (eventPr.base.ref !== 'production' && id !== 'outside') continue;
              const result = results[id];
              const sha = result?.outputs?.sha || eventPr.head.sha;
              const title = result?.outputs?.title ?? eventPr.title;
              const { data: current } = await github.rest.pulls.get({
                ...context.repo, pull_number: eventPr.number,
              });
              if (current.head.sha !== eventPr.head.sha || current.head.sha !== sha ||
                  (id === 'title' && current.title !== title)) {
                core.info(`Skipping stale ${name} verdict; a newer run owns it.`);
                continue;
              }
              const passed = result?.outcome === 'success' && Boolean(result.outputs?.sha);
              failed ||= !passed;
              await github.rest.repos.createCommitStatus({
                ...context.repo, sha,
                context: name, state: passed ? 'success' : 'failure',
                description: passed ? `${name} passed` : `${name} failed or did not run`,
                target_url: `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`,
              });
            }
            if (failed) core.setFailed('One or more guards failed.');

  scan-completion:
    if: >-
      github.event_name == 'workflow_run' &&
      github.event.workflow_run.event == 'pull_request' &&
      (github.event.workflow_run.actor.login == 'dependabot[bot]' ||
       startsWith(github.event.workflow_run.head_branch, 'dependabot/') ||
       github.event.workflow_run.head_repository.full_name != github.repository)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      actions: read
      pull-requests: read
      statuses: write
    steps:
      - name: Publish original guard contexts
        if: ${{ !cancelled() }}
        uses: actions/github-script@60a0d83039c74a4aee543508d2ffcb1c3799cdea # v7
        with:
          script: |
            const run = context.payload.workflow_run;
            const sha = run.head_sha;
            const jobs = await github.paginate(github.rest.actions.listJobsForWorkflowRun, {
              ...context.repo, run_id: run.id, filter: 'latest', per_page: 100,
            });
            const job = jobs.find(job => job.name === 'pr-guards');
            const outcome = name => job?.steps?.find(step => step.name === name)?.conclusion;
            const results = {
              gitleaks: { outcome: outcome('Run gitleaks') },
              trufflehog: { outcome: outcome('Run trufflehog') },
              'public-secrets': { outcome: outcome('Fail on NEXT_PUBLIC_ secret-named vars') },
            };
            let pullNumber = run.pull_requests?.[0]?.number;
            if (!pullNumber) {
              const pulls = await github.paginate(github.rest.repos.listPullRequestsAssociatedWithCommit, {
                ...context.repo, commit_sha: sha, per_page: 100,
              });
              pullNumber = pulls.find(pr => pr.state === 'open' && pr.base.ref === 'production' && pr.head.sha === sha)?.number;
            }
            if (!pullNumber) return;
            const guards = [["secret-scan", "gitleaks"], ["next-public-secrets", "public-secrets"]];
            let failed = false;
            for (const [name, id] of guards) {
              const { data: current } = await github.rest.pulls.get({
                ...context.repo, pull_number: pullNumber,
              });
              if (current.state !== 'open' || current.base.ref !== 'production' || current.head.sha !== sha) continue;
              const passed = results[id]?.outcome === 'success' &&
                (name !== 'secret-scan' || results.trufflehog?.outcome === 'success');
              failed ||= !passed;
              await github.rest.repos.createCommitStatus({
                ...context.repo, sha,
                context: name, state: passed ? 'success' : 'failure',
                description: passed ? `${name} passed` : `${name} failed or did not run`,
                target_url: `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${run.id}`,
              });
            }
            if (failed) core.setFailed('One or more guards failed.');
