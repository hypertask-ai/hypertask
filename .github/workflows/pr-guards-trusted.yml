name: PR Guards Trusted

on:
  pull_request_target:
    types: [opened, synchronize, reopened, edited, ready_for_review, labeled, unlabeled]
  workflow_dispatch:
    inputs:
      pr_number:
        description: Same-repository PR to link to its title ticket
        required: true
        type: string

permissions:
  contents: read
  pull-requests: write
  statuses: write

concurrency:
  # One run per pull request: a newer event cancels the older run before it can
  # publish a status from labels it read earlier.
  group: pr-guards-trusted-${{ github.event_name }}-${{ github.event.pull_request.number || inputs.pr_number }}
  cancel-in-progress: true

jobs:
  pr-guards-trusted:
    if: github.event_name == 'pull_request_target'
    runs-on: ubuntu-latest
    timeout-minutes: 65
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: production
          fetch-depth: 1
          persist-credentials: false
      - name: Install the trusted workflow parser
        run: npm ci --prefix .github/scripts/node-version-guard --ignore-scripts --no-audit --no-fund
      - name: Mark title recheck pending
        if: ${{ !cancelled() && github.event.pull_request.base.ref == 'production' }}
        uses: actions/github-script@60a0d83039c74a4aee543508d2ffcb1c3799cdea # v7
        with:
          script: |
            const { retryGithubRequest } = await import(`${process.env.GITHUB_WORKSPACE}/.github/scripts/github-rate-limit.mjs`);
            const eventPr = context.payload.pull_request;
            await retryGithubRequest(async () => {
              const { data: current } = await github.rest.pulls.get({
                ...context.repo, pull_number: eventPr.number,
              });
              if (current.state !== 'open' || current.base.ref !== 'production' ||
                  current.head.sha !== eventPr.head.sha || current.title !== eventPr.title) {
                core.info('Skipping stale title recheck; a newer event owns it.');
                return;
              }
              await github.rest.repos.createCommitStatus({
                ...context.repo, sha: current.head.sha, context: 'pr-title',
                state: 'pending', description: 'Trusted guards are evaluating this pull request',
                target_url: `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`,
              });
            }, { log: core.warning });
      - name: Read guard metadata once
        id: metadata
        uses: actions/github-script@60a0d83039c74a4aee543508d2ffcb1c3799cdea # v7
        with:
          script: |
            const { retryGithubRequest } = await import(`${process.env.GITHUB_WORKSPACE}/.github/scripts/github-rate-limit.mjs`);
            const { data: pr } = await retryGithubRequest(() => github.rest.pulls.get({
              ...context.repo, pull_number: context.payload.pull_request.number,
            }), { log: core.warning });
            core.setOutput('pr', JSON.stringify({
              number: pr.number, state: pr.state, title: pr.title, user: pr.user,
              labels: pr.labels, head: pr.head, base: pr.base,
              additions: pr.additions, deletions: pr.deletions, changed_files: pr.changed_files,
            }));
      - uses: actions/github-script@60a0d83039c74a4aee543508d2ffcb1c3799cdea # v7
        id: outside
        if: ${{ !cancelled() }}
        env:
          PR_METADATA: ${{ steps.metadata.outputs.pr }}
        with:
          script: |
            await require('./.github/scripts/outside-pr-guard.cjs')({ github, context, core, pr: JSON.parse(process.env.PR_METADATA) });
      - uses: actions/github-script@60a0d83039c74a4aee543508d2ffcb1c3799cdea # v7
        id: size
        env:
          PR_METADATA: ${{ steps.metadata.outputs.pr }}
        if: ${{ !cancelled() && github.event.pull_request.base.ref == 'production' }}
        with:
          script: |
            await require('./.github/scripts/pr-size.cjs')({ github, context, core, prMetadata: process.env.PR_METADATA });

      - uses: actions/github-script@60a0d83039c74a4aee543508d2ffcb1c3799cdea # v7
        id: title
        if: ${{ !cancelled() && github.event.pull_request.base.ref == 'production' }}
        env:
          PR_METADATA: ${{ steps.metadata.outputs.pr }}
          HYPERTASK_MCP_TOKEN: ${{ secrets.HYPERTASK_MCP_TOKEN }}
        with:
          script: |
            await require('./.github/scripts/pr-title.cjs')({ github, context, core, pr: JSON.parse(process.env.PR_METADATA) });
      - name: Check workflow runner policy
        id: runner-policy
        if: ${{ !cancelled() && github.event.pull_request.base.ref == 'production' }}
        uses: actions/github-script@60a0d83039c74a4aee543508d2ffcb1c3799cdea # v7
        env:
          GH_TOKEN: ${{ github.token }}
          NODE_PATH: ${{ github.workspace }}/.github/scripts/node-version-guard/node_modules
          PR_METADATA: ${{ steps.metadata.outputs.pr }}
        with:
          script: |
            const pr = JSON.parse(process.env.PR_METADATA);
            core.setOutput('sha', pr.head.sha);
            await require('./.github/scripts/ci-runner-policy.cjs').checkPullRequest({ pr, core });
      - name: Save size measurement
        if: ${{ !cancelled() && github.event.pull_request.base.ref == 'production' }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: pr-size-${{ github.event.pull_request.number }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/pr-size-*.json
          retention-days: 14
          if-no-files-found: error
      - name: Publish combined guard result
        if: ${{ !cancelled() && github.event.pull_request.base.ref == 'production' }}
        uses: actions/github-script@60a0d83039c74a4aee543508d2ffcb1c3799cdea # v7
        env:
          RESULTS: ${{ toJSON(steps) }}
        with:
          script: |
            const { retryGithubRequest } = await import(`${process.env.GITHUB_WORKSPACE}/.github/scripts/github-rate-limit.mjs`);
            const results = JSON.parse(process.env.RESULTS);
            const eventPr = context.payload.pull_request;
            const evaluated = JSON.parse(results.metadata?.outputs?.pr || '{}');
            const labelNames = labels => (labels ?? []).map(label => label.name).sort().join(',');
            const sizeBlocked = results.size?.outputs?.blocked === 'true';
            const passed = !sizeBlocked && ['outside', 'title', 'runner-policy'].every(id =>
              results[id]?.outcome === 'success' && results[id]?.outputs?.sha === eventPr.head.sha);
            await retryGithubRequest(async () => {
              const { data: current } = await github.rest.pulls.get({
                ...context.repo, pull_number: eventPr.number,
              });
              if (current.state !== 'open' || current.base.ref !== 'production' ||
                  current.head.sha !== eventPr.head.sha || current.title !== eventPr.title ||
                  current.title !== (results.title?.outputs?.title ?? eventPr.title) ||
                  (evaluated.labels && labelNames(current.labels) !== labelNames(evaluated.labels))) {
                core.info('Skipping stale guard result; a newer event owns it.');
                return;
              }
              await github.rest.repos.createCommitStatus({
                ...context.repo, sha: current.head.sha, context: 'pr-title',
                state: passed ? 'success' : 'failure',
                description: passed ? 'Trusted guards passed' : sizeBlocked ? 'This change is over the hand-written size cap' : 'A trusted guard failed or did not run',
                target_url: `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`,
              });
              if (!passed) core.setFailed(sizeBlocked ? 'PR size over the cap; split it into smaller changes that each build green.' : 'A trusted guard failed or did not run.');
            }, { log: core.warning });

  bind-ticket:
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/production'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: production
          persist-credentials: false
      - uses: actions/github-script@60a0d83039c74a4aee543508d2ffcb1c3799cdea # v7
        env:
          HYPERTASK_MCP_TOKEN: ${{ secrets.HYPERTASK_MCP_TOKEN }}
        with:
          script: |
            await require('./.github/scripts/pr-title.cjs')({ github, context, core });
