name: PR Guards Trusted

on:
  pull_request_target:
    types: [opened, synchronize, reopened, edited, ready_for_review, labeled, unlabeled, closed]

permissions:
  contents: read
  pull-requests: write
  statuses: write

concurrency:
  group: pr-guards-trusted-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  pr-guards-trusted:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Mark original guard contexts pending
        uses: actions/github-script@60a0d83039c74a4aee543508d2ffcb1c3799cdea # v7
        with:
          script: |
            for (const name of ["outside-pr-guard", "pr-size", "pr-title", "reconcile-feature-flag-gate", "ux-signoff-gate"]) {
              if (context.payload.action === 'closed' && name !== 'reconcile-feature-flag-gate') continue;
              if (context.payload.pull_request.base.ref !== 'production' && !['outside-pr-guard', 'reconcile-feature-flag-gate'].includes(name)) continue;
              await github.rest.repos.createCommitStatus({
                ...context.repo, sha: context.payload.pull_request.head.sha,
                context: name, state: 'pending', description: `${name} is evaluating this pull request`,
              });
            }
      - uses: actions/github-script@60a0d83039c74a4aee543508d2ffcb1c3799cdea # v7
        id: outside
        if: always() && github.event.action != 'closed'
        with:
          script: |
            const marker = '<!-- outside-pr-guard -->';

            async function run() {
              const { owner, repo } = context.repo;
              const base = `${owner}/${repo}`;
              const dispatch = context.eventName === 'workflow_dispatch';
              const inputs = context.payload.inputs || {};
              let pr;

              if (dispatch && inputs.simulate_author) {
                const author = inputs.simulate_author;
                const fork = inputs.simulate_fork === true || inputs.simulate_fork === 'true';
                pr = {
                  number: 0,
                  user: { login: author, type: 'User' },
                  head: { repo: { full_name: fork ? `${author}/${repo}` : base } },
                  base: { repo: { full_name: base } },
                };
              } else {
                const prNumber = context.payload.pull_request?.number || inputs.pr_number;
                if (!prNumber) {
                  core.setFailed('Provide pr_number or simulate_author to inspect a PR.');
                  return;
                }
                // Read fresh metadata, not the potentially stale webhook payload.
                ({ data: pr } = await github.rest.pulls.get({
                  owner, repo, pull_number: Number(prNumber),
                }));
              }

              const login = pr.user.login;
              const head = pr.head.repo?.full_name || '(deleted fork)';
              let trusted = false;
              let reason;
              if (head === base) {
                trusted = true;
                reason = 'same-repo branch';
              } else if (pr.user.type === 'Bot' && login === 'dependabot[bot]') {
                trusted = true;
                reason = 'Dependabot bot';
              } else {
                try {
                  const { data: { permission } } = await github.rest.repos.getCollaboratorPermissionLevel({
                    owner, repo, username: login,
                  });
                  trusted = ['admin', 'maintain', 'write'].includes(permission);
                  reason = `author has ${permission || 'none'} access`;
                } catch (err) {
                  if (err.status !== 404) throw err;
                  reason = 'author is not a collaborator';
                }
              }

              const decision = `PR #${pr.number} by ${login} from ${head}: ${trusted ? 'trusted' : 'outside'} (${reason})`;
              core.info(decision);
              await core.summary.addRaw(decision).write();
              if (trusted || context.eventName !== 'pull_request_target') return;

              const comments = await github.paginate(github.rest.issues.listComments, {
                owner, repo, issue_number: pr.number,
              });
              if (!comments.some((comment) => (comment.body || '').includes(marker))) {
                await github.rest.issues.createComment({
                  owner, repo, issue_number: pr.number,
                  body: `${marker}\n\nThanks for taking the time to contribute! This project does not accept pull requests from outside the team. Please [open an issue describing the bug or idea](https://github.com/${base}/issues/new) and the team will pick it up and do the code work. See [CONTRIBUTING.md](https://github.com/${base}/blob/HEAD/CONTRIBUTING.md) for more information.`,
                });
              }
              await github.rest.pulls.update({ owner, repo, pull_number: pr.number, state: 'closed' });
            }

            try {
              await run();
            } catch (err) {
              core.setFailed(`outside-pr-guard failed: ${err.message}`);
            }
      - uses: actions/github-script@60a0d83039c74a4aee543508d2ffcb1c3799cdea # v7
        id: size
        if: always() && github.event.action != 'closed' && github.event.pull_request.base.ref == 'production'
        with:
          script: |
            const marker = '<!-- pr-size-warning -->';
            const cap = 400;
            const botLogin = 'github-actions[bot]';

            async function run() {
              const prNumber = context.payload.pull_request?.number;
              if (!prNumber) {
                core.info('No pull_request payload; skipping pr-size check.');
                return;
              }

              // Fetch fresh from the API rather than trust the webhook payload.
              const { data: pr } = await github.rest.pulls.get({
                ...context.repo,
                pull_number: prNumber,
              });

              // This repo has no fork contributors; skip explicitly and visibly rather
              // than silently commenting on a fork PR we don't intend to support.
              if (pr.head.repo.full_name !== `${context.repo.owner}/${context.repo.repo}`) {
                core.info(`PR #${pr.number} is from a fork (${pr.head.repo.full_name}); skipping pr-size comment.`);
                return;
              }

              const total = (pr.additions || 0) + (pr.deletions || 0);
              const over = total > cap;

              let body;
              if (over) {
                body = `${marker}\n\n:warning: **PR size warning** — this PR is **${total}** changed lines (additions + deletions), over the ~${cap}-line cap in AGENTS.md. Consider splitting it into a stack of small PRs: each builds green and is safe to merge alone, landed in order. The cap is advisory — this comment never blocks merging.`;
              } else {
                body = `${marker}\n\n:white_check_mark: This PR is now **${total}** changed lines (additions + deletions), within the ~${cap}-line cap in AGENTS.md.`;
              }

              const comments = await github.paginate(github.rest.issues.listComments, {
                ...context.repo,
                issue_number: pr.number,
              });
              const existing = comments.find((c) => c.user?.login === botLogin && (c.body || '').includes(marker));

              if (over) {
                if (existing) {
                  if (existing.body !== body) {
                    await github.rest.issues.updateComment({
                      ...context.repo,
                      comment_id: existing.id,
                      body,
                    });
                    core.info(`Updated size comment for PR #${pr.number}.`);
                  } else {
                    core.info(`Size comment for PR #${pr.number} is already up to date.`);
                  }
                } else {
                  await github.rest.issues.createComment({
                    ...context.repo,
                    issue_number: pr.number,
                    body,
                  });
                  core.info(`Created size comment for PR #${pr.number}.`);
                }
              } else if (existing) {
                await github.rest.issues.updateComment({
                  ...context.repo,
                  comment_id: existing.id,
                  body,
                });
                core.info(`Updated size comment to within-cap for PR #${pr.number}.`);
              } else {
                core.info(`PR #${pr.number} is within the cap and has no size comment; nothing to do.`);
              }
            }

            try {
              await run();
            } catch (err) {
              core.warning(`pr-size check failed but will not block the PR: ${err.message}`);
            }

  # Every pull request is authored by the same GitHub account, so the title
  # carries the source ticket and kind of work. The rule lived only in the
  # agent prompt, where an agent with no tag configured never saw it, and three
  # PRs drifted before anyone noticed. This fails the merge instead of trusting
  # each agent to remember.
      - uses: actions/github-script@60a0d83039c74a4aee543508d2ffcb1c3799cdea # v7
        id: title
        if: always() && github.event.action != 'closed' && github.event.pull_request.base.ref == 'production'
        with:
          script: |
            // YPER4 = Hypertask Infra board (project 4060): plumbing work
            // (agent farm, CI, deploy safety) lives there, not on board 15,
            // so its ticket ids need the same shape rule as HTPR/HYFA
            // (Valentin, 2026-09-27 infra-board rule; supervisor decision,
            // 2026-09-29, on YPER4-17).
            const PREFIXES = ['HTPR', 'HYFA', 'YPER4'];
            const TAGS = [
              'BUGFIX', 'FEATURE', 'IMPROVE', 'CLI/MCP/AI', 'SPEED', 'FEEDBACK',
              'DASH', 'QA', 'BOARD', 'COST', 'PLAN', 'INFRA', 'REFACTOR',
            ];
            const shape = new RegExp(
              '^(?:' + PREFIXES.join('|') + ')-\\d+ \\[(' +
              TAGS.map(t => t.replace(/[/]/g, '\\/')).join('|') +
              ')\\] \\S'
            );

            const prNumber = context.payload.pull_request?.number;
            if (!prNumber) {
              core.info('No pull_request payload; skipping title check.');
              return;
            }

            // Read from the API, not the webhook payload: an edited title
            // arrives stale on a re-run and would fail a PR that is now correct.
            const { data: pr } = await github.rest.pulls.get({
              ...context.repo,
              pull_number: prNumber,
            });

            if (pr.user.login.endsWith('[bot]')) {
              core.info(`Skipping ${pr.user.login}: bots do not follow the agent title rule.`);
              return;
            }

            // Auto-revert PRs carry GitHub's generated title. A rollback is
            // time-critical and must not stall on the agent title rule.
            if (/^Revert "/.test(pr.title)) {
              core.info(`Skipping revert PR title: ${pr.title}`);
              return;
            }

            if (shape.test(pr.title)) {
              core.info(`Title OK: ${pr.title}`);
              return;
            }

            core.setFailed(
              [
                `Pull request title does not match the required shape.`,
                ``,
                `  got:      ${pr.title}`,
                `  expected: (HTPR|HYFA|YPER4)-<n> [TAG] <summary>`,
                ``,
                `Valid tags: ${TAGS.join(', ')}`,
                ``,
                `Example: HTPR-5626 [INFRA] Move every job off GitHub-hosted runners`,
                `         HYFA-43 [INFRA] Add Factory acceptance routes`,
                `         YPER4-17 [INFRA] Step 4: rules enforced in code`,
                ``,
                `Edit the title and this check re-runs on its own.`,
              ].join('\n')
            );
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        if: always()
        with:
          ref: production
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        if: always()
        with:
          node-version: ^24.22.1
          check-latest: true
          cache: npm
          cache-dependency-path: .github/scripts/feature-flag-parser/package-lock.json
      - name: Evaluate the current pull-request head with trusted code
        id: flags
        if: always() && github.event.action != 'closed' && github.event.pull_request.base.ref == 'production'
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          EVENT_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          REPO: ${{ github.repository }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -uo pipefail
          gate_tmp=$(mktemp -d "${RUNNER_TEMP:-/tmp}/feature-flag-gate.XXXXXX") || {
            echo "::error::Cannot create private feature-flag-gate scratch space."
            exit 2
          }
          trap 'rm -rf "$gate_tmp"' EXIT
          export GH_API_MAX_WAIT_SECONDS=120 GH_API_TIME_BUDGET_SECONDS=180
          source .github/scripts/github-api-retry.sh
          pr_json="$gate_tmp/pr.json"
          current_json="$gate_tmp/current.json"
          heads_json="$gate_tmp/heads.json"
          fresh_heads_json="$gate_tmp/fresh-heads.json"
          reason_file="$gate_tmp/reason.txt"
          error_file="$gate_tmp/error.txt"
          pending_payload="$gate_tmp/pending-status.json"
          payload="$gate_tmp/status.json"
          head_sha="$EVENT_HEAD_SHA"
          fingerprint=""

          publish_error_status() {
            if [[ "$1" != *"waiting for"* ]]; then gh_api_failed=2; fi
            jq -n --arg description "$1" --arg target_url "$RUN_URL${fingerprint:+#$fingerprint}" '{
              state: "error",
              context: "feature-flag-gate",
              description: $description,
              target_url: $target_url
            }' >"$payload"
            gh_api -X POST "repos/$REPO/statuses/$head_sha" --input "$payload" >/dev/null
          }

          if ! [[ "$head_sha" =~ ^[0-9a-f]{40}$ ]]; then
            echo "::error::Event head SHA for pull request #$PR_NUMBER is missing."
            exit 2
          fi

          jq -n --arg target_url "$RUN_URL" '{
            state: "pending",
            context: "feature-flag-gate",
            description: "feature-flag-gate is evaluating this pull request",
            target_url: $target_url
          }' >"$pending_payload"
          if ! gh_api -X POST "repos/$REPO/statuses/$head_sha" --input "$pending_payload" >/dev/null; then
            echo "::error::Cannot mark feature-flag-gate pending for pull request #$PR_NUMBER."
            exit 2
          fi

          if ! gh_api "repos/$REPO/pulls/$PR_NUMBER" >"$pr_json"; then
            echo "::error::Cannot read pull request #$PR_NUMBER."
            publish_error_status "feature-flag-gate could not read pull request metadata" ||
              echo "::error::Cannot replace the pending feature-flag-gate status."
            exit 2
          fi
          if ! jq -e '
            .state == "open" and .base.ref == "production" and
            (.title | type == "string") and (.base.sha | test("^[0-9a-f]{40}$")) and
            (.head.sha | test("^[0-9a-f]{40}$")) and (.head.repo.full_name | type == "string")
          ' "$pr_json" >/dev/null; then
            echo "::error::Pull request #$PR_NUMBER metadata is incomplete."
            publish_error_status "feature-flag-gate found incomplete pull request metadata" ||
              echo "::error::Cannot replace the pending feature-flag-gate status."
            exit 2
          fi

          title=$(jq -r '.title' "$pr_json")
          base_sha=$(jq -r '.base.sha' "$pr_json")
          api_head_sha=$(jq -r '.head.sha' "$pr_json")
          head_repo=$(jq -r '.head.repo.full_name' "$pr_json")
          export FEATURE_FLAG_PR_LABELS
          FEATURE_FLAG_PR_LABELS=$(jq -c '[.labels[]?.name // empty]' "$pr_json")
          fingerprint="ffg=$base_sha.$(printf '%s\n%s' "$title" "$(jq -c 'sort' <<<"$FEATURE_FLAG_PR_LABELS")" | sha256sum | cut -c1-16)"
          result=2

          if [ "$api_head_sha" != "$head_sha" ]; then
            echo "Pull request head changed during evaluation." >"$reason_file"
            result=1
          else

          parser_dir="$gate_tmp/parser"
          mkdir -p "$parser_dir"
          cp .github/scripts/feature-flag-parser/package.json \
            .github/scripts/feature-flag-parser/package-lock.json "$parser_dir/"
          if ! npm ci --prefix "$parser_dir" --ignore-scripts --no-audit --no-fund \
            >"$gate_tmp/npm-install.txt" 2>"$error_file"; then
            echo "::error::Cannot install the trusted TypeScript parser."
            publish_error_status "feature-flag-gate could not install its parser" ||
              echo "::error::Cannot replace the pending feature-flag-gate status."
            exit 2
          fi
          export FEATURE_FLAG_TYPESCRIPT_PATH="$parser_dir/node_modules/typescript/lib/typescript.js"

          if ! gh_api --paginate --slurp "repos/$REPO/pulls?state=open&base=production&per_page=100" >"$heads_json"; then
            echo "::error::Cannot check whether the head commit is shared by open production pull requests."
            publish_error_status "feature-flag-gate could not read open pull requests" ||
              echo "::error::Cannot replace the pending feature-flag-gate status."
            exit 2
          fi
          if ! head_pr_count=$(jq -er --arg sha "$head_sha" '[flatten[] | select(.head.sha == $sha)] | length' "$heads_json"); then
            echo "::error::Cannot parse open production pull-request heads."
            publish_error_status "feature-flag-gate could not parse pull-request heads" ||
              echo "::error::Cannot replace the pending feature-flag-gate status."
            exit 2
          fi

          if [ "$head_pr_count" -ne 1 ]; then
            echo "This head commit is shared by multiple open production pull requests; use a unique head commit." >"$reason_file"
            result=1
          elif [ "$head_repo" != "$REPO" ]; then
            echo "Fork pull requests require owner review." >"$reason_file"
            result=1
          elif ! git fetch --no-tags origin +refs/heads/production:refs/remotes/origin/production "refs/pull/$PR_NUMBER/head" >"$gate_tmp/fetch.txt" 2>"$error_file"; then
            result=2
          elif [ "$(git rev-parse HEAD)" != "$(git rev-parse origin/production)" ]; then
            echo "Trusted production checkout drifted; a later event will re-evaluate with current policy."
            result=3
          elif ! git cat-file -e "$base_sha^{commit}" || ! git cat-file -e "$head_sha^{commit}"; then
            echo "The pull request commits are unavailable." >"$error_file"
            result=2
          elif node .github/scripts/feature-flag-gate.mjs "$title" "$base_sha" "$head_sha" >"$reason_file" 2>"$error_file"; then
            result=0
          else
            result=$(( $? == 1 ? 1 : 2 ))
          fi

          fi

          if [ "$result" -eq 2 ]; then gh_api_failed=2; fi
          if ! GH_API_NO_WAIT=1 gh_api --paginate --slurp "repos/$REPO/pulls?state=open&base=production&per_page=100" >"$fresh_heads_json" ||
             ! fresh_head_pr_count=$(jq -er --arg sha "$head_sha" '[flatten[] | select(.head.sha == $sha)] | length' "$fresh_heads_json"); then
            echo "::error::Cannot re-check whether the head commit is shared before publishing its result."
            publish_error_status "feature-flag-gate could not refresh pull-request heads" ||
              echo "::error::Cannot replace the pending feature-flag-gate status."
            exit 2
          fi
          if [ "$fresh_head_pr_count" -ne 1 ]; then
            echo "This head commit is shared by multiple open production pull requests; use a unique head commit." >"$reason_file"
            result=1
          fi
          if ! GH_API_NO_WAIT=1 gh_api "repos/$REPO/pulls/$PR_NUMBER" >"$current_json"; then
            echo "::error::Cannot re-read pull request #$PR_NUMBER before publishing its result."
            publish_error_status "feature-flag-gate could not refresh this pull request" ||
              echo "::error::Cannot replace the pending feature-flag-gate status."
            exit 2
          fi
          if [ "$(jq -r '.state' "$current_json")" != "open" ] ||
             [ "$(jq -r '.base.ref' "$current_json")" != "production" ] ||
             [ "$(jq -r '.title' "$current_json")" != "$title" ] ||
             [ "$(jq -r '.base.sha' "$current_json")" != "$base_sha" ] ||
             [ "$(jq -r '.head.sha' "$current_json")" != "$head_sha" ] ||
             ! jq -e --argjson labels "$FEATURE_FLAG_PR_LABELS" '([.labels[]?.name // empty] | sort) == ($labels | sort)' "$current_json" >/dev/null; then
            echo "Pull request #$PR_NUMBER changed during evaluation; its queued event will evaluate the new state."
            publish_error_status "feature-flag-gate is waiting for the updated pull request" ||
              echo "::error::Cannot replace the pending feature-flag-gate status."
            exit 0
          fi

          if [ "$result" -eq 0 ]; then
            state=success
            description=$(head -1 "$reason_file" | cut -c1-130)
          elif [ "$result" -eq 1 ]; then
            state=failure
            description=$(head -1 "$reason_file" | cut -c1-130)
          elif [ "$result" -eq 3 ]; then
            state=pending
            description="feature-flag-gate is waiting for the run on the newer production commit"
          else
            state=error
            description="feature-flag-gate could not evaluate this pull request"
            cat "$error_file"
          fi

          jq -n --arg state "$state" --arg description "$description" --arg target_url "$RUN_URL#$fingerprint" '{
            state: $state,
            context: "feature-flag-gate",
            description: $description,
            target_url: $target_url
          }' >"$payload"
          if ! gh_api -X POST "repos/$REPO/statuses/$head_sha" --input "$payload" >/dev/null; then
            echo "::error::Cannot publish feature-flag-gate for pull request #$PR_NUMBER."
            exit 2
          fi

          if [ "$result" -eq 0 ]; then
            echo "PASS: $(cat "$reason_file")"
          elif [ "$result" -eq 1 ]; then
            echo "::error::$(cat "$reason_file")"
            printf '## feature-flag-gate failed\n\n%s\n' "$(cat "$reason_file")" >>"$GITHUB_STEP_SUMMARY"
          elif [ "$result" -eq 3 ]; then
            echo "$description"
            exit 0
          else
            echo "::error::feature-flag-gate could not evaluate this pull request."
          fi
          exit "$result"
      - name: Reconcile every open production pull request
        id: reconcile
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -uo pipefail
          gate_tmp=$(mkdir -p "${RUNNER_TEMP:-/tmp}" && mktemp -d "${RUNNER_TEMP:-/tmp}/feature-flag-reconcile.XXXXXX") || {
            echo "::error::Cannot create private feature-flag reconciliation scratch space."
            exit 2
          }
          trap 'rm -rf "$gate_tmp"' EXIT
          source .github/scripts/github-api-retry.sh
          pages="$gate_tmp/pulls.json"
          rows="$gate_tmp/pulls.jsonl"
          fresh_heads_json="$gate_tmp/fresh-heads.json"
          failures=0
          evaluated=0
          skipped=0
          fingerprint=""

          publish_status_if_changed() {
            local head_sha="$1"
            local payload="$2"
            local statuses_file="${3:-}"
            local latest state description status_fingerprint
            if [ -z "$statuses_file" ]; then
              statuses_file="$gate_tmp/latest-statuses.json"
              if ! gh_api "repos/$REPO/commits/$head_sha/statuses?per_page=100" >"$statuses_file"; then
                echo "::warning::Cannot read existing feature-flag-gate statuses for $head_sha; publishing without deduplication."
                gh_api -X POST "repos/$REPO/statuses/$head_sha" --input "$payload" >/dev/null
                return
              fi
            fi
            latest=$(cat "$statuses_file")
            state=$(jq -r '.state' "$payload") || return 1
            description=$(jq -r '.description' "$payload") || return 1
            status_fingerprint=$(jq -r '.target_url | split("#")[1:] | join("#")' "$payload") || return 1
            if jq -e --arg state "$state" --arg description "$description" --arg fingerprint "$status_fingerprint" '
              map(select(.context == "feature-flag-gate"))[0] as $current |
              $current.state == $state and $current.description == $description and
              ($current.target_url // "" | split("#")[1:] | join("#")) == $fingerprint
            ' <<<"$latest" >/dev/null; then
              return 0
            fi
            gh_api -X POST "repos/$REPO/statuses/$head_sha" --input "$payload" >/dev/null
          }

          publish_reconciliation_error() {
            if [[ "$3" != *"waiting for"* ]]; then gh_api_failed=2; fi
            jq -n --arg description "$3" --arg target_url "$RUN_URL${fingerprint:+#$fingerprint}" '{
              state: "error",
              context: "feature-flag-gate",
              description: $description,
              target_url: $target_url
            }' >"$2"
            publish_status_if_changed "$1" "$2" "${4:-}"
          }

          parser_dir="$gate_tmp/parser"
          mkdir -p "$parser_dir"
          cp .github/scripts/feature-flag-parser/package.json \
            .github/scripts/feature-flag-parser/package-lock.json "$parser_dir/"

          if ! gh_api --paginate --slurp "repos/$REPO/pulls?state=open&base=production&per_page=100" >"$pages"; then
            echo "::error::Cannot list open production pull requests."
            exit 2
          fi
          if ! jq -c 'flatten[]' "$pages" >"$rows"; then
            echo "::error::Cannot parse the open production pull-request list."
            exit 2
          fi

          open_heads="$gate_tmp/open-heads.txt"
          : >"$open_heads"
          while IFS= read -r pull; do
            if ! jq -e '(.head.sha | test("^[0-9a-f]{40}$"))' <<<"$pull" >/dev/null; then
              continue
            fi
            head_sha=$(jq -r '.head.sha' <<<"$pull")
            if ! grep -Fxq "$head_sha" "$open_heads"; then
              echo "$head_sha" >>"$open_heads"
            fi
          done <"$rows"

          if ! npm ci --prefix "$parser_dir" --ignore-scripts --no-audit --no-fund \
            >"$gate_tmp/npm-install.txt" 2>"$gate_tmp/npm-install-error.txt"; then
            echo "::error::Cannot install the trusted TypeScript parser."
            while IFS= read -r head_sha; do
              publish_reconciliation_error "$head_sha" "$gate_tmp/error-$head_sha.json" \
                "feature-flag-gate could not install its parser" || true
            done <"$open_heads"
            exit 2
          fi
          export FEATURE_FLAG_TYPESCRIPT_PATH="$parser_dir/node_modules/typescript/lib/typescript.js"

          while IFS= read -r pull; do
            fingerprint=""
            if ! jq -e '
              (.number | type == "number") and (.title | type == "string") and
              (.base.sha | test("^[0-9a-f]{40}$")) and (.head.sha | test("^[0-9a-f]{40}$")) and
              (.head.repo.full_name | type == "string")
            ' <<<"$pull" >/dev/null; then
              echo "::error::An open pull request has incomplete metadata."
              incomplete_head=$(jq -r '.head.sha // empty' <<<"$pull")
              if [[ "$incomplete_head" =~ ^[0-9a-f]{40}$ ]]; then
                publish_reconciliation_error "$incomplete_head" "$gate_tmp/error-$incomplete_head.json" \
                  "feature-flag-gate found incomplete pull request metadata" || true
              fi
              failures=$((failures + 1))
              continue
            fi

            number=$(jq -r '.number' <<<"$pull")
            title=$(jq -r '.title' <<<"$pull")
            base_sha=$(jq -r '.base.sha' <<<"$pull")
            head_sha=$(jq -r '.head.sha' <<<"$pull")
            head_repo=$(jq -r '.head.repo.full_name' <<<"$pull")
            export FEATURE_FLAG_PR_LABELS
            FEATURE_FLAG_PR_LABELS=$(jq -c '[.labels[]?.name // empty]' <<<"$pull")
            head_pr_count=$(jq -er --arg sha "$head_sha" '[flatten[] | select(.head.sha == $sha)] | length' "$pages")
            reason_file="$gate_tmp/reason-$number.txt"
            error_file="$gate_tmp/error-$number.txt"
            payload="$gate_tmp/status-$number.json"
            result=2
            fingerprint="ffg=$base_sha.$(printf '%s\n%s' "$title" "$(jq -c 'sort' <<<"$FEATURE_FLAG_PR_LABELS")" | sha256sum | cut -c1-16)"
            statuses_file="$gate_tmp/latest-statuses-$number.json"
            if ! gh_api "repos/$REPO/commits/$head_sha/statuses?per_page=100" >"$statuses_file"; then
              echo "::warning::Cannot read existing feature-flag-gate statuses for $head_sha; evaluating without deduplication."
              printf '[]\n' >"$statuses_file"
            fi
            if [ "$head_pr_count" -eq 1 ] && [ "$head_repo" = "$REPO" ] && jq -e --arg fingerprint "$fingerprint" --argjson rejudge_minutes 30 '
              map(select(.context == "feature-flag-gate"))[0] as $current |
              ($current.state == "success" or $current.state == "failure") and
              (($current.updated_at // "1970-01-01T00:00:00Z" | sub("\\.[0-9]+Z$"; "Z") | fromdateiso8601) > (now - ($rejudge_minutes * 60))) and
              ($current.description // "" | startswith("This head commit is shared by multiple open production pull requests;") | not) and
              ($current.target_url // "" | split("#")[1:] | join("#")) == $fingerprint
            ' "$statuses_file" >/dev/null; then
              echo "skip #$number: unchanged since its last status under 30 minutes ago"
              skipped=$((skipped + 1))
              continue
            fi
            evaluated=$((evaluated + 1))

            if [ "$head_pr_count" -ne 1 ]; then
              echo "This head commit is shared by multiple open production pull requests; use a unique head commit." >"$reason_file"
              result=1
            elif [ "$head_repo" != "$REPO" ]; then
              echo "Fork pull requests require owner review." >"$reason_file"
              result=1
            elif ! git fetch --no-tags origin +refs/heads/production:refs/remotes/origin/production "refs/pull/$number/head" >"$gate_tmp/fetch-$number.txt" 2>"$error_file"; then
              result=2
            elif [ "$(git rev-parse HEAD)" != "$(git rev-parse origin/production)" ]; then
              echo "Trusted production checkout drifted; a later event will re-evaluate with current policy."
              result=3
            elif ! git cat-file -e "$base_sha^{commit}" || ! git cat-file -e "$head_sha^{commit}"; then
              echo "The pull request commits are unavailable." >"$error_file"
              result=2
            elif node .github/scripts/feature-flag-gate.mjs "$title" "$base_sha" "$head_sha" >"$reason_file" 2>"$error_file"; then
              result=0
            else
              result=$(( $? == 1 ? 1 : 2 ))
            fi

            if [ "$result" -eq 2 ]; then failures=$((failures + 1)); fi
            if ! GH_API_NO_WAIT=1 gh_api --paginate --slurp "repos/$REPO/pulls?state=open&base=production&per_page=100" >"$fresh_heads_json" ||
               ! fresh_head_pr_count=$(jq -er --arg sha "$head_sha" '[flatten[] | select(.head.sha == $sha)] | length' "$fresh_heads_json"); then
              echo "::error::Cannot re-check whether pull request #$number shares its head commit."
              publish_reconciliation_error "$head_sha" "$payload" "feature-flag-gate could not refresh pull-request heads" "$statuses_file" ||
                echo "::error::Cannot publish the feature-flag-gate error for #$number."
              failures=$((failures + 1))
              continue
            fi
            if [ "$fresh_head_pr_count" -ne 1 ]; then
              echo "This head commit is shared by multiple open production pull requests; use a unique head commit." >"$reason_file"
              result=1
            fi
            GH_API_NO_WAIT=1 gh_api "repos/$REPO/pulls/$number" >"$gate_tmp/current.json" || {
              echo "::error::Cannot re-read pull request #$number before publishing its result."
              publish_reconciliation_error "$head_sha" "$payload" "feature-flag-gate could not refresh pull request #$number" "$statuses_file" ||
                echo "::error::Cannot publish the feature-flag-gate error for #$number."
              failures=$((failures + 1))
              continue
            }
            current=$(cat "$gate_tmp/current.json")
            if [ "$(jq -r '.state' <<<"$current")" != "open" ] ||
               [ "$(jq -r '.base.ref' <<<"$current")" != "production" ] ||
               [ "$(jq -r '.title' <<<"$current")" != "$title" ] ||
               [ "$(jq -r '.base.sha' <<<"$current")" != "$base_sha" ] ||
               [ "$(jq -r '.head.sha' <<<"$current")" != "$head_sha" ] ||
               ! jq -e --argjson labels "$FEATURE_FLAG_PR_LABELS" '([.labels[]?.name // empty] | sort) == ($labels | sort)' <<<"$current" >/dev/null; then
              echo "Pull request #$number changed during reconciliation; its queued event will evaluate the new state."
              publish_reconciliation_error "$head_sha" "$payload" "feature-flag-gate is waiting for the updated pull request" "$statuses_file" ||
                echo "::error::Cannot publish the feature-flag-gate error for #$number."
              continue
            fi

            if [ "$result" -eq 0 ]; then
              state=success
              description=$(head -1 "$reason_file" | cut -c1-130)
            elif [ "$result" -eq 1 ]; then
              state=failure
              description=$(head -1 "$reason_file" | cut -c1-130)
            elif [ "$result" -eq 3 ]; then
              state=pending
              description="feature-flag-gate is waiting for the run on the newer production commit"
            else
              state=error
              description="feature-flag-gate could not evaluate this pull request"
              cat "$error_file"
            fi

            jq -n --arg state "$state" --arg description "$description" --arg target_url "$RUN_URL#$fingerprint" '{
              state: $state,
              context: "feature-flag-gate",
              description: $description,
              target_url: $target_url
            }' >"$payload"
            if ! publish_status_if_changed "$head_sha" "$payload" "$statuses_file"; then
              echo "::error::Cannot publish feature-flag-gate for pull request #$number."
              failures=$((failures + 1))
            fi
          done <"$rows"

          echo "evaluated $evaluated, skipped $skipped"
          if [ "$failures" -gt 0 ]; then
            echo "::error::Feature flag reconciliation had $failures infrastructure failure(s)."
            exit 2
          fi
      - name: Reconcile UX signoff from ticket comments
        id: ux
        if: always() && github.event.action != 'closed' && github.event.pull_request.base.ref == 'production'
        env:
          GH_API_MAX_WAIT_SECONDS: '240'
          GH_API_TIME_BUDGET_SECONDS: '480'
          GH_TOKEN: ${{ github.token }}
          MCP_TOKEN: ${{ secrets.HYPERTASK_MCP_TOKEN }}
          MCP_BASE_URL: https://app.hypertask.ai
          REPO: ${{ github.repository }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: node .github/scripts/ux-signoff-gate.mjs --reconcile
      - name: Publish original guard contexts
        if: always()
        uses: actions/github-script@60a0d83039c74a4aee543508d2ffcb1c3799cdea # v7
        env:
          RESULTS: ${{ toJSON(steps) }}
        with:
          script: |
            const results = JSON.parse(process.env.RESULTS);
            const guards = [["outside-pr-guard", "outside"], ["pr-size", "size"], ["pr-title", "title"], ["reconcile-feature-flag-gate", "reconcile"], ["ux-signoff-gate", "ux"]];
            let failed = false;
            for (const [name, id] of guards) {
              if (context.payload.action === 'closed' && id !== 'reconcile') continue;
              if (context.payload.pull_request.base.ref !== 'production' && !['outside', 'reconcile'].includes(id)) continue;
              const passed = results[id]?.outcome === 'success';
              failed ||= !passed;
              await github.rest.repos.createCommitStatus({
                ...context.repo, sha: context.payload.pull_request.head.sha,
                context: name, state: passed ? 'success' : 'failure',
                description: passed ? `${name} passed` : `${name} failed or did not run`,
                target_url: `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`,
              });
            }
            // The flag and UX scripts publish their own semantic statuses. Never overwrite
            // their fingerprints or convert a policy rejection into a green status.
            for (const [id, name] of [['flags', 'feature-flag-gate'], ['ux', 'ux-signoff']]) {
              if (context.payload.action === 'closed' || context.payload.pull_request.base.ref !== 'production') continue;
              if (results[id]?.outcome === 'success') continue;
              failed = true;
              await github.rest.repos.createCommitStatus({
                ...context.repo, sha: context.payload.pull_request.head.sha,
                context: name, state: 'failure', description: `${name} failed or did not run`,
              });
            }
            if (failed) core.setFailed('One or more guards failed.');
