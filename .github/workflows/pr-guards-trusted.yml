name: PR Guards Trusted

on:
  pull_request_target:
    types: [opened, synchronize, reopened, edited, ready_for_review]
  workflow_dispatch:
    inputs:
      pr_number:
        description: Same-repository PR to link to its title ticket
        required: true
        type: string

permissions:
  contents: read
  pull-requests: write
  statuses: write

concurrency:
  group: pr-guards-trusted-${{ github.event.pull_request.number || inputs.pr_number }}
  cancel-in-progress: true

jobs:
  pr-guards-trusted:
    if: github.event_name == 'pull_request_target'
    runs-on: ubuntu-latest
    timeout-minutes: 65
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: production
          fetch-depth: 1
          persist-credentials: false
      - name: Install the trusted workflow parser
        run: npm ci --prefix .github/scripts/node-version-guard --ignore-scripts --no-audit --no-fund
      - name: Read guard metadata once
        id: metadata
        uses: actions/github-script@60a0d83039c74a4aee543508d2ffcb1c3799cdea # v7
        with:
          script: |
            const { retryGithubRequest } = await import(`${process.env.GITHUB_WORKSPACE}/.github/scripts/github-rate-limit.mjs`);
            const { data: pr } = await retryGithubRequest(() => github.rest.pulls.get({
              ...context.repo, pull_number: context.payload.pull_request.number,
            }), { log: core.warning });
            core.setOutput('pr', JSON.stringify({
              number: pr.number, state: pr.state, title: pr.title, user: pr.user,
              head: pr.head, base: pr.base, additions: pr.additions, deletions: pr.deletions,
            }));
      - uses: actions/github-script@60a0d83039c74a4aee543508d2ffcb1c3799cdea # v7
        id: outside
        if: ${{ !cancelled() }}
        env:
          PR_METADATA: ${{ steps.metadata.outputs.pr }}
        with:
          script: |
            await require('./.github/scripts/outside-pr-guard.cjs')({ github, context, core, pr: JSON.parse(process.env.PR_METADATA) });
      - uses: actions/github-script@60a0d83039c74a4aee543508d2ffcb1c3799cdea # v7
        id: size
        env:
          PR_METADATA: ${{ steps.metadata.outputs.pr }}
        if: ${{ !cancelled() && github.event.pull_request.base.ref == 'production' }}
        with:
          script: |
            const marker = '<!-- pr-size-warning -->';
            const cap = 400;
            const botLogin = 'github-actions[bot]';

            async function run() {
              const prNumber = context.payload.pull_request?.number;
              if (!prNumber) {
                core.info('No pull_request payload; skipping pr-size check.');
                return;
              }

              const pr = JSON.parse(process.env.PR_METADATA);

              core.setOutput('sha', pr.head.sha);

              // This repo has no fork contributors; skip explicitly and visibly rather
              // than silently commenting on a fork PR we don't intend to support.
              if (pr.head.repo.full_name !== `${context.repo.owner}/${context.repo.repo}`) {
                core.info(`PR #${pr.number} is from a fork (${pr.head.repo.full_name}); skipping pr-size comment.`);
                return;
              }

              const total = (pr.additions || 0) + (pr.deletions || 0);
              const over = total > cap;

              let body;
              if (over) {
                body = `${marker}\n\n:warning: **PR size warning** — this PR is **${total}** changed lines (additions + deletions), over the ~${cap}-line cap in AGENTS.md. Consider splitting it into a stack of small PRs: each builds green and is safe to merge alone, landed in order. The cap is advisory — this comment never blocks merging.`;
              } else {
                body = `${marker}\n\n:white_check_mark: This PR is now **${total}** changed lines (additions + deletions), within the ~${cap}-line cap in AGENTS.md.`;
              }

              const comments = await github.paginate(github.rest.issues.listComments, {
                ...context.repo,
                issue_number: pr.number,
              });
              const existing = comments.find((c) => c.user?.login === botLogin && (c.body || '').includes(marker));

              if (over) {
                if (existing) {
                  if (existing.body !== body) {
                    await github.rest.issues.updateComment({
                      ...context.repo,
                      comment_id: existing.id,
                      body,
                    });
                    core.info(`Updated size comment for PR #${pr.number}.`);
                  } else {
                    core.info(`Size comment for PR #${pr.number} is already up to date.`);
                  }
                } else {
                  await github.rest.issues.createComment({
                    ...context.repo,
                    issue_number: pr.number,
                    body,
                  });
                  core.info(`Created size comment for PR #${pr.number}.`);
                }
              } else if (existing) {
                await github.rest.issues.updateComment({
                  ...context.repo,
                  comment_id: existing.id,
                  body,
                });
                core.info(`Updated size comment to within-cap for PR #${pr.number}.`);
              } else {
                core.info(`PR #${pr.number} is within the cap and has no size comment; nothing to do.`);
              }
            }

            try {
              await run();
            } catch (err) {
              core.warning(`pr-size check failed but will not block the PR: ${err.message}`);
            }

      - uses: actions/github-script@60a0d83039c74a4aee543508d2ffcb1c3799cdea # v7
        id: title
        if: ${{ !cancelled() && github.event.pull_request.base.ref == 'production' }}
        env:
          PR_METADATA: ${{ steps.metadata.outputs.pr }}
          HYPERTASK_MCP_TOKEN: ${{ secrets.HYPERTASK_MCP_TOKEN }}
        with:
          script: |
            await require('./.github/scripts/pr-title.cjs')({ github, context, core, pr: JSON.parse(process.env.PR_METADATA) });
      - name: Check workflow runner policy
        id: runner-policy
        if: ${{ !cancelled() && github.event.pull_request.base.ref == 'production' }}
        uses: actions/github-script@60a0d83039c74a4aee543508d2ffcb1c3799cdea # v7
        env:
          GH_TOKEN: ${{ github.token }}
          NODE_PATH: ${{ github.workspace }}/.github/scripts/node-version-guard/node_modules
          PR_METADATA: ${{ steps.metadata.outputs.pr }}
        with:
          script: |
            const pr = JSON.parse(process.env.PR_METADATA);
            core.setOutput('sha', pr.head.sha);
            await require('./.github/scripts/ci-runner-policy.cjs').checkPullRequest({ pr, core });
      - name: Publish combined guard result
        if: ${{ !cancelled() && github.event.pull_request.base.ref == 'production' }}
        uses: actions/github-script@60a0d83039c74a4aee543508d2ffcb1c3799cdea # v7
        env:
          RESULTS: ${{ toJSON(steps) }}
        with:
          script: |
            const { retryGithubRequest } = await import(`${process.env.GITHUB_WORKSPACE}/.github/scripts/github-rate-limit.mjs`);
            const results = JSON.parse(process.env.RESULTS);
            const eventPr = context.payload.pull_request;
            const passed = ['outside', 'title', 'runner-policy'].every(id =>
              results[id]?.outcome === 'success' && results[id]?.outputs?.sha === eventPr.head.sha);
            await retryGithubRequest(async () => {
              const { data: current } = await github.rest.pulls.get({
                ...context.repo, pull_number: eventPr.number,
              });
              if (current.state !== 'open' || current.base.ref !== 'production' ||
                  current.head.sha !== eventPr.head.sha ||
                  current.title !== (results.title?.outputs?.title ?? eventPr.title)) {
                core.info('Skipping stale guard result; a newer event owns it.');
                return;
              }
              await github.rest.repos.createCommitStatus({
                ...context.repo, sha: current.head.sha, context: 'pr-title',
                state: passed ? 'success' : 'failure',
                description: passed ? 'Trusted guards passed' : 'A trusted guard failed or did not run',
                target_url: `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`,
              });
              if (!passed) core.setFailed('A trusted guard failed or did not run.');
            }, { log: core.warning });

  bind-ticket:
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/production'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: production
          persist-credentials: false
      - uses: actions/github-script@60a0d83039c74a4aee543508d2ffcb1c3799cdea # v7
        env:
          HYPERTASK_MCP_TOKEN: ${{ secrets.HYPERTASK_MCP_TOKEN }}
        with:
          script: |
            await require('./.github/scripts/pr-title.cjs')({ github, context, core });
