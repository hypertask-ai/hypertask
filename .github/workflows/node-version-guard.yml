name: Node version guard

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  push:
    branches: [production]

permissions:
  contents: read

concurrency:
  group: node-version-guard-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  node-version-guard:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
      - name: Install only the workflow parser
        run: npm ci --prefix .github/scripts/node-version-guard --ignore-scripts --no-audit --no-fund
      - name: Test comparison logic
        env:
          NODE_PATH: ${{ github.workspace }}/.github/scripts/node-version-guard/node_modules
        run: node --test tests/node-version-guard.test.cjs
      # Only this fixed API request receives the secret. PR scripts, dependency
      # installation and comparison never receive the Vercel token.
      - name: Read live Vercel project Node version
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          [ -n "$VERCEL_TOKEN" ] || { echo "::error::VERCEL_TOKEN is unavailable; cannot verify the live Node setting."; exit 1; }
          curl --fail --silent --show-error --max-time 30 \
            -H "Authorization: Bearer $VERCEL_TOKEN" \
            'https://api.vercel.com/v9/projects/prj_oEok2iMNFPzj6AWe1KQBaIAcPaAf?teamId=team_yureFlJZ6ibwebaOOkKc5whs' \
            | jq -er '.nodeVersion | select(type == "string" and length > 0)' > "$RUNNER_TEMP/vercel-node-version"
      - name: Compare package and workflow Node majors with Vercel
        env:
          NODE_PATH: ${{ github.workspace }}/.github/scripts/node-version-guard/node_modules
        run: node .github/scripts/check-node-version.cjs "$RUNNER_TEMP/vercel-node-version"
