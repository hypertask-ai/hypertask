name: Node version guard

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  push:
    branches: [production]

permissions:
  contents: read

concurrency:
  group: node-version-guard-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  vercel-node-version:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    outputs:
      node-version: ${{ steps.vercel.outputs.node-version }}
    steps:
      # This runner never checks out or executes PR code. Only the public Node
      # setting crosses into the comparison job, never the Vercel credential.
      - name: Read live Vercel project Node version
        id: vercel
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          PR_AUTHOR: ${{ github.event_name == 'pull_request' && github.event.pull_request.user.login || '' }}
        shell: bash
        run: |
          set -euo pipefail
          # GitHub gives Dependabot runs no repository secrets. Their pins are then
          # compared with the base branch, which this guard checks against Vercel on push.
          if [ -z "$VERCEL_TOKEN" ] && [ "$PR_AUTHOR" = "dependabot[bot]" ]; then
            echo "::notice::Dependabot run has no VERCEL_TOKEN; comparing with the base branch Node major instead."
            echo "node-version=" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          [ -n "$VERCEL_TOKEN" ] || { echo "::error::VERCEL_TOKEN is unavailable; cannot verify the live Node setting."; exit 1; }
          version=$(curl --fail --silent --show-error --max-time 30 \
            -H "Authorization: Bearer $VERCEL_TOKEN" \
            'https://api.vercel.com/v9/projects/prj_oEok2iMNFPzj6AWe1KQBaIAcPaAf?teamId=team_yureFlJZ6ibwebaOOkKc5whs' \
            | jq -er '.nodeVersion | select(type == "string") | select(test("^[0-9]+\\.x$"))')
          echo "node-version=$version" >> "$GITHUB_OUTPUT"

  node-version-guard:
    needs: vercel-node-version
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: ^24.22.1
          check-latest: true
      - name: CI runs patched Node at or above the security floor
        run: node .github/scripts/check-node-security-floor.cjs
      - name: Lockfiles contain no known-bad package release
        run: |
          node --test tests/known-bad-packages.test.cjs
          node .github/scripts/check-known-bad-packages.cjs
      - name: Install only the workflow parser
        run: npm ci --prefix .github/scripts/node-version-guard --ignore-scripts --no-audit --no-fund
      - name: Install only the gate parser
        run: npm ci --prefix .github/scripts/feature-flag-parser --ignore-scripts --no-audit --no-fund
      - name: Light gate dependency contract
        env:
          NODE_PATH: ${{ github.workspace }}/.github/scripts/node-version-guard/node_modules:${{ github.workspace }}/.github/scripts/feature-flag-parser/node_modules
        run: node --test tests/light-gate-dependencies.test.cjs
      - name: Test comparison logic
        env:
          NODE_PATH: ${{ github.workspace }}/.github/scripts/node-version-guard/node_modules
        run: node --test tests/node-version-guard.test.cjs
      - name: Compare package and workflow Node majors with Vercel
        env:
          NODE_PATH: ${{ github.workspace }}/.github/scripts/node-version-guard/node_modules
          LIVE_NODE_VERSION: ${{ needs.vercel-node-version.outputs.node-version }}
          PR_AUTHOR: ${{ github.event_name == 'pull_request' && github.event.pull_request.user.login || '' }}
          BASE_REF: ${{ github.base_ref }}
        shell: bash
        run: |
          set -euo pipefail
          if [ -z "$LIVE_NODE_VERSION" ] && [ "$PR_AUTHOR" = "dependabot[bot]" ]; then
            git fetch --quiet --depth 1 origin "refs/heads/$BASE_REF"
            LIVE_NODE_VERSION=$(git show FETCH_HEAD:package.json | jq -er '.engines.node')
            echo "Comparing with $BASE_REF package.json engines.node $LIVE_NODE_VERSION"
          fi
          printf '%s\n' "$LIVE_NODE_VERSION" > "$RUNNER_TEMP/vercel-node-version"
          node .github/scripts/check-node-version.cjs "$RUNNER_TEMP/vercel-node-version"
