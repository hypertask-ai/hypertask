name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  ci-tests:
    name: ci-tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Generate Prisma client
        run: npx prisma generate
      - name: Typecheck
        run: npx next typegen && npx tsc --noEmit
      - name: Lint
        run: npm run lint
      - name: Drop tests coupled to the private repo's CI plumbing
        # These assert on .github/workflows and openwiki/, which this repo
        # does not carry yet. Re-enable as the workflows migrate here.
        run: |
          rm -f tests/action-archive-cache.test.cjs \
                tests/automerge-workflow.test.cjs \
                tests/prod-health-workflow.test.cjs \
                tests/ci-dependency-cache.test.cjs \
                tests/preview-smoke-workflow.test.cjs \
                tests/review-runner-host.test.cjs \
                tests/agent-team-routing.test.cjs
      - name: Test
        run: npm test
