name: Require Fresh Checks

# HYCI-262. The runner app cannot edit rulesets. This production job uses the
# workflow token's administration permission to set one boolean.
on:
  push:
    branches: [production]
    paths:
      - .github/scripts/require-fresh-checks.mjs
      - .github/workflows/require-fresh-checks.yml
      - .github/scripts/verify-required-check-settings.mjs
  workflow_dispatch:

permissions:
  contents: read

jobs:
  apply:
    if: github.ref == 'refs/heads/production'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      administration: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '^24.22.1'
          check-latest: true
      - name: Require an up-to-date branch before merging
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          APPLY_FRESH_CHECKS: "1"
        run: node .github/scripts/require-fresh-checks.mjs
