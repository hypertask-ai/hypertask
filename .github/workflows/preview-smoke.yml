name: Preview Smoke Test

# Runs when the Vercel preview deployment for hypertasks-prod succeeds.
# Catches "builds fine but the app is broken" before merge. The authenticated
# API check runs after merge in prod-health, against trusted production code.
on:
  deployment_status:

permissions: {}

jobs:
  smoke:
    if: >
      github.event.deployment_status.state == 'success' &&
      github.event.deployment.environment == 'Preview – hypertasks-prod'
    # This job sends deployment secrets to the event-provided preview URL.
    # Keep it on GitHub's disposable runner so a PR-controlled preview cannot
    # access secrets from a persistent self-hosted machine.
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Smoke test the preview URL
        env:
          URL: ${{ github.event.deployment_status.environment_url }}
          BYPASS: ${{ secrets.VERCEL_BYPASS_SECRET }}
        run: |
          set -uo pipefail
          echo "Preview: $URL"
          JAR=$(mktemp)

          # 1. Homepage renders. Cookie jar is required: with
          #    x-vercel-set-bypass-cookie Vercel 307s until the bypass cookie
          #    persists, so a jarless curl redirect-loops (exit 47).
          code=$(curl -s -o /dev/null -w '%{http_code}' -L --max-redirs 10 --max-time 60 \
            -c "$JAR" -b "$JAR" \
            -H "x-vercel-protection-bypass: $BYPASS" \
            -H "x-vercel-set-bypass-cookie: true" \
            "$URL/" || echo 000)
          echo "GET / -> $code"
          if [ "$code" != "200" ]; then
            echo "::error::Homepage returned $code on the preview"
            exit 1
          fi

          echo "Smoke test passed"
