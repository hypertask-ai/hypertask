name: Quick check proof

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  quick-check-proof:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: 180a1169e79389ab0d1059dd47dcac71d3469ec9
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: ^24.22.1
          check-latest: true
          cache: npm
      - run: npm ci --no-audit --no-fund
      - name: Isolate PR 3303 chat regression with a bounded heap
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          p = Path('tests/htpr-8988-chat-window-layout.test.cjs')
          s = p.read_text()
          s = s.replace("assert.equal(view.container.querySelector('[role=\"dialog\"]'), null);", "assert.equal(view.container.querySelector('[role=\"dialog\"]')?.outerHTML ?? null, null);")
          s = s.replace('const view = stackView(', 'console.error("PROBE stackView", new Error().stack); const view = stackView(')
          s = s.replace('React.act(() => { assert.equal(view.controller.open("chat-a"), false); });', 'React.act(() => { assert.equal(view.controller.open("chat-a"), false); }); console.error("PROBE open refused; dialogs", view.container.querySelectorAll(\'[role="dialog"]\').length);')
          s = s.replace('} finally { view.close(); }', '} finally { console.error("PROBE close"); view.close(); console.error("PROBE closed"); }')
          p.write_text(s)
          PY
          timeout --signal=TERM --kill-after=10s 120s /usr/bin/time -v node --max-old-space-size=1024 --require ./tests/helpers/register-server-only.cjs tests/htpr-8988-chat-window-layout.test.cjs
