name: Feature map coverage

on:
  workflow_dispatch:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    branches: [production]
    paths:
      - src/app/**
      - src/lib/flags/definitions/**
      - .claude/skills/verify-qa/reference/feature-map/**
      - .github/scripts/feature-map-coverage.cjs
      - .github/workflows/feature-map-coverage.yml
      - tests/feature-map-coverage.test.cjs

permissions:
  contents: read

concurrency:
  group: feature-map-coverage-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  feature-map-coverage:
    name: feature-map-coverage
    if: github.event_name != 'pull_request' || github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: ^24.22.1
          check-latest: true
      - name: Test coverage counter
        run: node --test tests/feature-map-coverage.test.cjs
      - name: Report feature map coverage
        run: node .github/scripts/feature-map-coverage.cjs
