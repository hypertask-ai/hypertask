# Base gitleaks rules for every repo agents push to (YPER4-324). Copied to each repo as
# .gitleaks.toml; add that repo's known false positives to its [allowlist] with a comment why.
[extend]
useDefault = true

# The default rules missed a Cloudflare token written as `value <token>` in a markdown table
# (agent-fleet 6ac2c153), so a 40-character token near a Cloudflare word counts as a key.
[[rules]]
id = "cloudflare-token-named-nearby"
description = "Cloudflare API token with Cloudflare named on the same line"
regex = '''(?i)(?:cloudflare|\bcf\b|\bcf_|wrangler)[^\n]{0,120}?[`'"= ]([A-Za-z0-9_-]{40})(?:[`'"\s]|$)'''
secretGroup = 1
entropy = 3.5
keywords = ["cloudflare", "cf", "wrangler"]

# A long random value in quotes or backticks next to token, secret, key or password.
[[rules]]
id = "quoted-token-named-nearby"
description = "Quoted long random value next to the word token, secret, key or password"
regex = '''(?i)(?:token|secret|api[ _-]?key|password)[^\n]{0,60}?[`'"]([A-Za-z0-9_-]{32,})[`'"]'''
secretGroup = 1
entropy = 4.0
keywords = ["token", "secret", "key", "password"]

# Proven non-secrets, matched by line because a finding carries no context of its own
# (HYCI-405). The custom rules above and gitleaks' sourcegraph rule read a 40-character git
# commit SHA as a key when it sits near cloudflare, sourcegraph or a commit word, so inherited
# files copied to a new path blocked the docs move. Every entry below needs the git SHA shape
# and its documented place; a key-shaped value anywhere else still blocks.
[allowlist]
description = "Git commit SHAs quoted in records, GitHub URLs and prose"
regexTarget = "line"
regexes = [
  # A commit field in a JSON record, for example "previousCommit": "<sha>".
  '''"(?:sha|commit|commits|previousCommit|previousSha|sourceCommit|provenanceCommit|pinnedCommit|mergeCommit|headCommit)"\s*:\s*"[0-9a-f]{40}"''',
  # A commit SHA inside a GitHub URL path.
  '''/(?:tree|commits?|blob)/[0-9a-f]{40}(?:[`'"\s)#,)]|$)''',
  # A commit SHA in backticks after the word commit, sha or at.
  '''(?:commit|sha|at) `[0-9a-f]{40}`''',
  # A commit SHA pinned after a hash in backticks, for example `owner/repo#<sha>`.
  '''#[0-9a-f]{40}`''',
]
