  unproven_not_pass: [dependency_or_lockfile_difference, prisma_schema_difference, base_setup_failure, test_outside_tests]
  tests_outside_tests: reported_as_unreplayable
  node_major: 24
  timeout_minutes: 30
  jobs_per_push: 1
  new_dependency: false
  paid_service: false
  forks_trusted: false

