version: 9
last_updated: 2026-10-24
purpose: "Fixed-cost CI with fast releases and a provider-neutral AI review gate. App CI runs on GitHub-hosted runners; the repo is public, so hosted minutes are free. The canonical reader-facing contract is docs/ci.md; this file is the machine-readable companion."

topology:
  orchestrator: github-actions
  compute: github-hosted-ubuntu-latest
  # The 2026-08-30 org switch to public hypertask-ai/hypertask retired the app
  # repo's self-hosted Contabo lanes (owner decision recorded 2026-09-02 in the
  # CI contract). The only self-hosted runners on the Contabo host belong to
  # the private reviewer and analytics repositories; app workflows cannot
  # schedule them.
  additional_runner_hosts: false
  vpn_for_runner_compute: false
  review_lane:
    # The Luna/Claude review workflow lives in the private reviewer repository
    # and runs on that repo's own self-hosted runner. It is not an app-repo lane.
    label: ai-review
    repository: valentinyeo/hypertask-reviewer
    dedicated_runners: [contabo-1]
    os_user: htreviewrunner
    # contabo-2 is not currently registered; the live CI alerting treats a single
    # offline review lane as an incident rather than a capacity change.
  production_branch: production
  # An administrator applied this setting through GitHub's repository API on
  # 2026-09-08. workflow_run loads its workflow file from the default branch,
  # so App Smoke depends on production remaining the default.
  repository_default_branch: production
  production_target: "Vercel project hypertasks-prod"
  # Housekeeping workflows (PR guards, push gitleaks, vercel-deploy-log,
  # app-smoke-request, parity-contract-trusted) also run on
  # ubuntu-latest; their implementation lives in .github/workflows/ and is not
  # duplicated here.

pr_job_budget:
  parallel_job_limit: 20
  normal_synchronize_before: 17
  normal_synchronize_after: 15
  opened_before: 18
  opened_after: 15
  excludes: [path_specific_jobs, previews, external_review]
  measurement: scripts/ci-jobs-per-push.sh
  pull_request_guards:
    workflow: .github/workflows/pr-guards.yml
    jobs: 1
    published_statuses: [secret-scan, next-public-secrets]
    read_only_pr_tokens: trusted_workflow_run_status_only_pass
  trusted_pull_request_guards:
    workflow: .github/workflows/pr-guards-trusted.yml
    jobs: 1
    published_statuses: [outside-pr-guard, pr-size, pr-title]
    checkout: production_only
    candidate_code_execution: false
  serialized_reconciliation_guards:
    - workflow: .github/workflows/feature-flag-gate.yml
      jobs: 2
      published_statuses: [feature-flag-gate, reconcile-feature-flag-gate]
      concurrency_group: feature-flag-gate-production
      cancel_in_progress: false
    - workflow: .github/workflows/ux-signoff-gate.yml
      jobs: 1
      published_statuses: [ux-signoff-gate, ux-signoff]
      concurrency_group: ux-signoff-gate
      cancel_in_progress: false
  context_publication: commit_status_per_guard_and_fail_closed_aggregate_job
  isolated_guards:
    node_version: vercel_secret_runner_separate_from_candidate_scripts
    parity_contract: candidate_data_checkout_keeps_read_only_token_and_no_mcp_secret
  codeql: default_setup_no_path_filter_without_advanced_setup

review_first_gate:
  # Owner decision 2026-08-26 made CI wait for the full-ci label. Retired
  # 2026-09-30 (HTPR-6734, HR-04): a label-gated run showed SKIPPED, which the
  # ruleset counts as passing. ci-tests and browser-smoke now run on every
  # non-draft PR; the full-ci label is still applied but gates nothing.
  # Agents run no production builds and no full suites locally; the only
  # production build anywhere is Vercel's deploy build.
  pr_ci_build_requires_label: none
  label_applied_by: pr-feedback-timer-on-review-success
  local_agent_verification: [tsc-noEmit, targeted-tests]

required_checks:
  # An administrator applied these checks through GitHub's ruleset API on
  # 2026-09-08. ci-tests verifies this live ruleset before every build.
  # claude-review is the reviewer's legacy status name; the live ruleset
  # still requires it next to ai-review (HTPR-6734).
  contexts: [app-smoke, browser-smoke, ci-tests, ai-review, claude-review, feature-flag-gate, pr-title, next-public-secrets, secret-scan, premerge-evidence]
  automerge_also_requires: [app-smoke, browser-smoke, ci-tests, feature-flag-gate]
  # ci-tests and browser-smoke report on every non-draft PR; a missing or
  # skipped result is not green. Docs-only PRs succeed via conditional steps,
  # not job skips; existing guards remain mandatory.

premerge_evidence:
  context: premerge-evidence
  publisher: .claude/skills/ship/scripts/ship-check
  command: premerge-status
  discovery: systemd-user-timer
  timer: premerge-evidence.timer
  discovery_interval_seconds: 120
  cache_refresh_seconds: 600
  cache_invalidation: production_checker_bytes_sha256_each_sweep
  passes_every_pr: true
  new_flag_default_validation: separate_required_feature_flag_gate
  success_description: "test click removed (Valentin 2026-10-21)"
  browser_click_required: false
  screen_path_evaluation: false
  flag_removal_evaluation: false
  live_mode_reads: false
  recording_required: false
  safety_net: [feature_flags, revert, live_qa_after_release, screenshot_comparison]
  screenshot_comparison_ticket: "https://app.hypertask.ai/detail/project-4060/550"
  exact_head_commit_required: true
  open_production_pull_request_required: true
  publisher_serialization: shared_user_lock_validation_through_status_post
  fail_closed_on: [github_read_error, closed_pr, non_production_base, short_or_missing_head_sha, changed_head_or_base, publisher_lock_error, status_write_error]
  production_enforcement: production-required-checks-ruleset
  activation_prerequisite: statuses_seeded_on_all_open_production_pull_requests

ship_scripts_tests:
  context: ship-scripts-tests
  workflow: .github/workflows/ship-scripts-tests.yml
  runs_on: ubuntu-latest
  required: false
  pull_request_base: production
  paths: [".claude/skills/ship/scripts/**", ".claude/skills/verify-qa/scripts/**", ".claude/skills/scriptify/scripts/**", ".claude/skills/maintain-verification-skill/scripts/**", ".claude/systemd/**", "scripts/daily-stats*", "scripts/proc-watchdog*", "scripts/premerge-local.sh", ".github/workflows/ship-scripts-tests.yml", "docs/ci-policy.yml"]
  node_major: 24
  commands:
    - bash .claude/skills/ship/scripts/ship-check.test.sh --premerge-only
    - python3 .claude/skills/ship/scripts/premerge-evidence.test.py
    - python3 .claude/skills/ship/scripts/ci-why.test.py
    - bash .claude/skills/ship/scripts/user-unit-check.test.sh
    - python3 .claude/skills/verify-qa/scripts/evidence-prune.test.py
    - node --test .claude/skills/verify-qa/scripts/qa-identity.test.mjs
  fixtures: offline_with_temporary_home_and_no_secrets

feature_map_weekly:
  context: feature-map-check
  workflow: .github/workflows/feature-map-weekly.yml
  runs_on: ubuntu-latest
  required: false
  cron_utc: "37 3 * * 1"
  triggers: [schedule, workflow_dispatch, pull_request]
  pull_request_base: production
  paths: [".claude/skills/maintain-verification-skill/**", ".claude/skills/verify-qa/reference/feature-map/**", ".github/workflows/feature-map-weekly.yml"]
  node_major: 24
  permissions: [contents_read]
  commands:
    - node --test .claude/skills/maintain-verification-skill/scripts/feature-map-check.test.mjs
    - node .claude/skills/maintain-verification-skill/scripts/feature-map-check.mjs
  fixtures: offline_with_temporary_home_and_no_secrets
  app_driving: false

premerge_verify_qa:
  ticket: https://app.hypertask.ai/detail/project-4060/673
  context: browser-smoke
  required: false
  report_only: true
  blocks_merge: false
  script: .github/scripts/verify-qa-premerge.mjs
  artifact: verify-qa-premerge
  selection: most_changed_feature_map_page
  unmatched_verdict: "UNREACHABLE: no driver"
  tagged_journeys: e2e/smoke/journeys.spec.ts
  tagged_journeys_opt_in: HT_QA_JOURNEYS=1
  app_smoke_build_reuse: deferred

ai_model_watch:
  workflow: .github/workflows/ai-model-watch.yml
  runs_on: ubuntu-latest
  required: false
  cron_utc: "43 5 * * *"
  triggers: [schedule, workflow_dispatch]
  trusted_code_ref: event_production_sha
  workflow_dispatch: production_only
  node_major: 24
  timeout_minutes: 10
  permissions: [contents_read]
  concurrency_group: ai-model-watch
  cancel_in_progress: false
  commands:
    - node --test tests/model-diff.test.cjs
    - node scripts/model-diff --json
    - node .github/scripts/ai-model-watch.cjs
  fixtures: offline_synthetic_no_secrets
  ticket_project_id: 15
  ticket_section_id: 4389
  ticket_secret: HYPERTASK_MCP_TOKEN
  optional_provider_secrets: [OPENAI_API_KEY, ANTHROPIC_API_KEY]
  deduplication: stable_title_search_and_idempotency_key
  fail_closed_on: [no_discovery_sources, failed_search, partial_search, malformed_search, truncated_search]
  premium_input_usd_per_million_tokens_over: 5
  premium_waits_for: HTPR-7746
  automatic_model_changes: false

ux_signoff:
  context: ux-signoff
  workflow: .github/workflows/ux-signoff-gate.yml
  script: .github/scripts/ux-signoff-gate.mjs
  # HT Product Lead flips this after statuses are seeded on all open PRs.
  required: false

light_gate_dependencies:
  workflow: .github/workflows/node-version-guard.yml
  job: node-version-guard
  test: tests/light-gate-dependencies.test.cjs
  command: node --test tests/light-gate-dependencies.test.cjs
  parser_locks: [.github/scripts/node-version-guard/package-lock.json, .github/scripts/feature-flag-parser/package-lock.json]
  scope: per_job_transitive_imports_of_light_gate_node_scripts
  excludes: [visual_runner_full_installs, private_scheduled_speed_measurements]
  missing_install_negative_control: feature_flag_gate_both_jobs
  parser_load_failures: [unset_path, missing_file]

feature_flag_gate:
  workflow: .github/workflows/feature-flag-gate.yml
  decision_script: .github/scripts/feature-flag-gate.mjs
  runs_on: ubuntu-latest
  trusted_script_source: production_base_commit
  parser_lock: .github/scripts/feature-flag-parser/package-lock.json
  parser_path_env: FEATURE_FLAG_TYPESCRIPT_PATH
  missing_parser_exit_code: 2
  required_for_ui_changes: true
  api_only_changes: outside_ui_gate_scope
  owner_merge_for_flagged_ui: true
  owner_merge_for_exempt_ui: true
  exemptions: [BUGFIX, INFRA, AI_CHAT, verified_auto_revert, REFACTOR]
  exempt_ui_addition_limit: 150
  # A valid [REFACTOR] title may skip the flag requirement when at most 150 risky
  # new UI lines (JSX or strings, excluding Pick-key union members) remain after
  # matching normalized additions against removed lines in any file; moved code
  # does not use this budget, and owner merge is still required.
  # Valentin decided this on 2026-10-02 in https://app.hypertask.ai/detail/project-15/6506;
  # the title alone is not proof of cleanup, and new behavior still needs a flag.
  refactor_risky_new_ui_line_limit: 150
  default_mode_for_new_flags: EVERYONE
  new_flag_default_mode_exceptions: [bugfix, internal, releaseRisk.highRisk]
  everyone_default_forbidden_for: [internal, releaseRisk.highRisk]
  registry_validation_before_ui_title_and_label_exemptions: true
  default_mode_for_bugfix_flags: EVERYONE
  registry_kind: optional_feature_bugfix_improvement_default_feature
  bugfix_flag_exemptions: [saved_data, security, crashes]
  # BUGFIX remains only a mechanical exemption; review enforces bugfix flags.
  # Bugfix flags share ticket naming. /api/cron/feature-flag-removals files cleanup after 7 days on Everyone; money, access and data-deletion stay at 14 days.
  open_pull_request_reconciliation: production_push_and_all_pull_request_events

policies:
  previews:
    verification: opt-in
    required_for_every_pull_request: false
  actions_pull_requests:
    repository_creation_setting: enabled
  concurrency:
    cancel_superseded_pull_request_runs: true
    cancel_production_push_runs: false
    app_smoke_production_cache_cancel_superseded: true
    app_smoke_workflow_runs: per_run_validation_and_report_only_validated_current_head_builds_cancel_by_repository_branch
    non_cancelling_reconciliation: [feature-flag-gate-production, ux-signoff-gate, dependabot-major-ticket]
    prefer_queue_over_oom: true
  review:
    # The reviewer repository owns provider order, models, and failover; this
    # contract records only the policy-level guarantees.
    engine: valentinyeo/hypertask-reviewer (reviewer/scripts/ai-review.mjs on its default branch)
    subscription_first_failover: true
    structured_output: strict-json-schema
    fail_closed_on: [quota, authentication, unavailable_binary, timeout, empty_response, malformed_response]
    valid_verdict_stops_failover: true
    required_check_name: ai-review
    legacy_check_name: claude-review
    private_repository_publication: commit-status
    completion_trigger: application-automerge-workflow-dispatch
    completion_fallback_sweep_minutes: 5
    trusted_base_workflow: true
    execute_pull_request_code: false
    exact_head_commit_required: true
    newest_compatibility_check_wins: true
    approve_passes: true
    concerns_fail_closed: true
    malformed_or_provider_error_fails_closed: true
    dispatch_broker:
      os_user: reviewdispatch
      discovery: systemd-timer
      discovery_interval_seconds: 30
      validates: [open_pr, production_base, same_repository_head, exact_head_sha]
      maximum_automatic_dispatches_per_head: 2
      dispatch_propagation_grace_minutes: 5
      reconciliation: [latest_ai_or_claude_review_commit_status, private_workflow_run_state]
    private_run_name_contract: "Review hypertasks PR #{pr} @ {head_sha}"
    general_runner_os_user_can_invoke_subscription_wrappers: false
    general_runner_os_user_can_invoke_dispatch_broker: false
    stale_private_temp_cleanup_minutes: 60
    producer_hold_requires_independent_release_session: true
  deploys:
    merge_to_production_deploys_via_vercel: true
    production_health_check_after_deploy: true
    failed_build_keeps_previous_deployment_live: true
    automatic_rollback:
      workflow: .github/workflows/prod-health.yml
      approval: "Valentin, 2026-10-03: https://app.hypertask.ai/detail/project-4060/21"
      triggers:
        health: unchallenged_definitive_failure_on_final_retry
        browser_smoke: second_consecutive_red_with_confirmed_application_failure
        core_actions: same_application_failure_confirmed_twice
      push_only: true
      manual_scheduled_build_and_alias_failures: alert_only
      revert: restore_pre_failure_tree_in_one_non_force_commit_including_later_merges
      promotion: older_ready_deployment_with_successful_push_smoke_only
      merge_freeze: MERGE_FREEZE_repository_variable_set_to_run_url
      loop_guard: existing_freeze_skips_all_rollback_operations_even_after_failure
      live_release_guard: revalidate_failing_sha_before_freeze_and_immediately_before_revert
      missing_credentials_or_unreadable_live_identity: fail_closed_without_mutations
      rollback_commit_guard: verified_auto_rollback_commit_is_never_reverted
      recovery:
        owner: trusted_claude_session
        prerequisites: "Investigate the incident, repair any failed rollback, verify the live production SHA and passing health/core-action/browser checks that can run. Do not clear just because a rollback was requested. Session merges must respect MERGE_FREEZE too."
        clear_command: "gh variable delete MERGE_FREEZE --repo hypertask-ai/hypertask"
        human_github_action_required: false
        note: "The next automatic merge sweep re-evaluates health. Green monitoring alone never clears the freeze; if the restored workflow is disabled or red, repair it before resuming merges."
  production_ruleset:
    required_status_checks: [app-smoke, browser-smoke, ci-tests, ai-review, claude-review, feature-flag-gate, pr-title, next-public-secrets, secret-scan, premerge-evidence]

ci_tests:
  # .github/workflows/ci-tests.yml; the file remains the implementation source.
  file: .github/workflows/ci-tests.yml
  runs_on: [ubuntu-latest]
  checks: [dependencies, prisma, typescript, lint, tests]
  docs_only:
    jobs: [ci-tests, browser-smoke]
    heavy_jobs: [app-smoke, browser-smoke]
    heavy_output: heavy_needed
    heavy_paths: ["docs/**", ".claude/**", "skills/**", ".agents/skills/**", "tests/**", "**/*.md"]
    heavy_always_run_paths: ["src/**", ".github/**", "scripts/**", "package.json", "package-lock.json"]
    app_smoke_success_description: "docs-only change, skipped"
    detector: .github/scripts/ci-change-scope.cjs
    paths: ["docs/**", ".claude/**", "scripts/self_hosted_agent/**", ".github/**", "*.md"]
    always_run_paths: [".github/workflows/ci-tests.yml", ".github/scripts/**"]
    markdown_matches_at_any_depth: false
    diff: exact_pr_base_sha_to_head_sha_no_renames_nul_delimited
    detection_before: [setup-node, dependencies, caches, docker]
    unknown_or_empty_diff: run_everything
    detector_failure: run_everything
    production_push: run_everything
    required_check_conclusion: success
    additional_jobs: false
    browser_services: job_level_services_start_before_scope
    contract_summary_exception: successful_browser_job_with_explicit_docs_only_output
  pull_request_types: [opened, synchronize, reopened, ready_for_review]
  metadata_restarts: false
  app_smoke_request_types: [opened, synchronize, reopened, ready_for_review]
  label_activation: none
  test_lanes:
    shards: 2
    shard_constant: CI_TEST_SHARDS
    required_check: ci-tests
    split: count, one file on exactly one shard
    pull_request: scoped via .github/scripts/select-tests.mjs from the trusted base-branch commit; full suite on dependency/schema changes
    push_production:
      scope: full
      coverage: false
      test_failure_action: infra_ticket_and_job_evidence_only
      telegram: confirmed_live_site_failures_and_rollback_only
      telegram_dedup: once_per_cause_per_utc_day
      previous_run_comparison: informational_only
      rollback_authority: current_production_health_probe

coverage_baseline:
  workflow: .github/workflows/coverage-nightly.yml
  context: coverage-nightly
  required_check: false
  runs_on: ubuntu-latest
  cron_utc: "17 2 * * *"
  workflow_dispatch: production_only
  trusted_code_ref: event_production_sha
  timeout_minutes: 60
  scope: full
  collection_env: NODE_V8_COVERAGE=coverage/raw
  report_command: npm run coverage:report
  report_only: true
  report_continue_on_error: true
  artifact_name: automated-test-coverage-${{ github.sha }}
  artifact_paths: [coverage/report/, coverage/critical-domains.json, coverage/critical-domains.md]
  retention_days: 30
  required_coverage_consumers: []

schema_drift_monitor:
  workflow: .github/workflows/schema-drift.yml
  runs_on: ubuntu-latest
  triggers: [nightly, successful_production_deployment, workflow_dispatch_production_only]
  required_check: false
  trusted_code_ref: production
  production_access: catalog_reads_only
  reader_secret: SCHEMA_READER_DATABASE_URL
  shadow: disposable_postgres_service
  failure_action: failed_workflow_with_named_schema_differences
  repair_automatically: false

agent_rules:
  - "Read docs/ci.md before changing workflows, runner labels, rulesets, or deployment checks."
  - "App CI runs on GitHub-hosted ubuntu-latest runners; do not re-register self-hosted app runners or add a VPN runner or extra host without a recorded decision."
  - "Never expose AI_REVIEW_GATEWAY_KEY to pull request code."
  - "Never store subscription credentials in the repository or expose them to jobs that execute pull request code."
  - "Require a current-commit APPROVE verdict; a comment existing is not enough."
  - "Keep DeepSeek-produced PRs on hold until an independent trusted release session accepts them."
  - "Keep contabo-1 registered only to valentinyeo/hypertask-reviewer under htreviewrunner; application PR workflows must not be able to schedule it."
  - "The reviewer repository owns the review provider order, models, and failover; do not duplicate them here."
  - "Keep remote workflow actions pinned to the exact SHAs in .github/actions/action-archive-cache-manifest.txt; the host-level action archive cache serves the self-hosted review and analytics lanes only."
  - "Use per-job temporary directories on shared runner hosts; never use fixed /tmp filenames for workflow state."
  - "The live CI page must alert when the review or analytics runner lane is offline."
