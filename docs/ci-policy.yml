  script: .github/scripts/bugfix-regression-check.mjs
  mode: report_only
  required: false
  triggers: [pull_request]
  pull_request_types: [opened, synchronize, reopened, edited, ready_for_review, labeled, unlabeled]
  pull_request_base: production
  signal: bugfix_title_tag
  exemption: [no-regression-test_label, written_reason_in_the_pull_request_body]
  replay: changed_tests_in_tests_run_on_the_merge_base_and_the_pull_request_head
